# Real years: which phase each driver held, read from the index datasets
# named in `source` with the threshold rule written in that source's citation
# (data/links.yaml). One row per driver per year; a driver absent from a
# year is "not recorded". Coverage: ENSO 1950–2025; the Indian Ocean Dipole,
# the NAO, the SAM, the PDO, the AMO and the Atlantic Niño 1980–2025. The
# reading is the same for every driver: the entry is the event that began
# earliest in the year, else the one already under way when the year began
# (onset_year says when), else neutral. Other events of the year are named
# in index_note. See docs/DATA_FORMAT.md.

years:
  - year: 1950
    note: >
      The record opens inside the La Niña of 1949–50, which faded by July; the
      rest of the year was neutral. Only ENSO is recorded before 1980, so the
      map shows one driver.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: la_nina
        onset_month: 1
        duration_months: 7
        index_note: "The index begins in January 1950 with this La Niña already under way (it had begun in 1949); ONI was −1.5 in January and the event ended in July."
        source: noaa_oni_index
  - year: 1951
    note: >
      A moderate El Niño developed from June and peaked in the autumn at just
      over +1 °C, ending in January 1952.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 6
        duration_months: 8
        index_note: "ONI peaked at +1.1 °C in September–November 1951; at or beyond ±0.5 for 8 overlapping seasons, May–July 1951 to December 1951–February 1952."
        source: noaa_oni_index
  - year: 1952
    note: >
      The El Niño of 1951 ended in January and the Pacific stayed neutral for
      the rest of 1952. Nothing new began, so the map runs from that event's
      onset in June 1951.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 6
        onset_year: 1951
        duration_months: 8
        index_note: "Already under way: ONI peaked at +1.1 °C in September–November 1951; at or beyond ±0.5 for 8 overlapping seasons, May–July 1951 to December 1951–February 1952."
        source: noaa_oni_index
  - year: 1953
    note: >
      A weak but long El Niño: the index stayed just above the threshold from
      February to the following January without ever reaching +1 °C.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 2
        duration_months: 12
        index_note: "ONI peaked at +0.8 °C in September–November 1953; at or beyond ±0.5 for 12 overlapping seasons, January–March 1953 to December 1953–February 1954."
        source: noaa_oni_index
  - year: 1954
    note: >
      The long La Niña of the mid-1950s began in May and held for more than
      two years, to August 1956, peaking near −1.7 °C in late 1955.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: la_nina
        onset_month: 5
        duration_months: 28
        index_note: "ONI peaked at -1.7 °C in October–December 1955; at or beyond ±0.5 for 28 overlapping seasons, April–June 1954 to July–September 1956. The El Niño that began in February 1953 ended in December 1953–February 1954."
        source: noaa_oni_index
  - year: 1955
    note: >
      La Niña all year, the middle of the 1954–56 event and its coldest
      stretch. Nothing new began, so the map runs from the onset in May 1954.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: la_nina
        onset_month: 5
        onset_year: 1954
        duration_months: 28
        index_note: "Already under way: ONI peaked at -1.7 °C in October–December 1955; at or beyond ±0.5 for 28 overlapping seasons, April–June 1954 to July–September 1956."
        source: noaa_oni_index
  - year: 1956
    note: >
      The 1954–56 La Niña finally ended in August 1956; the Pacific was
      neutral by the autumn. Nothing new began, so the map still runs from May
      1954 and does not reach this year.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: la_nina
        onset_month: 5
        onset_year: 1954
        duration_months: 28
        index_note: "Already under way: ONI peaked at -1.7 °C in October–December 1955; at or beyond ±0.5 for 28 overlapping seasons, April–June 1954 to July–September 1956."
        source: noaa_oni_index
  - year: 1957
    note: >
      A strong El Niño developed from April 1957, peaked at about +1.8 °C in
      January 1958 and lasted sixteen months, one of the larger events of the
      century's middle decades.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 4
        duration_months: 16
        index_note: "ONI peaked at +1.8 °C in December 1957–February 1958; at or beyond ±0.5 for 16 overlapping seasons, March–May 1957 to June–August 1958."
        source: noaa_oni_index
  - year: 1958
    note: >
      The 1957–58 El Niño ended in July, and a second, weak warm spell
      qualified from November 1958 to March 1959. The table takes the event
      that began this year.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 11
        duration_months: 5
        index_note: "ONI peaked at +0.6 °C in January–March 1959; at or beyond ±0.5 for 5 overlapping seasons, October–December 1958 to February–April 1959. The El Niño that began in April 1957 ended in June–August 1958."
        source: noaa_oni_index
  - year: 1959
    note: >
      The weak El Niño of the winter faded by March; the rest of 1959 was
      neutral. Nothing new began, so the map runs from November 1958.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 11
        onset_year: 1958
        duration_months: 5
        index_note: "Already under way: ONI peaked at +0.6 °C in January–March 1959; at or beyond ±0.5 for 5 overlapping seasons, October–December 1958 to February–April 1959."
        source: noaa_oni_index
  - year: 1960
    note: >
      Neutral all year: the index never left the −0.5 to +0.5 °C band for long
      enough to count.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: neutral
        index_note: "ONI stayed between −0.5 and +0.5 °C, or beyond it for fewer than five seasons in a row; largest three-month mean +0.3 in August–October 1960."
        source: noaa_oni_index
  - year: 1961
    note: >
      Neutral all year by the index. The Bureau of Meteorology lists a
      positive Indian Ocean Dipole for 1961, but the dipole is not recorded on
      this table before 1980.
    sources: [noaa_oni_index, bom_iod]
    drivers:
      - driver: enso
        phase: neutral
        index_note: "ONI stayed between −0.5 and +0.5 °C, or beyond it for fewer than five seasons in a row; largest three-month mean -0.3 in August–October 1961."
        source: noaa_oni_index
  - year: 1962
    note: >
      A neutral year with a slight cool lean through the second half, short of
      a La Niña.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: neutral
        index_note: "ONI stayed between −0.5 and +0.5 °C, or beyond it for fewer than five seasons in a row; largest three-month mean -0.4 in November 1962–January 1963."
        source: noaa_oni_index
  - year: 1963
    note: >
      A moderate El Niño from June, peaking near +1.4 °C in November and
      ending in February 1964.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 6
        duration_months: 9
        index_note: "ONI peaked at +1.4 °C in October–December 1963; at or beyond ±0.5 for 9 overlapping seasons, May–July 1963 to January–March 1964."
        source: noaa_oni_index
  - year: 1964
    note: >
      A weak La Niña from May to January 1965, following straight on from the
      1963–64 El Niño.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: la_nina
        onset_month: 5
        duration_months: 9
        index_note: "ONI peaked at -0.8 °C in October–December 1964; at or beyond ±0.5 for 9 overlapping seasons, April–June 1964 to December 1964–February 1965. The El Niño that began in June 1963 ended in January–March 1964."
        source: noaa_oni_index
  - year: 1965
    note: >
      A strong El Niño from June 1965, peaking at about +2 °C in October, one
      of the major events before the satellite era.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 6
        duration_months: 11
        index_note: "ONI peaked at +2.0 °C in September–November 1965; at or beyond ±0.5 for 11 overlapping seasons, May–July 1965 to March–May 1966. The La Niña that began in May 1964 ended in December 1964–February 1965."
        source: noaa_oni_index
  - year: 1966
    note: >
      The 1965–66 El Niño faded by April; the rest of 1966 was neutral.
      Nothing new began, so the map runs from June 1965.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 6
        onset_year: 1965
        duration_months: 11
        index_note: "Already under way: ONI peaked at +2.0 °C in September–November 1965; at or beyond ±0.5 for 11 overlapping seasons, May–July 1965 to March–May 1966."
        source: noaa_oni_index
  - year: 1967
    note: >
      Neutral all year, with a cool lean in the second half that did not reach
      the threshold.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: neutral
        index_note: "ONI stayed between −0.5 and +0.5 °C, or beyond it for fewer than five seasons in a row; largest three-month mean -0.5 in February–April 1967."
        source: noaa_oni_index
  - year: 1968
    note: >
      A weak El Niño from October 1968 to May 1969, the first of two
      back-to-back warm events.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 10
        duration_months: 8
        index_note: "ONI peaked at +1.1 °C in December 1968–February 1969; at or beyond ±0.5 for 8 overlapping seasons, September–November 1968 to April–June 1969."
        source: noaa_oni_index
  - year: 1969
    note: >
      After the winter's El Niño faded in May, a second weak one qualified
      from August to January 1970. The table takes the event that began this
      year.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 8
        duration_months: 6
        index_note: "ONI peaked at +0.9 °C in September–November 1969; at or beyond ±0.5 for 6 overlapping seasons, July–September 1969 to December 1969–February 1970. The El Niño that began in October 1968 ended in April–June 1969."
        source: noaa_oni_index
  - year: 1970
    note: >
      A long La Niña from July 1970 to January 1972, peaking near −1.4 °C in
      early 1971.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: la_nina
        onset_month: 7
        duration_months: 19
        index_note: "ONI peaked at -1.4 °C in January–March 1971; at or beyond ±0.5 for 19 overlapping seasons, June–August 1970 to December 1971–February 1972. The El Niño that began in August 1969 ended in December 1969–February 1970."
        source: noaa_oni_index
  - year: 1971
    note: >
      La Niña all year, the middle of the 1970–72 event. Nothing new began, so
      the map runs from July 1970.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: la_nina
        onset_month: 7
        onset_year: 1970
        duration_months: 19
        index_note: "Already under way: ONI peaked at -1.4 °C in January–March 1971; at or beyond ±0.5 for 19 overlapping seasons, June–August 1970 to December 1971–February 1972."
        source: noaa_oni_index
  - year: 1972
    note: >
      A strong El Niño from May 1972, peaking above +2 °C in December, one of
      the three largest events before 1982.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 5
        duration_months: 11
        index_note: "ONI peaked at +2.1 °C in November 1972–January 1973; at or beyond ±0.5 for 11 overlapping seasons, April–June 1972 to February–April 1973. The La Niña that began in July 1970 ended in December 1971–February 1972."
        source: noaa_oni_index
  - year: 1973
    note: >
      The 1972–73 El Niño ended in March and a strong La Niña set in from May,
      reaching −2 °C by December.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: la_nina
        onset_month: 5
        duration_months: 15
        index_note: "ONI peaked at -2.0 °C in November 1973–January 1974; at or beyond ±0.5 for 15 overlapping seasons, April–June 1973 to June–August 1974. The El Niño that began in May 1972 ended in February–April 1973."
        source: noaa_oni_index
  - year: 1974
    note: >
      The La Niña of 1973 broke in July, and a second one began in October
      1974 that would last to March 1976. The table takes the event that began
      this year.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: la_nina
        onset_month: 10
        duration_months: 18
        index_note: "ONI peaked at -1.6 °C in November 1975–January 1976; at or beyond ±0.5 for 18 overlapping seasons, September–November 1974 to February–April 1976. The La Niña that began in May 1973 ended in June–August 1974."
        source: noaa_oni_index
  - year: 1975
    note: >
      La Niña all year, the middle of the 1974–76 event, peaking near −1.7 °C
      in December. Nothing new began, so the map runs from October 1974.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: la_nina
        onset_month: 10
        onset_year: 1974
        duration_months: 18
        index_note: "Already under way: ONI peaked at -1.6 °C in November 1975–January 1976; at or beyond ±0.5 for 18 overlapping seasons, September–November 1974 to February–April 1976."
        source: noaa_oni_index
  - year: 1976
    note: >
      A weak El Niño from September 1976 to February 1977, in the year the
      North Pacific flipped to the warm phase of the Pacific Decadal
      Oscillation that would hold until the late 1990s.
    sources: [noaa_oni_index, mantua_1997]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 9
        duration_months: 6
        index_note: "ONI peaked at +0.9 °C in October–December 1976; at or beyond ±0.5 for 6 overlapping seasons, August–October 1976 to January–March 1977. The La Niña that began in October 1974 ended in February–April 1976."
        source: noaa_oni_index
  - year: 1977
    note: >
      A second weak El Niño from September 1977 to January 1978, following the
      one of the previous winter.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 9
        duration_months: 5
        index_note: "ONI peaked at +0.8 °C in October–December 1977; at or beyond ±0.5 for 5 overlapping seasons, August–October 1977 to December 1977–February 1978. The El Niño that began in September 1976 ended in January–March 1977."
        source: noaa_oni_index
  - year: 1978
    note: >
      The winter's weak El Niño faded in January; the rest of 1978 was
      neutral. Nothing new began, so the map runs from September 1977.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 9
        onset_year: 1977
        duration_months: 5
        index_note: "Already under way: ONI peaked at +0.8 °C in October–December 1977; at or beyond ±0.5 for 5 overlapping seasons, August–October 1977 to December 1977–February 1978."
        source: noaa_oni_index
  - year: 1979
    note: >
      Neutral by the five-season rule: the index rose to about +0.6 °C in the
      winter of 1979–80 but held above the threshold for only three seasons.
    sources: [noaa_oni_index]
    drivers:
      - driver: enso
        phase: neutral
        index_note: "ONI stayed between −0.5 and +0.5 °C, or beyond it for fewer than five seasons in a row; largest three-month mean +0.6 in November 1979–January 1980."
        source: noaa_oni_index
  - year: 1980
    note: >
      A quiet Pacific and a busy Indian Ocean: ENSO stayed neutral, a negative
      dipole held from June to December, and the NAO winter was mildly
      positive. The first year with all seven drivers recorded.
    sources: [noaa_oni_index, psl_dmi_hadisst_index, cpc_nao_index]
    drivers:
      - driver: enso
        phase: neutral
        index_note: "ONI stayed between −0.5 and +0.5 °C, or beyond it for fewer than five seasons in a row; largest three-month mean +0.6 in December 1979–February 1980."
        source: noaa_oni_index
      - driver: iod
        phase: negative
        onset_month: 6
        duration_months: 7
        index_note: "Dipole Mode Index (HadISST, three-month mean) peaked at -0.7 °C in August 1980; beyond ±0.35 for 7 overlapping seasons, June 1980 to December 1980."
        source: psl_dmi_hadisst_index
      - driver: nao
        phase: positive
        onset_month: 12
        duration_months: 3
        index_note: "December 1980–February 1981 mean of the CPC index +0.69 (standardised units)."
        source: cpc_nao_index
      - driver: sam
        phase: negative
        onset_month: 3
        duration_months: 2
        index_note: "Marshall index (three-month mean) peaked at -2.0 in March 1980; beyond ±1.5 for 2 overlapping seasons, March 1980 to April 1980."
        source: marshall_sam_index
      - driver: pdo
        phase: neutral
        index_note: "Calendar-year mean +0.31 °C, inside ±0.5."
        source: ncei_pdo_index
      - driver: amo
        phase: neutral
        index_note: "Calendar-year mean -0.05 °C (detrended), inside ±0.1."
        source: psl_amo_kaplan_index
      - driver: atlantic_nino
        phase: cool
        onset_month: 2
        duration_months: 2
        index_note: "ATL3 anomaly (three-month mean) peaked at -0.6 °C in February 1980; beyond ±0.5 for 2 overlapping seasons, February 1980 to March 1980. Also a cool event from November 1980 (6 seasons, peak -0.8): the table takes the first event of the year."
        source: ersst_atl3_index
  - year: 1981
    note: >
      ENSO neutral again, with another negative dipole in the late summer. The
      Atlantic settled into the cool phase of its multidecadal swing that the
      index holds until 1986.
    sources: [noaa_oni_index, psl_dmi_hadisst_index, psl_amo_kaplan_index]
    drivers:
      - driver: enso
        phase: neutral
        index_note: "ONI stayed between −0.5 and +0.5 °C, or beyond it for fewer than five seasons in a row; largest three-month mean -0.5 in January–March 1981."
        source: noaa_oni_index
      - driver: iod
        phase: negative
        onset_month: 7
        duration_months: 4
        index_note: "Dipole Mode Index (HadISST, three-month mean) peaked at -0.7 °C in September 1981; beyond ±0.35 for 4 overlapping seasons, July 1981 to October 1981."
        source: psl_dmi_hadisst_index
      - driver: nao
        phase: neutral
        index_note: "December 1981–February 1982 mean of the CPC index +0.08 (standardised units)."
        source: cpc_nao_index
      - driver: sam
        phase: neutral
        index_note: "No run of two overlapping seasons beyond ±1.5 in the Marshall index; strongest three-month mean -1.7 in April."
        source: marshall_sam_index
      - driver: pdo
        phase: positive
        onset_month: 1
        duration_months: 12
        index_note: "Calendar-year mean +0.84 °C; the same phase in every year 1981."
        source: ncei_pdo_index
      - driver: amo
        phase: negative
        onset_month: 1
        duration_months: 72
        index_note: "Calendar-year mean -0.11 °C (detrended); the same phase in every year 1981–1986."
        source: psl_amo_kaplan_index
      - driver: atlantic_nino
        phase: cool
        onset_month: 11
        onset_year: 1980
        duration_months: 6
        index_note: "Already under way: ATL3 anomaly (three-month mean) peaked at -0.8 °C in January 1981; beyond ±0.5 for 6 overlapping seasons, November 1980 to April 1981."
        source: ersst_atl3_index
  - year: 1982
    note: >
      The great El Niño of 1982–83 began in May and had reached +2.2 °C by
      December, then the strongest on record and largely unforeseen; El
      Chichón erupted in Mexico the same spring. A weak positive dipole
      followed in the autumn and the equatorial Atlantic was cool.
    sources: [noaa_oni_index, barber_chavez_1983, glynn_1984, robock_2000, psl_dmi_hadisst_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 5
        duration_months: 14
        index_note: "ONI peaked at +2.2 °C in November 1982–January 1983; at or beyond ±0.5 for 14 overlapping seasons, April–June 1982 to May–July 1983."
        source: noaa_oni_index
      - driver: iod
        phase: positive
        onset_month: 9
        duration_months: 2
        index_note: "Dipole Mode Index (HadISST, three-month mean) peaked at +0.4 °C in October 1982; beyond ±0.35 for 2 overlapping seasons, September 1982 to October 1982."
        source: psl_dmi_hadisst_index
      - driver: nao
        phase: positive
        onset_month: 12
        duration_months: 3
        index_note: "December 1982–February 1983 mean of the CPC index +0.95 (standardised units)."
        source: cpc_nao_index
      - driver: sam
        phase: positive
        onset_month: 3
        duration_months: 3
        index_note: "Marshall index (three-month mean) peaked at +2.6 in March 1982; beyond ±1.5 for 3 overlapping seasons, March 1982 to May 1982. Also negative SAM from November 1982 (2 seasons, peak -2.3): the table takes the first event of the year."
        source: marshall_sam_index
      - driver: pdo
        phase: neutral
        index_note: "Calendar-year mean -0.26 °C, inside ±0.5."
        source: ncei_pdo_index
      - driver: amo
        phase: negative
        onset_month: 1
        onset_year: 1981
        duration_months: 72
        index_note: "Calendar-year mean -0.24 °C (detrended); the same phase in every year 1981–1986."
        source: psl_amo_kaplan_index
      - driver: atlantic_nino
        phase: cool
        onset_month: 6
        duration_months: 7
        index_note: "ATL3 anomaly (three-month mean) peaked at -0.9 °C in July 1982; beyond ±0.5 for 7 overlapping seasons, June 1982 to December 1982."
        source: ersst_atl3_index
  - year: 1983
    note: >
      The 1982–83 El Niño held until June, bringing floods to the coast of
      Peru and Ecuador and coral death across the eastern Pacific, with
      drought in Australia and Indonesia. The North Pacific entered a warm
      year and the Atlantic stayed cool.
    sources: [noaa_oni_index, glynn_1984, barber_chavez_1983, bom_enso_australia, ncei_pdo_index]
    drivers:
      - driver: enso
        phase: el_nino
        onset_month: 5
        onset_year: 1982
        duration_months: 14
        index_note: "Already under way: ONI peaked at +2.2 °C in November 1982–January 1983; at or beyond ±0.5 for 14 overlapping seasons, April–June 1982 to May–July 1983."
        source: noaa_oni_index
      - driver: iod
        phase: neutral
        index_note: "Dipole Mode Index (HadISST) stayed within ±0.35 °C in June–November, or beyond it for one season only; largest three-month mean +0.41 in July."
        source: psl_dmi_hadisst_index
      - driver: nao
        phase: positive
        onset_month: 12
        duration_months: 3
        index_note: "December 1983–February 1984 mean of the CPC index +0.89 (standardised units)."
        source: cpc_nao_index
      - driver: sam
        phase: positive
        onset_month: 10
        duration_months: 2
        index_note: "Marshall index (three-month mean) peaked at +2.5 in November 1983; beyond ±1.5 for 2 overlapping seasons, October 1983 to November 1983."
        source: marshall_sam_index
      - driver: pdo
        phase: positive
        onset_month: 1
        duration_months: 24
        index_note: "Calendar-year mean +1.25 °C; the same phase in every year 1983–1984."
        source: ncei_pdo_index
      - driver: amo
        phase: negative
        onset_month: 1
        onset_year: 1981
        duration_months: 72
        index_note: "Calendar-year mean -0.10 °C (detrended); the same phase in every year 1981–1986."
        source: psl_amo_kaplan_index
      - driver: atlantic_nino
        phase: cool
        onset_month: 4
        duration_months: 4
        index_note: "ATL3 anomaly (three-month mean) peaked at -0.8 °C in May 1983; beyond ±0.5 for 4 overlapping seasons, April 1983 to July 1983. Also a cool event from September 1983 (1 season, peak -0.5): the table takes the first event of the year."
        source: ersst_atl3_index
  - year: 1984
    note: >
      A weak La Niña from October, a long negative dipole from July, and a
      negative NAO winter. In this dataset the Atlantic's warm event of 1984
      registers only in August, weaker than the older analyses the 1984 story
      draws on.
    sources: [noaa_oni_index, psl_dmi_hadisst_index, cpc_nao_index, philander_1986, horel_1986, ersst_atl3_index]
    drivers:
      - driver: enso
        phase: la_nina
        onset_month: 10
        duration_months: 9
