      seasons, one short of a La Niña by the five-season rule (the 2016 story
      calls it a weak La Niña, as the earlier version of the index did). A
      negative dipole held from June to November and the equatorial Atlantic
      was warm. The QBO's westerly phase ran two years at 30 hPa, the
      disruption of February 2016 having cut through it one level lower; the
      autumn's ice was low and the October snow high, the pairing behind the
      snow story's missed forecast for 2016–17.
