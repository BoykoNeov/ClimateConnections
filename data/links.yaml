    sources: [hendon_2007, meneghini_2007]

  - id: positive_sam_east_australia_summer
    from: sam
    when: positive
    to: east_australia_rainfall
    effect: 1
    lag_months: [0, 1]
    season: [11, 12, 1, 2, 3, 4]
    confidence: probable
    mechanism: >
      In summer the positive phase brings more onshore easterly winds to the
      southern east coast, feeding moist air into New South Wales and cooling
      the hot inland, so summer rain tends to increase there.
    caveat: >
      The summer signal is weaker than the winter one, sits on the coast
      rather than inland, and can be swamped by ENSO; western Tasmania tends
      to dry at the same time.
    evidence_note: >
      Reported for daily rainfall on the southern east coast, with lower
      maximum temperatures over most of subtropical eastern Australia; the
      mode's summer footprint has shifted over the decades.
    sources: [hendon_2007, silvestri_vera_2009]

  - id: negative_sam_east_australia_summer
    from: sam
    when: negative
    to: east_australia_rainfall
    effect: -1
    lag_months: [0, 1]
    season: [11, 12, 1, 2, 3, 4]
    confidence: probable
    mechanism: >
      In spring and summer the negative phase weakens the onshore easterlies
      and lets hot, dry northwesterly winds from the interior cross eastern
      Australia, raising temperatures and fire danger and cutting rain.
    caveat: >
      Weeks of negative mode, not a season of it, drive most of the damage,
      and a wet La Niña can override the tendency; the strongest cases came
      after rare weakenings of the stratospheric polar vortex.
    evidence_note: >
      The spring of 2019, the most strongly negative on record, brought
      record heat and drought to subtropical eastern Australia ahead of the
      Black Summer fires; hot, dry springs have followed earlier vortex
      weakenings too.
    sources: [lim_2019, lim_2021, hendon_2007]

  - id: positive_sam_new_zealand
    from: sam
    when: positive
    to: new_zealand_summer
    effect: 1
    lag_months: [0, 1]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      In summer the positive phase weakens the westerlies over New Zealand
      as the belt contracts to the south; with less wind off the Southern
      Ocean the country tends to be warmer, and the western hills drier.
    caveat: >
      The effect is a summer one; in winter the mode's footprint over New
      Zealand is patchy, and ENSO's own summer wind pattern can pull the
      other way.
    evidence_note: >
      Station temperatures and rainfall follow the mode's summer wind change
      closely; the south of the country warms most, and the west coast
      dries.
    sources: [kidston_2009, gillett_2006]

  - id: negative_sam_new_zealand
    from: sam
    when: negative
    to: new_zealand_summer
    effect: -1
    lag_months: [0, 1]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      In summer the negative phase strengthens the westerlies over New
      Zealand as the belt spreads north, bringing more cool Southern Ocean
      air and more rain to the western hills.
    caveat: >
      A warm La Niña summer can override the cooling, and the effect is on
