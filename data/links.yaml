      tends to withdraw earlier and deliver a little less rain.
    caveat: >
      Mostly a model result; small against ENSO and the Indian Ocean, and
      shown as contested.
    sources: [zhang_delworth_2006, goswami_2006]

  # A warm North Atlantic tends to tilt the winter circulation toward a
  # negative NAO; contested, and a small tilt against the NAO's own swings.
  - id: positive_amo_negative_nao
    from: amo
    when: positive
    to: nao
    effect: -1
    lag_months: [0, 3]
    season: [12, 1, 2, 3]
    confidence: contested
    mechanism: >
      A warm North Atlantic warms and moistens the lower atmosphere over
      the ocean in winter, which is proposed to weaken the Icelandic low
      and the Azores high, the negative side of the NAO, partly by way of
      the stratosphere.
    caveat: >
      The NAO swings within weeks under its own weather, and the Atlantic's
      tilt is small and slow; it shows up in decade averages and in model
      experiments, not reliably in any one winter, so the link is shown as
      contested.
    evidence_note: >
      Model experiments forced with a warm North Atlantic produce a
      negative-NAO-like winter circulation, and the decadal record leans
      the same way, but the response depends on how the model treats the
      stratosphere and the observed record holds only a few phases.
    sources: [peings_magnusdottir_2014, omrani_2014]

  - id: negative_amo_positive_nao
    from: amo
    when: negative
    to: nao
    effect: 1
    lag_months: [0, 3]
    season: [12, 1, 2, 3]
    confidence: contested
    mechanism: >
      A cool North Atlantic is proposed to sharpen the winter contrast
      between the Icelandic low and the Azores high, the positive side of
      the NAO.
    caveat: >
      A small, slow tilt against the NAO's own swings, seen in decade
      averages and model experiments; shown as contested.
    evidence_note: >
      The composite and model results for the warm phase imply the reverse
      for the cool one; the positive-NAO winters of the late 1980s and
      early 1990s fell in a cool Atlantic phase.
    sources: [peings_magnusdottir_2014, omrani_2014]


  # ---- Atlantic Niño (M19). Events peak in June–August, in the West
  # African monsoon season, and fade by autumn; the map holds the phase
  # for the year, so the winter links (into ENSO) count their lag from a
  # May start.
  - id: atlantic_nino_guinea_coast
    from: atlantic_nino
    when: warm
    to: guinea_coast_rainfall
    effect: 1
    lag_months: [0, 1]
    season: [5, 6, 7]
    confidence: established
    mechanism: >
      Warm water in the Gulf of Guinea feeds the rain clouds over the
      coast directly and holds the tropical rain belt at the coast through
      its main rainy season, so the coast tends to be wetter.
    caveat: >
      The coast's rains also depend on when the rain belt jumps north to
      the Sahel; a weak or late event adds little, and a single wet month
      can come from the weather alone.
    evidence_note: >
      Wet years on the Guinea coast come with a weaker-than-usual cold
      tongue in early summer, the leading pattern of tropical Atlantic
      sea-temperature variability is coupled to rain on the Gulf of Guinea
      coast, and the review of the mode names the coast as its clearest
      rainfall footprint.
    sources: [wagner_da_silva_1994, polo_2008, lubbecke_2018]

  - id: atlantic_nina_guinea_coast
    from: atlantic_nino
    when: cool
    to: guinea_coast_rainfall
    effect: -1
    lag_months: [0, 1]
    season: [5, 6, 7]
    confidence: established
    mechanism: >
      A strong cold tongue off the Gulf of Guinea cools the air over the
      coast, starves the rain clouds and lets the rain belt leave the
      coast early, so the coast's rainy season tends to be weaker.
    caveat: >
      A single season can still be wet if the rain belt lingers; the
      tendency is clearest in strong events.
    sources: [wagner_da_silva_1994, lubbecke_2018]

  - id: atlantic_nino_sahel
    from: atlantic_nino
    when: warm
    to: sahel_rainfall
    effect: -1
    lag_months: [0, 2]
    season: [7, 8, 9]
    confidence: contested
    mechanism: >
      Warm water in the Gulf of Guinea holds the rain belt at the coast and
      keeps it from moving as far north as usual, so the Sahel tends to
      get less rain in a warm summer.
    caveat: >
      This coast–Sahel see-saw was clear before the 1970s and then nearly
      vanished: since then the Pacific and Indian Oceans have pulled the
      Sahel the other way in the same summers, and a warm Atlantic summer
      has often come with a wet Sahel.
    evidence_note: >
      Models forced with a warm equatorial Atlantic shift the rain belt
      toward the coast and dry the Sahel, and the pattern is in the older
      observations; but the see-saw broke down after the 1970s as the
      Sahel came to follow the whole tropics rather than the Atlantic
      alone, so the link is shown as contested.
    sources: [losada_2010, losada_2012, lamb_1978, nicholson_2013]

  - id: atlantic_nina_sahel
    from: atlantic_nino
    when: cool
    to: sahel_rainfall
    effect: 1
    lag_months: [0, 2]
    season: [7, 8, 9]
    confidence: contested
    mechanism: >
      A strong cold tongue in the Gulf of Guinea pushes the rain belt off
      the coast and further north than usual in summer, so the Sahel tends
      to get more rain.
    caveat: >
      Clear only in the older record; since the 1970s the Sahel has
      followed the Pacific and the Indian Ocean more than the Atlantic,
      and the see-saw with the coast has faded.
    sources: [losada_2010, losada_2012, lamb_1978]

  - id: atlantic_nino_indian_monsoon
    from: atlantic_nino
    when: warm
    to: indian_summer_monsoon
    effect: -1
    lag_months: [0, 1]
    season: [6, 7, 8, 9]
    confidence: contested
    mechanism: >
      Rain clouds rising over a warm equatorial Atlantic set up a wave in
      the upper air that reaches around the globe and sinks over India,
      which is proposed to hold back the monsoon a little.
    caveat: >
      A small effect next to ENSO's, found mainly in models and in the part
      of the monsoon record that ENSO does not explain; not every warm
      Atlantic summer brings a weak monsoon.
    evidence_note: >
      The part of Indian monsoon rainfall not tied to ENSO correlates with
      south equatorial Atlantic sea temperature in observations and model
      ensembles, and a simple wave mechanism reproduces the teleconnection;
      the signal is small and the link is shown as contested.
    sources: [kucharski_2008, kucharski_2009, lubbecke_2018]

  # A summer Atlantic Niño tends to be followed by a Pacific La Niña the
  # next winter, and an Atlantic Niña by an El Niño; seen since the 1970s.
  - id: atlantic_nino_la_nina
    from: atlantic_nino
    when: warm
    to: enso
    effect: -1
    lag_months: [5, 7]
    season: []
    confidence: probable
    mechanism: >
      Rain rising over a warm equatorial Atlantic in summer strengthens
      the east–west overturning of the tropical air, with air sinking over
      the central Pacific; the stronger trade winds there lift the cool
      water in the east and start the Pacific toward a La Niña by the
      following winter.
    caveat: >
      Seen since the late 1960s and not before, and a nudge rather than a
      trigger: the Pacific has its own timing, and a warm Atlantic summer
      inside a developing El Niño does not stop it.
    evidence_note: >
      Since the late 1960s summer Atlantic Niños have favoured
      following-winter Pacific La Niñas, and Atlantic Niñas Pacific El
      Niños, in the observations and in model runs where only the
      Atlantic is set from observations; the reverse link, from the
      Pacific to the Atlantic, is weak and inconsistent.
    sources: [rodriguez_fonseca_2009, ding_2012, lubbecke_2018, chang_2006]

  - id: atlantic_nina_el_nino
    from: atlantic_nino
    when: cool
    to: enso
    effect: 1
    lag_months: [5, 7]
    season: []
    confidence: probable
    mechanism: >
      A cold equatorial Atlantic in summer weakens the rain rising over it,
      which loosens the trade winds over the central Pacific and lets warm
      water spread east, starting the Pacific toward an El Niño by the
      following winter.
    caveat: >
      Seen since the late 1960s and not before; a nudge to the Pacific's
      own timing, not a trigger.
    evidence_note: >
      The same study that found Atlantic Niños ahead of Pacific La Niñas
      found Atlantic Niñas ahead of Pacific El Niños over the same decades,
      with the same mechanism in reverse.
    sources: [rodriguez_fonseca_2009, ding_2012]


  # ---- Indian Ocean Basin Mode (M20). The basin warms a season after an
  # El Niño begins, peaks in February–April and lasts into the summer, so
  # its scenarios start in February and its summer links count their lag
  # from there. The cool phase is mirrored only where the literature
  # supports it, one tier lower where the evidence is thinner.
  - id: warm_basin_yangtze
    from: indian_ocean_basin
    when: warm
    to: yangtze_summer_rainfall
    effect: 1
    lag_months: [3, 5]
    season: [6, 7, 8]
    confidence: established
    mechanism: >
      Rain rising over the warm Indian Ocean warms the air high above the
      tropics, and that warmth spreads east as a wave along the equator.
      Over the western Pacific it dries the air and builds a strong
      high-pressure area, whose winds pump moist air up the Yangtze valley
      and hold the summer rain front there.
    caveat: >
      The strength of the high, not just whether there was an El Niño the
      winter before, decides how heavy the rains are; a weak or short-lived
      basin warming adds little, and the front's position in any one week
      is weather.
    evidence_note: >
      The summer after an El Niño brings a warm tropical Indian Ocean, an
      anomalous high over the subtropical northwest Pacific and heavier
      Meiyu–Baiu rain over East Asia; model runs with only the Indian
      Ocean warming reproduce the high, and the review of the mechanism
      treats the basin warming as the memory that carries the pattern into
      summer.
    sources: [xie_2009, xie_2016, yang_2007, huang_2010]

  - id: cool_basin_yangtze
    from: indian_ocean_basin
    when: cool
    to: yangtze_summer_rainfall
    effect: -1
    lag_months: [3, 5]
    season: [6, 7, 8]
    confidence: probable
    mechanism: >
      A cool Indian Ocean gives less rain and a cooler upper air over the
      tropics, so the western Pacific high stays weak and sits further
      east, and less moist air is pumped up the Yangtze valley in summer.
    caveat: >
      The cooling after a La Niña is weaker and shorter than the warming
      after an El Niño, so the dry tendency is less reliable than the wet
      one; shown one tier lower for that reason.
    evidence_note: >
      Statistical studies that regress the Asian summer monsoon on the
      basin-mode index find the wet and dry signs together; the physical
      work is mostly on the warm phase, and El Niño and La Niña differ in
      how strongly they reach the Indian Ocean.
    sources: [yang_2010, yang_2007, okumura_2011]

  - id: warm_basin_west_pacific_typhoons
    from: indian_ocean_basin
    when: warm
    to: west_pacific_typhoons
    effect: -1
    lag_months: [3, 6]
    season: [6, 7, 8, 9, 10]
    confidence: probable
    mechanism: >
      The warm air spreading east from the Indian Ocean dries the western
      Pacific and sets up a high-pressure area over the Philippine Sea,
      with sinking air and stronger wind shear where typhoons usually form,
      so fewer of them form in the summer after an El Niño.
    caveat: >
      Clearest after strong El Niños, and the effect is on the number of
      storms over the open Pacific: the South China Sea can be busier at
      the same time, and any one typhoon can still strike.
    evidence_note: >
      In the summer following a strong El Niño typhoon numbers fall over
      the northwest Pacific despite little change in the local sea
      temperature, and the analysis traces the fall to the El Niño-induced
      Indian Ocean warming through the high and the shear it sets up.
    sources: [du_2011, xie_2009, xie_2016]

  - id: cool_basin_west_pacific_typhoons
    from: indian_ocean_basin
    when: cool
    to: west_pacific_typhoons
    effect: 1
    lag_months: [3, 6]
    season: [6, 7, 8, 9, 10]
    confidence: contested
    mechanism: >
      A cool Indian Ocean leaves the western Pacific high weak, with more
      rising air and weaker wind shear over the Philippine Sea, which is
      proposed to allow a busier typhoon season.
    caveat: >
      Studied mainly for the warm phase after strong El Niños; the cool
      phase is weaker and the reverse effect is an inference from the
      mechanism rather than a well-tested result.
    evidence_note: >
      The typhoon study covers summers after strong El Niños only; the
      reverse is drawn as contested because the physical argument runs
      both ways but the cool-phase evidence is thin.
    sources: [du_2011, okumura_2011]

  - id: warm_basin_south_china
    from: indian_ocean_basin
    when: warm
    to: south_china_rainfall
    effect: 1
    lag_months: [0, 2]
    season: [4, 5, 6]
    confidence: probable
    mechanism: >
      The high-pressure area over the Philippine Sea that the warm basin
      sustains carries warm, moist air onto the coast of southern China
      through spring and into early summer, keeping the rainy season wet.
    caveat: >
      In spring this arrow overlaps El Niño's own wet signal on the same
      coast, and much of what it shows is the tail of that; a weak basin
      warming adds little once the El Niño has faded.
    evidence_note: >
      Model runs with the basin warming alone reproduce the anticyclone
      over the Philippine and South China Seas and more rain along the East
      Asian front through spring, and the observational analysis of the
      mode finds the same anticyclone in early summer.
    sources: [annamalai_2005, yang_2007, xie_2016]

  - id: cool_basin_south_china
    from: indian_ocean_basin
    when: cool
    to: south_china_rainfall
    effect: -1
    lag_months: [0, 2]
    season: [4, 5, 6]
    confidence: probable
    mechanism: >
      With a cool basin the high over the Philippine Sea is weak or absent,
      so less moist air is carried onto the coast of southern China in
      spring and early summer.
    caveat: >
      The tail of a La Niña's own dry signal covers the same months; the
      cool phase is the weaker of the two.
    evidence_note: >
      The regression studies find both signs; the model work is on the
      warm phase.
    sources: [yang_2010, annamalai_2005]

  - id: warm_basin_indian_monsoon
    from: indian_ocean_basin
    when: warm
    to: indian_summer_monsoon
    effect: 1
    lag_months: [3, 5]
    season: [6, 7, 8, 9]
    confidence: contested
    mechanism: >
      A warm Arabian Sea and Bay of Bengal give up more moisture to the
      monsoon winds, which carry it onto the subcontinent, so the summer
      rains tend to be heavier once the monsoon is under way.
    caveat: >
      The studies disagree: one finds the onset delayed by about a week
      when the basin is warm, others find heavier rain through the season,
      and the warm basin usually arrives as an El Niño is fading into a La
      Niña, which favours a good monsoon on its own. Shown as contested
      for that reason; the card says so.
    evidence_note: >
      The observational analysis of the basin mode finds the southwest
      monsoon strengthened over the Arabian Sea, and the covariance study
      finds more South Asian summer rain with a warm basin, while the model
      study with the December–May warming finds the onset delayed by six to
      seven days; the sign and the size are both open.
    sources: [yang_2010, yang_2007, annamalai_2005]

  - id: warm_basin_north_indian_ocean_cyclones
    from: indian_ocean_basin
    when: warm
    to: north_indian_ocean_cyclones
    effect: -1
    lag_months: [0, 3]
    season: [4, 5, 6]
    confidence: contested
    mechanism: >
      In the spring after an El Niño the air over the North Indian Ocean
      sinks more and the winds aloft shear more, and the monsoon's arrival
      tends to be late, which is proposed to leave fewer of the storms that
      form in the weeks before the monsoon.
    caveat: >
      The least certain arrow from this driver: reliable storm counts
      begin with the satellite era, the studies are few, none of them
      isolates the basin itself, and the Bay of Bengal's spring storms are
      admitted to be unexplained on so small a sample. The cyclone that
      struck Gujarat in June 1998, a warm-basin year, is the standing
      warning.
    evidence_note: >
      Bay of Bengal storm activity is negatively correlated with the
      Pacific's El Niño index at a lead of about five months, which is the
      season the basin is warm; Arabian Sea storms in May and June go with
      an early and a late monsoon onset respectively; but the study of the
      whole basin says the causes of April–June variability have yet to be
      found, so the link is shown as contested.
    sources: [felton_2013, evan_camargo_2011, ng_chan_2011, girishkumar_2012]

  # A warm basin hastens the El Niño's end and the turn toward La Niña; the
  # cool basin is not mirrored, because the Indian Ocean's feedback on a
  # La Niña is weaker and La Niñas tend to linger instead.
  - id: warm_basin_la_nina
    from: indian_ocean_basin
    when: warm
    to: enso
    effect: -1
    lag_months: [4, 8]
    season: []
    confidence: probable
    mechanism: >
      Rain rising over the warm Indian Ocean drives an easterly wind over
      Indonesia and the far western Pacific. That wind pushes warm surface
      water west and sends a wave of cooler water east along the equator,
      which ends the El Niño quickly and tips the Pacific toward La Niña
      by the summer.
    caveat: >
      Works mostly after strong El Niños, and the Pacific has its own
      timing: some El Niños fade without a La Niña following, and the
      basin's push is one of several reasons an El Niño ends.
    evidence_note: >
      Indian Ocean warming produces the easterly wind over the western
      Pacific in the mature phase of El Niño, which helps its rapid
      termination and a fast transition to La Niña, mostly for relatively
      strong El Niños and typically a year after the peak; models show the
      Indian Ocean is the main source of that wind.
    sources: [kug_kang_2006, ohba_ueda_2007, okumura_2011, xie_2016]

  # ---- ENSO pushes the basin: the atmospheric bridge into the Indian Ocean.
  - id: el_nino_warm_basin
    from: enso
    when: el_nino
    to: indian_ocean_basin
    effect: 1
    lag_months: [3, 5]
    season: []
    confidence: established
    mechanism: >
      El Niño shifts the tropical rain east and puts sinking, clear air over
      the Indian Ocean, with weaker winds; more sunshine and less
      evaporation let the whole basin gather heat through the winter, and a
      slow wave in the ocean south of the equator keeps the warmth into the
      following summer.
    caveat: >
      The warming trails the El Niño by about a season and is strongest
      when a positive Indian Ocean Dipole falls in the same year; a weak El
      Niño may warm the basin only a little.
    evidence_note: >
      The Indian Ocean warms basin-wide during El Niño with a lag of one
      season through the atmospheric bridge, sustained by surface heat
      fluxes and, when a dipole coincides, by ocean waves in the west; the
      north Indian Ocean's second warming peak persists through the summer.
    sources: [klein_1999, du_2009, chowdary_gnanaseelan_2007, lau_nath_2003]

  - id: la_nina_cool_basin
    from: enso
    when: la_nina
    to: indian_ocean_basin
    effect: -1
    lag_months: [3, 5]
    season: []
    confidence: probable
    mechanism: >
      La Niña pulls the tropical rain west, so more cloud and stronger winds
      sit over the Indian Ocean, which cools the basin through the winter
      after a La Niña begins.
    caveat: >
      The cooling is weaker and shorter than the warming after an El Niño:
      the tropical rain answers a cold Pacific less strongly than a warm
      one, which is also why La Niñas tend to linger.
    evidence_note: >
      The bridge works in both directions in the observations, but El Niño
      and La Niña are not mirror images: the atmosphere's response to a cold
      Pacific is weaker, which the asymmetry study links to the different
      durations of the two.
    sources: [klein_1999, okumura_2011, xie_2016]

  # ---- Atlantic Meridional Mode (M21). The mode peaks in March–May, so
  # its scenarios start in March and its summer links count their lag from
  # there. The negative phase is mirrored where the literature supports it,
  # one tier lower where the evidence is thinner.
  - id: positive_amm_atlantic_hurricanes
    from: atlantic_meridional_mode
    when: positive
    to: atlantic_hurricanes
    effect: 1
    lag_months: [2, 5]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      A warm northern tropical Atlantic with the rain belt sitting north
      puts warm water, moist air and weak wind shear over the sea where
      hurricanes are born, and shifts the birthplace of storms toward the
      open Atlantic, where they have room to grow.
    caveat: >
      The mode peaks in spring and the hurricane season runs from June; in
      some years the spring contrast has faded by then. An El Niño in the
      same year works the other way and the two can cancel, which is what
      the map shows when both are in play.
    evidence_note: >
      The mode is strongly related to seasonal hurricane activity on
      year-to-year and decadal time scales, through local conditions that
      all cooperate; a large part of overall activity is explained by
      shifts in where storms form, which track the mode; in summer the
      mode keeps its spring structure and reduces the wind shear over the
      tropical Atlantic, which model runs reproduce.
    sources: [vimont_kossin_2007, kossin_vimont_2007, smirnov_vimont_2011, patricola_2014]

  - id: negative_amm_atlantic_hurricanes
    from: atlantic_meridional_mode
    when: negative
    to: atlantic_hurricanes
    effect: -1
    lag_months: [2, 5]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      A cool northern tropical Atlantic with the rain belt sitting south
      leaves cooler water, drier air and stronger wind shear over the
      hurricane breeding grounds, and storms that do form start closer to
      Africa's coast and the Caribbean, with less room to grow.
    caveat: >
      A La Niña in the same year favours storms and can offset the quiet
      tendency; the relation is with the season as a whole, and a single
      strong storm can still form.
    evidence_note: >
      The negative phase, with cool northern and warm southern tropical
      Atlantic water, inhibits Atlantic storms on its own, and the
      framework relating the mode to hurricane activity holds in both
      signs on interannual and multidecadal time scales.
    sources: [patricola_2014, kossin_vimont_2007, vimont_kossin_2007]

  - id: positive_amm_northeast_brazil
    from: atlantic_meridional_mode
    when: positive
    to: northeast_brazil
    effect: -1
    lag_months: [0, 1]
    season: [2, 3, 4, 5]
    confidence: established
    mechanism: >
      The Nordeste's short rainy season comes when the tropical rain belt
      reaches its southernmost point, in March and April. With the north
      Atlantic warm and the south cool, the belt stays north and withdraws
      early, and sinking air sits over Northeast Brazil instead.
    caveat: >
      The rains also answer the Pacific: an El Niño dries the Nordeste in
      the same months through its own arrow, and the two drivers usually
      arrive together, since an El Niño winter tends to warm the north
      Atlantic. Southern Bahia can run the other way from the northern
      Nordeste.
    evidence_note: >
      The classic mechanism: warm water north and cool water south of the
      equator drive a local circulation with rising air near 10°N and
      sinking air over Northeast Brazil; in dry years the north Atlantic
      is warmer and the ITCZ displaced north; the Nordeste drought is the
      local face of a rain deficit across the whole equatorial Atlantic
      tied to the early withdrawal of the ITCZ toward the warm north.
    sources: [moura_shukla_1981, hastenrath_greischar_1993, nobre_shukla_1996, kushnir_2006]

  - id: negative_amm_northeast_brazil
    from: atlantic_meridional_mode
    when: negative
    to: northeast_brazil
    effect: 1
    lag_months: [0, 1]
    season: [2, 3, 4, 5]
    confidence: established
    mechanism: >
      With the south Atlantic warm and the north cool, the rain belt pushes
      further south than usual and lingers over Northeast Brazil, giving
      the Nordeste a good rainy season or floods.
    caveat: >
      A good year for the sertão can be a flood year for the coast, and a
      La Niña in the Pacific adds to the wet tendency on its own; the
      quantity depends on how far south the belt gets and for how long.
    evidence_note: >
      In wet years the tropical North Atlantic is cooler and the South
      Atlantic warmer, with the near-equatorial rain belt displaced south
      and stronger rising air over the Nordeste; the strong negative event
      of spring 2009, with the belt shifted south, brought severe flooding
      to Northeast Brazil.
    sources: [hastenrath_greischar_1993, foltz_2012, nobre_shukla_1996]

  - id: positive_amm_sahel
    from: atlantic_meridional_mode
    when: positive
    to: sahel_rainfall
    effect: 1
    lag_months: [3, 5]
    season: [7, 8, 9]
    confidence: probable
    mechanism: >
      When the north Atlantic is warm and the south cool, the tropical rain
      belt sits further north in summer over the eastern Atlantic and West
      Africa, and the monsoon winds carry moist air deeper into the Sahel.
    caveat: >
      The mode peaks in spring and the Sahel's rains come in July–
      September; the arrow assumes the contrast lasts into summer, which
      it does in some years and not others. The Indian Ocean and the
      Mediterranean also move the Sahel's rains, and the decades-long
      swings belong to the AMO's arrow rather than this one.
    evidence_note: >
      Wet Sahel years go with a warm north and a cool south tropical
      Atlantic and a rain belt displaced north; over the drought decades
      the north Atlantic cooled, the south warmed and the wind confluence
      over the eastern Atlantic moved 150–200 km south, most of all in
      July–August, enough to account for the fall in Sahel rain; the
      studies work with the sea-temperature pattern rather than the
      spring mode itself.
    sources: [lamb_1978, folland_1986, hastenrath_1990, giannini_2003]

  - id: negative_amm_sahel
    from: atlantic_meridional_mode
    when: negative
    to: sahel_rainfall
    effect: -1
    lag_months: [3, 5]
    season: [7, 8, 9]
    confidence: probable
    mechanism: >
      With the north Atlantic cool and the south warm, the rain belt over
      the eastern Atlantic and West Africa sits further south in summer,
      and the monsoon's rains fall short of the Sahel.
    caveat: >
      Same limits as the wet side: the spring contrast has to last into
      summer, and the Sahel answers other oceans too. The long drought of
      the 1970s and 1980s was the AMO's cool decades, not a run of single
      springs.
    evidence_note: >
      Dry Sahel years go with a cool north and a warm south tropical
      Atlantic and a rain belt displaced south; the drought decades show
      the same pattern in every season, strongest in boreal summer.
    sources: [lamb_1978, hastenrath_1990, folland_1986]

  - id: positive_amm_southern_amazon
    from: atlantic_meridional_mode
    when: positive
    to: southwest_amazon_dry_season
    effect: -1
    lag_months: [3, 7]
    season: [6, 7, 8, 9, 10]
    confidence: probable
    mechanism: >
      A warm tropical North Atlantic keeps the rain belt and the rising
      air north of the equator through the southern winter. The trade
      winds that would carry Atlantic moisture into the southern Amazon
      weaken, the air over the region sinks, and the dry season runs long
      and hot.
    caveat: >
      Known from two droughts, 2005 and 2010, and a short record of
      correlations, so shown as probable. El Niño dries the Amazon too,
      but in the wet season and on the northern side of the basin, which
      is why the map keeps the two regions apart. How much the drought
      costs depends on the fires people set.
    evidence_note: >
      The 2005 drought of southwestern Amazonia was not related to El
      Niño but to the anomalously warm tropical North Atlantic, weaker
      trade-wind moisture transport into southern Amazonia and weakened
      rising motion, intensified through the dry season into September;
      the Atlantic influence over 1979–2005 is comparable to the Pacific's
      and falls in the dry season; the 2010 drought was intensified by
      the same warming of the tropical North Atlantic through a longer
      dry season.
    sources: [marengo_2008, zeng_2008, yoon_zeng_2010, marengo_2011]

  - id: negative_amm_southern_amazon
    from: atlantic_meridional_mode
    when: negative
    to: southwest_amazon_dry_season
    effect: 1
    lag_months: [3, 7]
    season: [6, 7, 8, 9, 10]
    confidence: contested
    mechanism: >
      With the tropical North Atlantic cool and the rain belt sitting
      south, the trade winds are proposed to carry more moisture into the
      southern Amazon, so the dry season is milder and the rivers stay
      higher.
    caveat: >
      The wet side is an inference from the correlation and the mechanism:
      the studies are about the two droughts, and there is no well-studied
      case of a cool north Atlantic spring giving the southern Amazon a
      gentle dry season. Shown as contested for that reason.
    evidence_note: >
      The analysis of 1979–2005 finds a linear Atlantic influence on
      Amazon dry-season rainfall, which would run both ways, but the
      papers document the dry years only.
    sources: [yoon_zeng_2010, zeng_2008]

  - id: positive_amm_central_america
    from: atlantic_meridional_mode
    when: positive
    to: central_america_rainfall
    effect: 1
    lag_months: [2, 4]
    season: [5, 6, 7]
    confidence: probable
    mechanism: >
      A warm tropical North Atlantic and Caribbean gives the tropical waves
      that cross it in early summer more moisture and energy, so the first
      half of the rainy season, from May to July, tends to be wetter over
      the Caribbean and Central America.
    caveat: >
      The early season answers the Atlantic; the late season, from August,
      answers the Pacific, and an El Niño can cancel the wet tendency.
      The studies use the north Atlantic's temperature rather than the
      spring mode itself, and the rain belt's position matters more for
      the Pacific coast of Central America than for the islands.
    evidence_note: >
      Early-season (May–July) Caribbean rainfall is strongly influenced by
      warm water in the tropical North Atlantic between the equator and
      20°N, the band where tropical waves develop, while the late season
      answers the equatorial Pacific and Atlantic; Central America is
      wettest when the north Atlantic is warm and the eastern Pacific
      cool.
    sources: [taylor_2002, enfield_alfaro_1999, giannini_2000]

  # ---- ENSO and the NAO push the mode: a winter of weak trade winds lets
  # the northern tropical Atlantic warm, and the contrast peaks the next
  # spring. Nothing else pushes it, and it pushes nothing.
  - id: el_nino_positive_amm
    from: enso
    when: el_nino
    to: atlantic_meridional_mode
    effect: 1
    lag_months: [9, 11]
    season: []
    confidence: established
    mechanism: >
      An El Niño winter weakens the northeast trade winds over the tropical
      Atlantic through the same chain of high and low pressure that
      reaches North America. Weaker trades mean less evaporation and less
      cooling, so the northern tropical Atlantic warms in late winter and
      the contrast with the south peaks the following spring.
    caveat: >
      The warming trails the El Niño's peak by four to five months, so from
      a June start it arrives the following March and most of the mode's
      own effects fall after the year shown. Not every El Niño warms the
      Atlantic; a positive NAO winter can undo it.
    evidence_note: >
      Half to four fifths of the north Atlantic trade-wind belt's
      temperature variability goes with the Pacific ENSO, with Atlantic
      warmings four to five months after the mature phase of Pacific warm
      events, through reduced trade winds and reduced evaporative cooling,
      best developed in the spring after; almost all extreme north tropical
      Atlantic springs since 1950 relate to ENSO or the NAO; the mode's
      spring predictability comes from the tropical Pacific.
    sources: [enfield_mayer_1997, czaja_2002, nobre_shukla_1996, vimont_2012, chiang_vimont_2004]

  - id: la_nina_negative_amm
    from: enso
    when: la_nina
    to: atlantic_meridional_mode
    effect: -1
    lag_months: [9, 11]
    season: []
    confidence: probable
    mechanism: >
      A La Niña winter strengthens the northeast trades over the tropical
      Atlantic, more evaporation cools the northern side, and the contrast
      tips the other way the following spring.
    caveat: >
      The Atlantic's answer to a La Niña is weaker and less regular than
      its answer to an El Niño, and the study that found the lag looked at
      warm events; shown one tier lower for that reason.
    evidence_note: >
      The remote-forcing study finds that the north tropical Atlantic's
      extreme springs of both signs relate to ENSO or the NAO through the
      trade winds and evaporation; the lag analysis itself was done on
      Pacific warm events.
    sources: [czaja_2002, enfield_mayer_1997, kushnir_2006]

  - id: negative_nao_positive_amm
    from: nao
    when: negative
    to: atlantic_meridional_mode
    effect: 1
    lag_months: [2, 4]
    season: []
    confidence: probable
    mechanism: >
      A negative NAO winter weakens the Azores high and with it the
      northeast trade winds. Weaker trades evaporate less water from the
      northern tropical Atlantic, which warms through late winter, and
      wind and evaporation then feed on each other to hold the warm north
      through spring.
    caveat: >
      The NAO changes from month to month, so a single stormy December
      may not be enough; it is a winter's average that matters. The link
      is drawn from the NAO as chosen in December; the mode's own summer
      effects then fall inside the year shown, which is the point of the
      chain.
    evidence_note: >
      Almost all extreme north tropical Atlantic springs since 1950 relate
      to either ENSO or the NAO, which lead them, through changes in
      surface winds and evaporation; the spring meridional modes are
      forced by trade-wind variations in the northern subtropical ocean;
      the 2009 negative event began with a stronger subtropical high and
      stronger trades in January–February, the mirror case.
    sources: [czaja_2002, chiang_vimont_2004, foltz_2012, kushnir_2006]

  - id: positive_nao_negative_amm
    from: nao
    when: positive
    to: atlantic_meridional_mode
    effect: -1
    lag_months: [2, 4]
    season: []
    confidence: probable
    mechanism: >
      A positive NAO winter strengthens the Azores high and the northeast
      trades, more evaporation cools the northern tropical Atlantic, and
      the contrast tips negative in spring, with the rain belt held south.
    caveat: >
      Same limits as the mirror link: a winter's average matters, not one
      month, and an El Niño in the same winter works the other way.
    evidence_note: >
      The strong negative event of 2009 was initiated by stronger than
      normal trade winds in January and February with a strengthened
      subtropical North Atlantic high, cooling the ocean by evaporation and
      deepening the mixed layer; the remote-forcing study ties such
      springs to the NAO and ENSO.
    sources: [foltz_2012, czaja_2002, kushnir_2006]
  # ---- Pacific Meridional Mode (M22). The mode peaks in March–May, so its
  # scenarios start in March. Its main work is to push ENSO; with the chain
  # on, El Niño's own map follows one tier down from the autumn. Nothing on
  # the map pushes it: its trigger, the North Pacific Oscillation, is a
  # month-to-month pressure pattern and not a driver here.
  - id: positive_pmm_el_nino
    from: pacific_meridional_mode
    when: positive
    to: enso
    effect: 1
    lag_months: [6, 9]
    season: []
    confidence: probable
    mechanism: >
      Warm water off Baja California weakens the trade winds to its south,
      the weaker wind evaporates less and warms the sea further, and the
      warm patch and the weak wind creep south-west together through
      spring. By summer the weak wind reaches the equator, where it lets
      warm water spread east and starts the Pacific toward an El Niño by
      the following winter.
    caveat: >
      A nudge, not a trigger: the Pacific has to be primed, with heat
      already stored in the west, for the spring signal to grow, and about
      one positive spring in three comes to nothing. The spring of 2014
      was one such miss. Part of the mode is also El Niño's own footprint
      in the subtropics, so the two are not fully separate things.
    evidence_note: >
      The majority of El Niño events over four decades were preceded by
      the mode's spring warming and south-westerly wind; in a
      high-resolution coupled model it acts as a trigger seven to nine
      months before large El Niños, but not every event triggers one and
      the western Pacific has to be preconditioned; imposing the winter
      forcing in a coupled model warmed the ENSO region in about 70% of
      sixty runs; positive springs forecast eastern Pacific El Niños with
      some skill in a multi-model hindcast; the spring-to-winter relation
      has strengthened over the past seventy years.
    sources: [chang_2007_pmm, larson_kirtman_2013, alexander_2010, vimont_2003, larson_kirtman_2014, amaya_2019, zheng_2023, stuecker_2018]

  - id: negative_pmm_la_nina
    from: pacific_meridional_mode
    when: negative
    to: enso
    effect: -1
    lag_months: [6, 9]
    season: []
    confidence: contested
    mechanism: >
      Cool water off Baja California and stronger trades are proposed to
      work the mirror way: the stronger wind cools the sea further, the
      pattern creeps toward the equator, and by summer the stronger
      easterlies there lift cool water in the east and start the Pacific
      toward a La Niña.
    caveat: >
      The negative side is the weak side. In the observed record negative
      springs are poor predictors of La Niña, and the studies that made
      the case for the mode are about the positive springs before El
      Niños. Shown as contested for that reason; the map draws it so the
      asymmetry can be seen, not because it is reliable.
    evidence_note: >
      In the multi-model hindcast negative mode events poorly predict La
      Niña events in observations, and the forecast models fail to
      capture even that; the subtropical route into ENSO produces
      multi-year La Niñas but not multi-year El Niños, one source of the
      asymmetry between the two.
    sources: [larson_kirtman_2014, yu_fang_2018, chang_2007_pmm]

  - id: positive_pmm_west_pacific_typhoons
    from: pacific_meridional_mode
    when: positive
    to: west_pacific_typhoons
    effect: 1
    lag_months: [2, 5]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      Rain rising over the warm water of the mode's north-western arm sets
      up a wave-like response to its west: low-level westerly winds and a
      spin over the south-eastern part of the typhoon breeding grounds,
      and weaker wind shear aloft. Typhoons form further east and have a
      longer run over warm water to grow.
    caveat: >
      The count is a tendency, not a forecast, and one study finds the
      year-to-year part of the relation weak once the slow decadal swing
      of the tropical Pacific is removed; the model experiments that back
      the link are what keep it at probable. Its effect adds to El Niño's
      own, which points the same way.
    evidence_note: >
      A positive mode favours typhoon formation in the western North
      Pacific and a negative one inhibits it, in observations, a
      thousand-year control run and sensitivity experiments, through the
      wind shear over the south-eastern breeding grounds; the mode index
      correlates with the number of intense typhoons in June–November;
      the summer of 2018, with no El Niño, had eighteen typhoons and
      sensitivity runs put the positive mode as the main cause; in 2015
      the mode's warm water pushed the mean birthplace of typhoons ten
      degrees east of 1997's. One study finds the statistical link is
      dominated by decadal covariation with the tropical Pacific.
    sources: [zhang_2016_pmm_typhoons, gao_2018, takaya_2019, hong_2018, liu_2019]

  - id: negative_pmm_west_pacific_typhoons
    from: pacific_meridional_mode
    when: negative
    to: west_pacific_typhoons
    effect: -1
    lag_months: [2, 5]
    season: [6, 7, 8, 9, 10, 11]
    confidence: contested
    mechanism: >
      With the subtropical north-east Pacific cool, the wave-like response
      over the typhoon grounds runs the other way: stronger wind shear and
      less spin over the south-eastern breeding grounds, so typhoons form
      closer to Asia and stay weaker.
    caveat: >
      The composite study finds the quiet tendency, but the case studies
      and the model experiments are about positive springs, and the
      objection that the year-to-year relation is weak applies with more
      force here. Shown one tier lower than the warm side for that reason.
    evidence_note: >
      The negative phase inhibits typhoon occurrence in the western North
      Pacific in the composite analysis of observations and the control
      run; the one-in-ten-years component of the relation, rather than
      the year-to-year one, carries most of the signal.
    sources: [zhang_2016_pmm_typhoons, liu_2019]

  - id: positive_pmm_east_pacific_hurricanes
    from: pacific_meridional_mode
    when: positive
    to: east_pacific_hurricanes
    effect: 1
    lag_months: [2, 5]
    season: [6, 7, 8, 9, 10, 11]
    confidence: contested
    mechanism: >
      The mode's warm water lies over the western part of the eastern
      Pacific hurricane grounds, between Mexico and Hawaii. Warm sea, moist
      air and weak wind shear there give storms more fuel and more room,
      and more of them travel west toward Hawaii.
    caveat: >
      Rests on one season, 2015, and its model experiments, and that
      season had a strong El Niño at the same time; the record of storms
      in this basin is short. Shown as contested until more seasons are
      studied.
    evidence_note: >
      The record 2015 season in the eastern and central Pacific, with the
      first three simultaneous category-4 hurricanes and a record count
      around Hawaii, was not primarily caused by the El Niño but by warm
      water in the subtropical Pacific typical of the positive mode,
      according to targeted high-resolution experiments; the western part
      of the basin set records for storms, hurricane days and storm
      energy in 2015, with the El Niño and the positive mode together
      giving a record-warm background.
    sources: [murakami_2017, collins_2016]
  # ---- Large tropical volcanic eruption (M26). An event, not a swing: one
  # active phase (eruption, value -1, the driver's own axis is "cooling
  # forcing") and a quiet one. The map holds the eruption on for the whole
  # year shown; the haze really thins over two years. Nothing pushes it.
  # Winter links use lag 2 so an eruption late in the year still reaches the
  # winter that follows it; the monsoon links use lag 4, the time the haze
  # takes to spread and thicken, so a June eruption reaches the next June's
  # monsoon at month 12 and the Sahel's July is just past the year shown.
  - id: eruption_global_cooling
    from: tropical_eruption
    when: eruption
    to: global_mean_temperature
    effect: -1
    lag_months: [3, 12]
    season: []
    confidence: established
    mechanism: >
      The haze of sulphuric-acid droplets in the stratosphere reflects a
      few per cent of incoming sunlight back to space. Less sunlight
      reaches the surface, the land and the upper ocean lose more heat
      than they gain, and the world's average temperature drops by a few
      tenths of a degree, most in the first summer after the eruption,
      then creeps back over two or three years as the haze settles out.
    caveat: >
      The dip is small next to a strong El Niño or the warming trend, and
      is easiest to see once El Niño's own warmth is taken out of the
      record. The map cannot weigh a cooling volcano against a warming El
      Niño: when both point at this region it shows a disagreement, as in
      1992, when in reality the volcano won and the world cooled despite
      the El Niño.
    evidence_note: >
      A climate-model forecast made within months of Pinatubo predicted
      cooling from late 1991 peaking in late 1992, large enough to
      overwhelm the developing El Niño's warmth; observed global
      temperatures fell by up to half a degree by mid-1992, and satellite
      lower-troposphere temperatures by half a degree by September 1992;
      a composite of five major tropical eruptions shows significant
      cooling once ENSO is removed; ten reanalyses agree on tropical
      cooling after most but not all eruptions; the observed drying of
      the air amplified the cooling, which a model could not reproduce
      without water-vapour feedback.
    sources: [robock_2000, hansen_1992, parker_1996, dutton_christy_1992, soden_2002, wunderlich_mitchell_2017, mccormick_1995]

  - id: eruption_sahel
    from: tropical_eruption
    when: eruption
    to: sahel_rainfall
    effect: -1
    lag_months: [4, 15]
    season: [7, 8, 9]
    confidence: probable
    mechanism: >
      A cooler surface evaporates less, so there is less water in the air
      to rain out, and the land cools faster than the sea, which weakens
      the contrast that draws the summer monsoon inland. If the haze sits
      more in the northern hemisphere, as most tropical clouds do, the
      tropical rain belt also shifts south, away from the Sahel.
    caveat: >
      Comes mostly from models and a handful of twentieth-century
      eruptions; in the observed record the summer signal is only
      marginally detectable, and the sign depends on which hemisphere
      gets more haze: a cloud that stays south of the equator can leave
      the Sahel wetter. The high-latitude eruptions that dried the Sahel
      most, Laki in 1783 among them, are not on this map. For a June
      eruption the next Sahel rains fall in the month after the year
      shown, so the arrow stays waiting.
    evidence_note: >
      Global and monsoon rainfall drop after eruptions in CMIP5 models
      and in three observational datasets, with the rain belt shifting
      away from the hemisphere holding more aerosol; land precipitation
      and river runoff fell to record lows in the year after Pinatubo
      once ENSO is accounted for; a hemispherically lopsided haze shifts
      Sahelian rainfall, with northern-hemisphere loading drying the Sahel
      in a model and in the record; most CMIP5 models show clear
      reductions of summer monsoon rainfall in the first year after large
      eruptions since 1850; the warm-season influence is only marginally
      detectable in the observations; a model of the 1783 Laki eruption
      dried the Sahel by one to three millimetres a day and cut the flow
      of the Nile.
    sources: [iles_hegerl_2014, iles_2013, haywood_2013, trenberth_dai_2007, zambri_robock_2016, robock_2000, oman_2006]

  - id: eruption_indian_monsoon
    from: tropical_eruption
    when: eruption
    to: indian_summer_monsoon
    effect: -1
    lag_months: [4, 15]
    season: [6, 7, 8, 9]
    confidence: probable
    mechanism: >
      The monsoon is driven by the summer contrast between hot land and
      cooler sea. Under the haze the land cools faster than the ocean, the
      contrast weakens, and a cooler atmosphere holds less water, so the
      first monsoon after the haze has spread tends to bring less rain.
    caveat: >
      Most of the evidence is from models. The tree-ring record of
      monsoon Asia shows drier central Asia but wetter mainland south-east
      Asia in eruption years, which the models do not reproduce, and
      India's own monsoon of 1992 was only modestly below normal. Both the
      eruption and any El Niño it may favour point the same way, so the
      two are hard to separate in the record.
    evidence_note: >
      Monsoon rainfall decreases after eruptions in CMIP5 models and in
      observations; most CMIP5 models show clear reductions of summer
      monsoon rainfall in the first year after large eruptions; in a
      last-millennium ensemble northern-hemisphere cooling shifts the
      rain belt toward the equator and suppresses the south-east Asian
      monsoon even without an El Niño; drought reconstructions find drier
      central Asia but wetter mainland south-east Asia in eruption years,
      so models may miss part of the response; large eruptions
      strengthen the coupling between ENSO and the Indian monsoon in a
      model and in a millennium of records; land rainfall and runoff fell
      to record lows in the year after Pinatubo.
    sources: [iles_hegerl_2014, zambri_robock_2016, stevenson_2016, anchukaitis_2010, singh_2020, trenberth_dai_2007]

  - id: eruption_northern_europe_winter
    from: tropical_eruption
    when: eruption
    to: northern_europe_winter
    effect: 1
    lag_months: [2, 8]
    season: [12, 1, 2]
    confidence: probable
    mechanism: >
      The haze absorbs some sunlight and warms the stratosphere over the
      tropics more than over the pole. The sharper contrast strengthens
      the winter polar vortex, the jet beneath it shifts north, and mild
      Atlantic air is carried deep into northern Europe in the first
      winter after the eruption, outweighing the cooling from lost
      sunlight. This is the "winter warming" of a cool volcanic year.
    caveat: >
      The observed pattern is an average over a dozen eruptions and a
      single winter can go either way; models produce it weakly if at
      all, and one study argues the mild winter of 1991–92 after Pinatubo
      was probably chance, or the El Niño's doing, rather than the
      volcano's. Second winters show little of it, and the map's season
      gate cannot tell a first winter from a second.
    evidence_note: >
      The twelve largest eruptions of 1883–1992 were followed by winter
      warming over Eurasia and North America significant at the 95%
      level, in the first winter for tropical eruptions; the same pattern
      follows fifteen tropical eruptions in half a millennium of European
      reconstructions, with a positive NAO; four centuries of records
      give a mean response resembling the Arctic Oscillation but a spread
      larger than the mean; the winter warming after Pinatubo is
      reproduced in one model and much more weakly than observed or not
      at all in the IPCC AR4 and CMIP5 ensembles, though most CMIP5
      models show it when only the first winter is examined; large
      ensembles find the effect tiny next to winter-to-winter
      variability, and the 1991–92 warming is reproduced in one model
      only with the observed El Niño sea-surface temperatures specified;
      all datasets in a ten-reanalysis comparison show the warm anomaly
      over northern Europe.
    sources: [robock_mao_1992, fischer_2007, shindell_2004, kirchner_1999, graf_1993, zambri_robock_2016, stenchikov_2006, driscoll_2012, polvani_2019, coupe_robock_2021, wunderlich_mitchell_2017]

  - id: eruption_western_russia_winter
    from: tropical_eruption
    when: eruption
    to: western_russia_winter
    effect: 1
    lag_months: [2, 8]
    season: [12, 1, 2]
    confidence: probable
    mechanism: >
      The same strengthened winter vortex and stronger westerlies that
      warm northern Europe reach furthest east over Russia and Siberia,
      the core of the winter-warming pattern, where the first winter
      after a tropical eruption tends to be milder than usual even while
      the planet as a whole is cooler.
    caveat: >
      The same evidence as for northern Europe, with the same doubts: a
      tendency averaged over a dozen eruptions, weak in most models, and
      possibly chance in the one winter, 1991–92, that everyone
      remembers. The map cannot tell a first winter from a second, and the
      second shows little of it.
    evidence_note: >
      Warming over Eurasia after the twelve largest eruptions since 1883,
      in the first winter after tropical ones; warm anomalies throughout
      northern Eurasia in four centuries of cold-season reconstructions
      and in model simulations of them; observed January circulation
      changes after three eruptions explained by stationary-wave changes
      under a strengthened polar-night jet; CMIP5 models fail to capture
      the Eurasian warming when two winters are combined but most show it
      in the first winter alone; the effect is tiny against internal
      variability in large ensembles.
    sources: [robock_mao_1992, shindell_2004, kodera_1994, kirchner_1999, driscoll_2012, zambri_robock_2016, polvani_2019]

  - id: eruption_positive_nao
    from: tropical_eruption
    when: eruption
    to: nao
    effect: 1
    lag_months: [2, 8]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      Heating of the tropical stratosphere by the haze strengthens the
      winter polar vortex, and a strong vortex reaches down to the
      surface as a positive North Atlantic Oscillation: the Iceland low
      deeper, the Azores high stronger, the westerlies across the
      Atlantic stronger and further north.
    caveat: >
      Found in the pressure record after most large eruptions but, in the
      words of one review of ten reanalyses, not as clear cut as the
      literature suggests: the spread between eruptions is large, models
      make the vortex response small, and the polar response turns out
      not to be a direct effect of the heating but to go through
      stratospheric wave activity, sensitive to the shape of the cloud.
      Drawn dashed for that reason; with the chain on, the NAO's own
      winter arrows follow one tier down.
    evidence_note: >
      Both the Arctic Oscillation and the NAO are excited in the first
      winter after thirteen major eruptions since 1870, significant at
      95%, the signal larger for the NAO; the winter response to fifteen
      tropical eruptions in European reconstructions follows a positive
      NAO; four centuries of records give a mean response resembling the
      Arctic Oscillation; ten reanalyses and the Hadley Centre pressure
      record confirm a positive NAO tendency in the winters after large
      eruptions, with a large spread for individual eruptions; AR4 models
      simulate a positive Arctic Oscillation but with far weaker surface
      effects, and CMIP5 models generally fail to capture the
      strengthened vortex and positive NAO; in one Earth-system model the
      vortex response is insignificant for observation-based forcings and
      depends on the structure of the aerosol cloud.
    sources: [christiansen_2008, fischer_2007, shindell_2004, wunderlich_mitchell_2017, stenchikov_2006, driscoll_2012, toohey_2014, robock_2000, kodera_1994]

  - id: eruption_el_nino
    from: tropical_eruption
    when: eruption
    to: enso
    effect: 1
    lag_months: [6, 12]
    season: []
    confidence: contested
    mechanism: >
      Two routes are proposed. The haze cools land faster than sea, and
      cooling over tropical Africa weakens the West African monsoon and
      sends a wave of westerly wind along the equator that reaches the
      western Pacific and lets warm water spread east. And in the eastern
      Pacific the cold water welling up from below is cooled less than
      the surface around it, so the west cools more than the east, the
      trade winds slacken, and the Pacific drifts toward El Niño in the
      year after the eruption.
    caveat: >
      Genuinely unsettled. Coral and tree-ring records and CMIP5
      composites lean toward an El Niño in the year after big tropical
      eruptions, but a thousand years of central-Pacific coral finds no
      significant response, one model starts with a La Niña before any El
      Niño, and the answer depends on the season of the eruption and on
      what the Pacific was already doing: an eruption in a La Niña year
      does little. Pinatubo's own El Niño was already under way when it
      erupted, so 1991 cannot settle the question.
    evidence_note: >
      Proxy records show an El Niño-like response to volcanic forcing
      over the past several centuries; in an intermediate model only
      eruptions larger than Pinatubo shift El Niño likelihood above
      internal variability, and volcanism raises the odds by about half
      on average rather than triggering events; CMIP5 shows an El Niño
      tending to peak in the year after large eruptions, with targeted
      simulations tracing it to cooling over tropical Africa; 122 CMIP5
      members show co-occurring El Niño and positive Indian Ocean Dipole
      events peaking six to twelve months after the forcing peaks; a
      Pinatubo-size eruption produces a significant El Niño response a
      year on in one coupled model except when the Pacific starts in La
      Niña, and more strongly for summer eruptions; another coupled model
      gives an El Niño-like warming a year after the peak forcing, and
      the eruption season matters for the eruption-year response;
      against it, fossil corals from the central Pacific show only a
      weak, insignificant El Niño-like tendency over the last millennium,
      and one coupled model's first response is La Niña-like.
    sources: [adams_2003, emile_geay_2008, khodri_2017, maher_2015, predybaylo_2017, ohba_2013, stevenson_2017, dee_2020, mcgregor_timmermann_2011]

  # ================================================ OUTCOME REGIONS, THIRD BATCH (M27)
  # Data only: links from drivers already on the map into five new outcome
  # nodes. Asymmetric where the literature is: Tibet has no La Niña link.
  # ---- Central and southwest Asia
  - id: el_nino_central_asia
    from: enso
    when: el_nino
    to: central_asia_winter
    effect: 1
    lag_months: [4, 10]
    season: [11, 12, 1, 2, 3, 4]
    confidence: probable
    mechanism: >
      In an El Niño winter the air over the Indian Ocean and the western
      Pacific sinks and pressure there rises. Around the northwest edge of
      that high, winds tend to blow from the Arabian Sea and tropical
      Africa toward Iran and Afghanistan, feeding the winter storms that
      cross from the Mediterranean with extra moisture, so they drop more
      rain and mountain snow.
    caveat: >
      The signal is strongest in autumn and spring and patchier in
      midwinter, and it varies from place to place: parts of Iran show it
      clearly, others hardly at all. A model ensemble gives an El Niño
      cold season roughly even odds of landing in the wettest third and a
      one-in-four chance of landing in the driest, so a wet season is a
      lean, not a promise. The connection has strengthened in recent
      decades and may not hold in every era.
    evidence_note: >
      Observed precipitation, moisture flux and pressure data and an
      atmospheric model agree on extra southwesterly moisture into the
      region in warm ENSO events, greatest in the transition seasons;
      Iranian station rainfall in El Niño autumns was several times that
      of La Niña autumns over 1951–1990; seasonal November–April
      precipitation over southwest Asia correlates with ENSO and Pacific
      decadal patterns; a regional climate model reproduces the observed
      increase in the warm ENSO phase over northern Pakistan, Afghanistan
      and Tajikistan through stronger western disturbances; an ensemble
      forced with 1979–2015 conditions puts above-average precipitation
      in both El Niño types, with the spread between members nearly as
      large as the mean shift.
    sources: [mariotti_2007, nazemosadat_cordery_2000, hoell_2015, syed_2010, hoell_2018]

  - id: la_nina_central_asia
    from: enso
    when: la_nina
    to: central_asia_winter
    effect: -1
    lag_months: [4, 10]
    season: [11, 12, 1, 2, 3, 4]
    confidence: probable
    mechanism: >
      In a La Niña winter the rising air and heavy rain sit over the warm
      pool of the western Pacific and eastern Indian Ocean. That rain
      sends a wave through the atmosphere that strengthens sinking air
      over Iran and Afghanistan and steers moisture away, so the winter
      storms arrive dry or not at all.
    caveat: >
      The drying is clearest when La Niña comes with an unusually warm
      western Pacific, as in 1998–2001; a La Niña centred in the eastern
      Pacific barely shifts the odds in one model ensemble. Two or three
      years of La Niña do far more harm than one, because reservoirs and
      soils run down, and the famine of 2000–2001 owed as much to war as
      to weather.
    evidence_note: >
      The 1998–2001 drought that affected sixty million people fell in a
      prolonged La Niña with warm western-Pacific waters, and cold-season
      precipitation over the region varies opposite to rainfall over the
      eastern Indian Ocean; a study of recent warm-west-Pacific La Niñas
      traces Northern Hemisphere drought, southwest Asia included, to
      the same forcing; central-Pacific La Niñas push the region's
      November–April precipitation into the driest third more than seven
      times in ten in an ensemble, while eastern-Pacific La Niñas do not
      change the odds; the observational analysis behind the El Niño link
      finds the reverse pattern in cold events.
    sources: [barlow_2002, hoell_2014, hoell_2018, mariotti_2007]

  # ---- US Midwest summer
  - id: la_nina_us_midwest
    from: enso
    when: la_nina
    to: us_midwest_summer
    effect: -1
    lag_months: [0, 2]
    season: [5, 6, 7, 8]
    confidence: probable
    mechanism: >
      With cold water on the equator and the tropical rain belt pushed
      north, a wave of high pressure tends to set up over the central
      United States in late spring and the jet stream, with its storms,
      is displaced far north into Canada. Moist Gulf air still flows
      north but little of it is lifted into rain, and the soil dries out,
      which feeds the heat and the drought.
    caveat: >
      Summer links are weaker and less reliable than ENSO's winter ones,
      and this one has switched on and off over the last century: it was
      strong from 1948 to 1978 and hard to find from 1979 on, depending
      on what the North Pacific was doing. Not every La Niña summer is
      dry, and the 1988 drought had begun on the West Coast a year
      earlier for other reasons. The map holds the phase for the year, so
      the following summer is shaded too; the evidence is for the summer
      the event is in.
    evidence_note: >
      Record low April–June 1988 rainfall in the north-central United
      States followed a wave train from the tropical Pacific that a
      planetary-wave model reproduces from the displaced rain belt over
      cold equatorial water; in 1988 the jet and storm track were the
      furthest north of any year from 1979 to 1993; model composites put
      ENSO's drought influence over the Great Plains with cold events
      favouring drought; the central-US summer teleconnection was active
      in 1871–1916 and 1948–78 and absent in 1917–47 and after 1979.
    sources: [trenberth_1988, trenberth_guillemot_1996, mo_2009, hu_feng_2001]

  - id: el_nino_us_midwest
    from: enso
    when: el_nino
    to: us_midwest_summer
    effect: 1
    lag_months: [0, 2]
    season: [5, 6, 7, 8]
    confidence: contested
    mechanism: >
      Warm water on the equator shifts the tropical rain belt and the
      heating of the atmosphere, and the jet stream over North America
      tends to sit further south than usual for the season, in a
      springlike position across the central United States. Storms then
      run along it over the Midwest, lifting Gulf moisture into repeated
      heavy rain.
    caveat: >
      Genuinely unsettled. The 1993 flood summer fits, and one analysis of
      1950–1990 finds Great Plains summer rain rising with warm tropical
      Pacific water, but the same teleconnection was absent for decades at
      a time, and over the central-eastern United States ENSO's summer and
      winter effects run opposite and cancel. Most El Niños begin in
      spring or summer and their summer effects are much weaker than the
      winter ones. The map holds the phase for the year, so the following
      summer is shaded too.
    evidence_note: >
      The 1993 floods came with a mature El Niño, a broader jet stream and
      storm track displaced well south of normal, the furthest south by
      over 200 km of any year from 1979 to 1993; Great Plains summer
      precipitation over 1950–1990 covaries with El Niño–La Niña water in
      the tropical Pacific; model composites give warm events a wet-spell
      tendency over the Plains; against it, the central-US summer
      teleconnection was absent in 1917–47 and after 1979, and drought
      and wet spells over the central-eastern United States are short
      because ENSO's summer and winter effects there oppose each other.
    sources: [trenberth_guillemot_1996, ting_wang_1997, mo_2009, hu_feng_2001, mo_schemm_2008]

  # ---- Northeastern Canada winter
  - id: positive_nao_hudson_bay
    from: nao
    when: positive
    to: hudson_bay_winter
    effect: -1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      A positive North Atlantic Oscillation deepens the Icelandic low. The
      winds on its western side blow from the north across Baffin Island,
      Labrador and Hudson Bay, pulling Arctic air south while Europe on
      the eastern side gets the mild westerlies. It is the same see-saw
      that makes Greenland cold when Europe is warm.
    caveat: >
      Strongest toward Labrador and Baffin Island and weaker on the west
      side of Hudson Bay, where ENSO and the Pacific matter more. The
      oscillation swings from week to week, so a positive winter on
      average still has mild spells; and the winter of 2009–10, with the
      most negative index on record, still froze the region.
    evidence_note: >
      The positive winters of the 1980s and early 1990s brought cold
      conditions to the northwest Atlantic while Europe warmed; the NAO
      is the dominant mode for Canadian winter temperature, its effect
      confined mainly to the northeast of the country; high-index winters
      show more frequent and longer cold spells over eastern Canada;
      decadal swings of the oscillation are mirrored in temperatures over
      Greenland and eastern Canada.
    sources: [hurrell_1995, bonsal_2001, shabbar_bonsal_2004, hurrell_van_loon_1997, hurrell_2003]

  - id: negative_nao_hudson_bay
    from: nao
    when: negative
    to: hudson_bay_winter
    effect: 1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      With the Icelandic low weak and the Azores high feeble, the flow of
      Arctic air down the Labrador coast slackens. Milder Atlantic air
      reaches Hudson Bay and the northeast, blocking highs over Greenland
      hold it there, and the cold spills into Europe instead. Winter sea
      ice on the bay and along Labrador tends to form late and thin.
    caveat: >
      As for the positive phase: clearest toward the Labrador coast, and
      a negative winter is mild on average, not every week. The mildness
      arrives as the phase does, with no lag, and it ends when the phase
      ends, which the map cannot show. Where El Niño is also pushing the
      region mild the two cannot be told apart on the map.
    evidence_note: >
      Regressions of winter temperature on the NAO index reverse sign
      between Europe and the northwest Atlantic, so the negative phase
      warms Labrador and eastern Canada as the positive cools it; the NAO
      explains more of northeastern Canada's winter temperature variance
      than ENSO or the PDO; low-index winters bring fewer cold spells over
      eastern Canada.
    sources: [hurrell_1995, hurrell_van_loon_1997, bonsal_2001, shabbar_bonsal_2004]

  - id: el_nino_hudson_bay
    from: enso
    when: el_nino
    to: hudson_bay_winter
    effect: 1
    lag_months: [5, 8]
    season: [12, 1, 2, 3]
    confidence: contested
    mechanism: >
      The heating of the air over the warm eastern Pacific launches the
      wave train across North America that lifts the jet stream north
      over western Canada. Mild Pacific air follows it, and in most
      El Niño winters the warmth spreads east across southern Canada,
      reaching Hudson Bay as a weaker version of the Prairie signal.
    caveat: >
      The warmth fades eastward and studies disagree about whether it
      reaches the northeast at all: one composite finds El Niño winters
      warm over most of Canada, another finds the east warm only when the
      Pacific Decadal Oscillation is also positive and cool when it is
      neutral. The North Atlantic Oscillation matters more here, and in a
      winter when it is positive its cold tends to win.
    evidence_note: >
      A canonical correlation analysis of Canadian temperatures finds
      El Niño winters warm over most of the country, weakening eastward;
      most of southern Canada sees mean winter temperature shifted to
      warmer values in El Niño; El Niño winters have more warm spells and
      fewer cold spells across most of Canada; against it, the ENSO
      effect on winter temperature is mainly over western and central
      Canada, and in El Niño winters with a neutral PDO the east is
      cooler than normal.
    sources: [shabbar_khandekar_1996, shabbar_2006, shabbar_bonsal_2004, bonsal_2001]

  - id: la_nina_hudson_bay
    from: enso
    when: la_nina
    to: hudson_bay_winter
    effect: -1
    lag_months: [5, 8]
    season: [12, 1, 2, 3]
    confidence: contested
    mechanism: >
      Cold water on the equator weakens the wave train that steers the
      jet stream north, so Arctic air spills south across Canada more
      often. The cooling is strongest on the Prairies and reaches the
      northeast weakly, and more often through Arctic outbreaks than
      through a steady cold.
    caveat: >
      Weaker and less consistent than the El Niño warming and, like it,
      strongest in the west. The eastern response depends on what the
      North Pacific and the North Atlantic are doing in the same winter,
      and one composite finds the eastern cooling small. Treat the map's
      cold as a lean, and look at the NAO first.
    evidence_note: >
      La Niña winters are cold over most of Canada in the canonical
      correlation analysis, weaker in the east; La Niña winters show more
      cold spells and fewer warm spells across most of the country; the
      regression analysis finds the ENSO influence confined mainly to
      western and central Canada.
    sources: [shabbar_khandekar_1996, shabbar_bonsal_2004, bonsal_2001]

  # ---- India pre-monsoon heat
  - id: el_nino_india_heat
    from: enso
    when: el_nino
    to: india_premonsoon_heat
    effect: 1
    lag_months: [8, 11]
    season: [3, 4, 5]
    confidence: contested
    mechanism: >
      An El Niño peaks in winter and its warmth spreads through the
      tropics over the following months: the air over India is warmer,
      the winter rains that moisten the soil of the north are often
      short, and a persistent high with clear skies and dry ground sets
      up over central and northwestern India in the spring after the
      event, the ingredients of a heat wave.
    caveat: >
      Unsettled. Composites of El Niño years are warmer in the following
      pre-monsoon season, but not significantly so over large areas; the
      significant warmth is in the monsoon and post-monsoon seasons of
      the event year, which this node does not show. One study ties one
      type of Indian heat wave to cooling in the Pacific, the opposite
      sign, and another to blocking over the North Atlantic, with no
      Pacific link at all. The warming trend has added more to India's
      heat waves than any El Niño.
    evidence_note: >
      Heat waves over India during 1961–2013 vary with central Pacific
      and tropical Indian Ocean temperatures, with more frequent El Niños
      expected to lengthen them; composites over 1901–2007 show El Niño
      years warm through the monsoon, post-monsoon and the following
      winter and pre-monsoon, significant only in the monsoon and
      post-monsoon seasons; against it, one of two heat-wave types over
      coastal eastern India is tied to anomalous cooling in the Pacific,
      and the other over north-central India to North Atlantic blocking.
    sources: [rohini_2016, kothawale_2010, ratnam_2016]

  - id: la_nina_india_heat
    from: enso
    when: la_nina
    to: india_premonsoon_heat
    effect: -1
    lag_months: [8, 11]
    season: [3, 4, 5]
    confidence: contested
    mechanism: >
      A La Niña cools the tropics as an El Niño warms them, and the
      cooling lingers into the following spring. With a cooler
      atmosphere and fewer persistent highs over the north, the
      pre-monsoon tends to run less hot and heat waves tend to be fewer
      and shorter.
    caveat: >
      Unsettled, and thinner than the El Niño side: the cool composite is
      the mirror image of a warm one that is itself not significant in
      this season, and one analysis links heat waves along India's east
      coast to Pacific cooling, which would make a La Niña spring hotter
      there, not cooler. No La Niña spring is safe from heat: 2022's
      March heat came in a La Niña.
    evidence_note: >
      Composites of La Niña years over 1901–2007 are close to the mirror
      of El Niño's, with negative temperature anomalies persisting from
      the event's monsoon season to the following pre-monsoon; against
      it, heat waves over coastal eastern India are associated with
      anomalous cooling in the Pacific through a weakened sea breeze.
    sources: [kothawale_2010, ratnam_2016]

  - id: warm_basin_india_heat
    from: indian_ocean_basin
    when: warm
    to: india_premonsoon_heat
    effect: 1
    lag_months: [0, 3]
    season: [3, 4, 5]
    confidence: contested
    mechanism: >
      A warm Indian Ocean warms the air above it and the moist air
      flowing onto India from the south. It also weakens the contrast
      between the land and the sea that drives the sea breezes along the
      coast, so the coast gets less relief, and the whole subcontinent
      starts the hot season from a higher floor.
    caveat: >
      One study's finding, on a short record, and hard to separate from
      El Niño because the basin warms after one: the springs of 1998,
      2010 and 2016 had both. The basin-wide warming trend of recent
      decades is bound up with the same statistic. Treat this as one
      more reason a post-El Niño spring runs hot, not as an independent
      forecast.
    evidence_note: >
      The variability of heat waves over India during 1961–2013 is
      influenced by tropical Indian Ocean as well as central Pacific
      temperatures, and warming of the tropical Indian Ocean is expected
      to bring more frequent and longer heat waves.
    sources: [rohini_2016]

  # ---- Tibetan Plateau winter snow
  - id: el_nino_tibet_snow
    from: enso
    when: el_nino
    to: tibet_winter_snow
    effect: 1
    lag_months: [4, 9]
    season: [11, 12, 1, 2, 3]
    confidence: contested
    mechanism: >
      Two routes are proposed. Rain over the central Pacific in an El
      Niño winter launches waves along the jet stream that cross North
      America, the Atlantic and North Africa and arrive over the
      Himalaya, where they favour rising air and snowfall. And the
      suppressed rain over the western Pacific sets up a cyclonic swirl
      that pulls cold air and tropical moisture onto the eastern plateau,
      where both cool the ground and thicken the snow.
    caveat: >
      Contested and built on a short satellite snow record. The proposed
      wave path is a speculation supported by ray tracing; the two
      studies that find more snow disagree about where on the plateau it
      falls; and the relationship between ENSO and spring snow cover
      changed sign in the early 2000s, positive before and negative
      after. Some studies find the plateau's snow independent of ENSO
      altogether. The map shows the lean of the longer record.
    evidence_note: >
      Statistical analysis and ray tracing of the short satellite record
      link wintertime central-Pacific ENSO conditions to Rossby waves
      reaching the plateau and to increased winter snowfall; station
      snow depth and model experiments show positive ENSO deepening
      early-winter snow over the eastern plateau through suppressed
      western-Pacific convection, with more snowfall doing more than
      cold; against it, the ENSO–spring snow cover correlation was
      significantly positive in 1988–2003 and clearly negative in
      2004–19, with some studies finding no relationship.
    sources: [shaman_tziperman_2005, jiang_2019, shen_2021, wang_2022]

  - id: positive_iod_tibet_snow
    from: iod
    when: positive
    to: tibet_winter_snow
    effect: 1
    lag_months: [4, 6]
    season: [11, 12, 1]
    confidence: contested
    mechanism: >
      A positive dipole means heavy rain over the warm western Indian
      Ocean in autumn. That rain sends a wave northeastward through the
      atmosphere that sets up a cyclonic swirl over the central and
      western plateau in early winter, drawing moisture in from the
      Arabian Sea and the Bay of Bengal and lifting it into snow.
    caveat: >
      Two recent studies of a short record, and a dipole usually comes
      with an El Niño, so the two are hard to separate: one study finds
      the dipole matters most on the central and western plateau and
      ENSO on the east, the other finds the dipole's effect holds even
      with a neutral Pacific. The dipole fades by December, so the snow
      it adds is early-winter snow, and what happens to the snowpack
      after that is up to the winter.
    evidence_note: >
      Station snow depth and model simulations show a positive dipole
      inducing an anomalous cyclonic circulation over the central
      western plateau in early winter, transporting extra moisture from
      the tropics for more snowfall; a positive dipole with either a
      positive or a neutral ENSO excites the southern Eurasia pattern
      whose cyclone around the plateau, with enhanced southwesterlies
      over the Arabian Sea and Bay of Bengal, brings heavy
      November–December snowfall in observations and in CAM5 experiments.
    sources: [jiang_2019, shen_2021]
  # ---- Quasi-Biennial Oscillation (M23). A band of wind in the equatorial
  # stratosphere; the map draws the parts of its influence that are pushes
  # (the Holton–Tan effect on the polar vortex and so on the NAO) and one
  # link that stopped working (Atlantic hurricanes). Its best-known role,
  # changing the strength of other links, waits for a later version. The
  # NAO links use lag 1 so a November phase reaches December; the season is
  # the three winter months where the surface signal is found. The hurricane
  # links are read in the season itself (lag 0), August–October, as Gray did.
  # Nothing pushes the QBO.
  - id: easterly_qbo_negative_nao
    from: qbo
    when: easterly
    to: nao
    effect: -1
    lag_months: [1, 3]
    season: [12, 1, 2]
    confidence: probable
    mechanism: >
      Planetary-scale waves rising from the winter troposphere are steered
      by the winds they meet in the stratosphere. With easterly wind over
      the equator the waves cannot cross into the tropics, more of them
      break against the polar vortex, and the vortex weakens and warms,
      sometimes suddenly. A weak vortex leaks down through the lower
      stratosphere over a few weeks and shows at the surface as a
      negative North Atlantic Oscillation: a weaker Iceland low, a weaker
      Azores high, and Atlantic westerlies that are slack and pushed
      south.
    caveat: >
      An average over many winters, not a rule for one. The effect is
      clearest in early winter, was nearly absent from 1978 to 1997, and
      models make it weaker than the record does; a multi-century model
      run calls the QBO's link to the Arctic Oscillation likely real and
      its link to the NAO probable but not certain, which is why the
      arrow is dashed. Which height of the wind matters most is still
      argued. A chosen NAO is never pushed, so pick the QBO alone with
      the chain on to see this arrow; the NAO's own winter map then
      follows one tier down.
    evidence_note: >
      In sixteen winters of 50 hPa data the high-latitude stratosphere is
      significantly lower in pressure, a stronger vortex, in westerly
      than easterly phases, with the largest planetary wave 40% stronger
      in November–December of easterly phases (Holton and Tan 1980); a
      review of three decades of work confirms the vortex is weaker in
      easterly winters while leaving the mechanism and the best height
      open (Anstey and Shepherd 2014); the easterly phase favours more
      extreme cold events in northern Europe and eastern North America,
      with a signature roughly comparable to ENSO's (Thompson, Baldwin
      and Wallace 2002); weak-vortex events are followed over about two
      months by negative Arctic Oscillation patterns at the surface
      (Baldwin and Dunkerton 2001); seasonal hindcasts started on 1
      December reproduce a surface Arctic Oscillation response to the
      QBO (Marshall and Scaife 2009); the January sea-level-pressure
      response resembles the positive NAO under westerly winds and comes
      mainly through the polar vortex (Gray et al. 2018); a multi-century
      model run finds the QBO–Arctic Oscillation link likely real and the
      QBO–NAO link probable, though weaker than observed (Andrews et al.
      2019); the effect faded in 1978–1997 (Lu et al. 2014); the
      mechanism is argued between the critical-line and meridional-
      circulation explanations (Garfinkel et al. 2012; Watson and Gray
      2014); most models underestimate the early-winter warming of the
      vortex in easterly phases (Rao et al. 2020); the QBO and ENSO
      signals in the Arctic stratosphere were correlated in time in the
      first half of the record and are hard to separate (Garfinkel and
      Hartmann 2007).
    sources: [holton_tan_1980, anstey_shepherd_2014, baldwin_2001, thompson_2002, baldwin_dunkerton_2001, marshall_scaife_2009, gray_2018, andrews_2019, lu_2014, garfinkel_2012, watson_gray_2014, rao_2020, garfinkel_hartmann_2007]

  - id: westerly_qbo_positive_nao
    from: qbo
    when: westerly
    to: nao
    effect: 1
    lag_months: [1, 3]
    season: [12, 1, 2]
    confidence: probable
    mechanism: >
      With westerly wind over the equator, planetary-scale waves rising
      from the winter troposphere can spread into the tropics, fewer of
      them break against the polar vortex, and the vortex stays strong
      and cold. A strong vortex reaches the surface over the following
      weeks as a positive North Atlantic Oscillation: a deeper Iceland
      low, a stronger Azores high, and Atlantic westerlies that are
      stronger and further north.
    caveat: >
      The same average, with the same doubts, as the easterly side:
      clearest in early winter, nearly absent from 1978 to 1997, weaker
      in models than in the record, and probable rather than certain for
      the NAO itself. Holton and Tan's own late-winter signal did not
      survive a longer record. A chosen NAO is never pushed, so pick the
      QBO alone with the chain on to see this arrow.
    evidence_note: >
      The high-latitude stratosphere is significantly lower in pressure,
      a stronger vortex, in westerly phases in every month composited
      (Holton and Tan 1980); the vortex is stronger in westerly winters
      across the reviewed record (Anstey and Shepherd 2014); the January
      sea-level-pressure response under westerly winds resembles the
      positive NAO and is insensitive to the exact height of the
      westerlies between 10 and 70 hPa (Gray et al. 2018); a surface
      Arctic Oscillation response appears in hindcasts started on 1
      December (Marshall and Scaife 2009); a multi-century model run
      rates the link to the NAO probable but not certain, and finds it
      stronger when the westerlies fill a deep layer (Andrews et al.
      2019); the effect faded in 1978–1997 (Lu et al. 2014); Arctic
      stratospheric temperatures in late autumn and early winter are
      colder in westerly phases (Garfinkel and Hartmann 2007);
      strengthenings of the vortex are followed by the opposite of the
      cold-event pattern at the surface (Thompson, Baldwin and Wallace
      2002).
    sources: [holton_tan_1980, anstey_shepherd_2014, gray_2018, marshall_scaife_2009, andrews_2019, lu_2014, garfinkel_hartmann_2007, thompson_2002, baldwin_dunkerton_2001, baldwin_2001]

  - id: westerly_qbo_atlantic_hurricanes
    from: qbo
    when: westerly
    to: atlantic_hurricanes
    effect: 1
    lag_months: [0, 2]
    season: [8, 9, 10]
    confidence: contested
    mechanism: >
      The proposal from the 1980s: in westerly seasons the wind in the
      lowest stratosphere over the tropical Atlantic is closer to the
      wind just beneath it, so the tops of growing storms are sheared
      less and more of them reach hurricane strength. The same seasonal
      forecasts that first used El Niño also used the QBO.
    caveat: >
      A link that stopped working, kept on the map as a lesson. From the
      1950s to the 1980s westerly seasons were clearly busier and the QBO
      went into the first seasonal hurricane forecasts; after about 1990
      the relationship vanished from the record, and the explanations
      tried, El Niño, volcanoes, the QBO's own decadal changes, the solar
      cycle, do not account for it. Drawn dotted for that reason, and
      read the year: the arrow describes the Atlantic of 1950–1990.
    evidence_note: >
      Seasonal hurricane frequency in 1950–1982 was substantially above
      normal when the 30 hPa equatorial wind blew from the west or was
      turning westerly during the season (Gray 1984); the 30 hPa wind
      explains about 30% of the variance in August–October Atlantic
      storm activity in 1955–1983, resilient to removing El Niño years
      (Shapiro 1989); the relationship is statistically significant from
      the 1950s to the 1980s and no longer present in later years, with
      no satisfying explanation found (Camargo and Sobel 2010); a major
      review lists a possible effect on Atlantic hurricane strength among
      the QBO's influences (Baldwin et al. 2001).
    sources: [gray_1984, shapiro_1989, camargo_sobel_2010, baldwin_2001]

  - id: easterly_qbo_atlantic_hurricanes
    from: qbo
    when: easterly
    to: atlantic_hurricanes
    effect: -1
    lag_months: [0, 2]
    season: [8, 9, 10]
    confidence: contested
    mechanism: >
      The proposal from the 1980s, in reverse: in easterly seasons the
      wind in the lowest stratosphere over the tropical Atlantic differs
      more from the wind just beneath it, the tops of growing storms are
      sheared more, and fewer reach hurricane strength.
    caveat: >
      The same link that stopped working. Easterly seasons were quieter
      from the 1950s to the 1980s and not since about 1990; the 2010
      season, easterly at the height the map reads until late summer,
      was one of the busiest on record. Drawn dotted for that reason.
    evidence_note: >
      Hurricane activity in 1950–1982 was below normal when the 30 hPa
      equatorial wind blew from the east or was turning easterly during
      the season (Gray 1984); the in-phase relation with the 50 hPa wind
      and the 30% of variance explained apply to both phases (Shapiro
      1989); the relationship is significant from the 1950s to the 1980s
      and absent in later years (Camargo and Sobel 2010).
    sources: [gray_1984, shapiro_1989, camargo_sobel_2010]
  # ---- Barents–Kara autumn sea ice (M24). A contested driver, on the map
  # because the dispute is the lesson. Only the low-ice phase draws arrows:
  # a colder central Siberia, western Russia and East Asia, and a push on
  # the NAO toward negative, every one of them contested. The lag is 1–3 so
  # an October reading reaches December, the season the three winter
  # months. Nothing pushes the ice: its retreat is a trend, which the map
  # does not draw.
  - id: low_ice_siberia_cold
    from: barents_kara_ice
    when: low
    to: siberia_winter
    effect: -1
    lag_months: [1, 3]
    season: [12, 1, 2]
    confidence: contested
    mechanism: >
      Where the autumn ice is missing, the open sea heats and moistens the
      air above it. The warmed air builds a ridge of high pressure over
      the Urals and the Siberian coast, the ridge steers the storms that
      would otherwise cross the Barents Sea away, and on its eastern side
      the Siberian high grows stronger and spreads. Arctic air then drains
      south across central Siberia: a warm Arctic and a cold continent in
      the same month. A second path runs through the stratosphere: the
      ridge sends more wave energy upward, the polar vortex weakens, and
      the cold deepens over Siberia in late winter.
    caveat: >
      The most argued arrow on the map. The claim rests on some forty
      winters, in which low ice and cold Siberia did tend to come
      together; one large model experiment found the odds of a severe
      Siberian winter more than doubled by the ice loss, and another
      traced a stratospheric path. But cold Siberian winters and open
      Barents water can be two results of the same weather pattern, and
      when six models were run with and without the observed ice loss the
      continent did not cool; a twenty-five-winter cooling trend across
      Eurasia was judged unlikely to be the ice's doing; the ridge over
      the Urals may cause the low ice rather than follow from it; and a
      warm Gulf Stream can produce both at once. Dotted for all of that.
      Read the Siberian card either way: if the link is real it is small
      in any one winter and the rest is chance.
    evidence_note: >
      Reduced Barents–Kara ice in a general circulation model produces a
      high over the polar ocean and easterly flow across the continents,
      a winter cooling reaching −1.5°C with cold extremes three times
      more likely (Petoukhov and Semenov 2010); low autumn ice is
      followed by cold over the Far East in early winter and from Europe
      to the Far East in late winter, through a stronger Siberian high
      (Honda, Inoue and Yamane 2009); in light-ice years cyclones stall
      over the Barents Sea and an anticyclone forms along the Siberian
      coast, the warm-Arctic cold-Siberian pattern (Inoue, Hori and
      Takaya 2012); a large ensemble finds the probability of severe
      winters in central Eurasia more than doubled by the sea-ice
      decline, through more frequent Eurasian blocking (Mori et al.
      2014); a stratospheric pathway links Barents–Kara ice loss to a
      colder Siberia (Zhang et al. 2018); a cooling trend across Eurasia
      is linked to the ice (Outten and Esau 2011); reviews of the case
      for and against (Cohen et al. 2014; Vihma 2014; Overland et al.
      2015). Against: twenty-five winters of Eurasian cooling are
      unlikely to be due to Arctic sea-ice loss (McCusker, Fyfe and
      Sigmond 2016); neither ice loss nor greenhouse forcing yields
      colder continents in multiple models, and ice loss reduces cold
      extremes (Sun, Perlwitz and Hoerling 2016); six coordinated models
      find the ice changes do not lead to colder Siberian winters (Ogawa
      et al. 2018); the coincidence of low ice and cold winters is
      explained by the circulation driving both, with minimal influence
      from the ice (Blackport et al. 2019), though the modelled cooling
      may be too weak (Screen and Blackport 2019); a poleward shift of
      the Gulf Stream front can drive both the ice retreat and the
      Eurasian cold (Sato, Inoue and Watanabe 2014); Ural blocking in
      November drives the early-winter response while perturbed ice and
      snow alone do not (Peings 2019); observed statistics overestimate
      the causal effect of ice on mid-latitude winters (Blackport and
      Screen 2021); ice loss alone has played a secondary role relative
      to natural variability (Overland et al. 2021).
    sources: [petoukhov_semenov_2010, honda_2009, inoue_2012, mori_2014, zhang_2018, outten_esau_2011, cohen_2014, vihma_2014, overland_2015, mccusker_2016, sun_2016, ogawa_2018, blackport_2019, screen_blackport_2019, sato_2014, peings_2019, blackport_screen_2021, overland_2021]

  - id: low_ice_negative_nao
    from: barents_kara_ice
    when: low
    to: nao
    effect: -1
    lag_months: [1, 3]
    season: [12, 1, 2]
    confidence: contested
    mechanism: >
      The ridge that low ice builds over the Urals lines up with the
      planetary-scale waves of early winter and strengthens them, so more
      wave energy rises into the stratosphere and breaks against the
      polar vortex. The vortex weakens and warms, sometimes suddenly, and
      over the following weeks the weakening leaks back down to the
      surface as a negative North Atlantic Oscillation: a weaker Iceland
      low, a weaker Azores high, slack westerlies, cold in northern
      Europe and the eastern United States, mild in Greenland. The path
      takes time, which is why the studies find the surface signal in
      late winter.
    caveat: >
      Contested, and dotted. The path through the stratosphere is
      detectable in the record and reproduced by some models, but it
      appears in only a minority of resampled records, the lagged
      correlation between autumn ice and the winter NAO has come and gone
      over the last century, and a model forced with the observed ice
      alone does not reproduce the relationship, which can instead be
      generated by the atmosphere's own variability and by the tropics.
      Sixteen models agree on a weak push toward the negative NAO, worth
      about a tenth of the swing in any single winter. A chosen NAO is
      never pushed, so pick the ice alone with the chain on to see this
      arrow; the NAO's own winter map then follows, still dotted.
    evidence_note: >
      Barents–Kara sea-ice loss weakens the stratospheric polar vortex in
      observations and model experiments (Kim et al. 2014); reduced
      November ice leads to more negative Arctic Oscillation and NAO in
      early and late winter, with large negative events more than twice
      as frequent in a high-top model (Nakamura et al. 2015); in a nine-
      region experiment only Barents–Kara ice loss weakens the vortex and
      is followed by an NAO-like surface response (Screen 2017); the
      stratospheric pathway from late-autumn ice to the February NAO is
      detectable and explains about 26% of its variance but is highly
      intermittent, appearing in 16% of resampled records (Siew et al.
      2020); causal-network analysis finds Barents–Kara ice an important
      driver of the winter Arctic Oscillation (Kretschmer et al. 2016);
      models forced by ice loss give a weak negative-NAO response in early
      winter, often masked by internal variability (Screen et al. 2013;
      Deser et al. 2010). Against: the observed ice–NAO relationship is
      reproduced by internal variability and not as a forced response to
      the ice, with tropical rainfall driving the covariability (Warner,
      Screen and Scaife 2020); the lagged correlation is non-stationary
      across centennial reanalyses and large ensembles, which questions
      its causality (Kolstad and Screen 2019); coupled models capture the
      delayed ice–vortex–NAO connection but weaker than observed, and its
      sign varies between ensemble members (Blackport and Screen 2021);
      sixteen models simulate a robust but weak weakening of the
      westerlies, an NAO response accounting for around 10% of variations
      in individual years, and the observed relationship has weakened
      recently (Smith et al. 2022); models agree in sign but disagree in
      size (Screen et al. 2018).
    sources: [kim_2014, nakamura_2015, screen_2017, siew_2020, kretschmer_2016, screen_2013, deser_2010, warner_2020, kolstad_screen_2019, blackport_screen_2021, smith_2022, screen_2018]

  - id: low_ice_east_asia_cold
    from: barents_kara_ice
    when: low
    to: east_asia_winter
    effect: -1
    lag_months: [1, 3]
    season: [12, 1, 2]
    confidence: contested
    mechanism: >
      The stronger Siberian high that follows low Barents–Kara ice drives
      the East Asian winter monsoon: cold air pours south-east out of
      Siberia across Mongolia and northern China to Korea and Japan. A
      wave train set off by the heating over the open Arctic water arcs
      east along the Siberian coast and arrives over East Asia in early
      winter with high pressure behind it.
    caveat: >
      Contested. The East Asian link is the best-attested regionally: two
      studies from different groups found the early-winter cold over the
      Far East, and one separated it from a different, Pacific-side ice
      loss that reaches North America. But the same objections apply as
      for Siberia: the record is short, the statistics can run the other
      way, and models mostly do not reproduce a cooling. East Asia's
      winter also answers to ENSO on this map, at a higher tier; when both
      are chosen the arrows may argue.
    evidence_note: >
      Significant cold anomalies over the Far East in early winter follow
      low autumn Arctic ice, reproduced in a model as a stationary wave
      from the Barents–Kara heating that amplifies the Siberian high
      (Honda, Inoue and Yamane 2009); warming over the Barents–Kara seas
      favours cold winters over East Asia while warming over the East
      Siberian–Chukchi seas favours cold over North America (Kug et al.
      2015); the winter Siberian high is stronger after low autumn ice in
      the eastern Arctic and Siberian marginal seas, with September ice a
      precursor beyond what tropical seas predict (Wu, Su and Zhang
      2011); light-ice years bring an anticyclone along the Siberian
      coast and cold advection over eastern Siberia (Inoue, Hori and
      Takaya 2012); early-winter reduced Barents–Kara ice may reinforce
      existing teleconnections to central Asia and downstream East Asia
      (Overland et al. 2021); reviews of the East Asian case (Gao et al.
      2014; Vihma 2014). Against: multi-model experiments give no cooling
      of the continents from ice loss (Sun, Perlwitz and Hoerling 2016;
      Ogawa et al. 2018); the coincidence is explained by the circulation
      driving both (Blackport et al. 2019); ice loss alone has played a
      secondary role (Overland et al. 2021).
    sources: [honda_2009, kug_2015, wu_2011, inoue_2012, overland_2021, gao_2014, vihma_2014, sun_2016, ogawa_2018, blackport_2019]

  - id: low_ice_western_russia_cold
    from: barents_kara_ice
    when: low
    to: western_russia_winter
    effect: -1
    lag_months: [1, 3]
    season: [12, 1, 2]
    confidence: contested
    mechanism: >
      The ridge over the Urals that follows low ice blocks the mild
      Atlantic air that usually crosses European Russia in winter, and on
      its western flank Arctic air from the Barents and Kara coasts is
      steered south over the Russian plain. The first model study of the
      link put the largest cooling here, over Europe and northern Asia,
      and named the cold winter of 2005–06 as its example.
    caveat: >
      Contested, and read with the Siberian arrow: the same studies for,
      the same studies against. Western Russia's winter also answers to
      the North Atlantic Oscillation on this map at the established tier,
      and the ice pushes the NAO the same way, so with the chain on this
      region can be cold twice over from one cause. A twenty-five-winter
      cooling trend across Eurasia, the strongest evidence for this arrow
      in the 2010s, has since been judged more likely chance than ice.
    evidence_note: >
      Lower Barents–Kara ice concentration in a model brings a
      continental-scale winter cooling reaching −1.5°C, with cold extremes
      over large areas including Europe more than three times as likely,
      in a non-linear response that peaks at intermediate ice loss
      (Petoukhov and Semenov 2010); zonally elongated cold anomalies from
      Europe to the Far East in late winter follow low ice, with the
      negative NAO (Honda, Inoue and Yamane 2009); the odds of severe
      winters in central Eurasia more than doubled (Mori et al. 2014); a
      cooling trend over Eurasia is linked to the ice (Outten and Esau
      2011); the recent ice reduction results in cold winters in mid-
      latitude continental regions in a high-top model (Nakamura et al.
      2015). Against: the Eurasian cooling of 1990–2015 is unlikely due to
      ice loss (McCusker, Fyfe and Sigmond 2016); no cooling in multi-
      model experiments (Sun, Perlwitz and Hoerling 2016; Ogawa et al.
      2018); minimal influence of the ice on coincident cold winters
      (Blackport et al. 2019); the statistics are inflated by the
      circulation's effect on the ice (Blackport and Screen 2021).
    sources: [petoukhov_semenov_2010, honda_2009, mori_2014, outten_esau_2011, nakamura_2015, mccusker_2016, sun_2016, ogawa_2018, blackport_2019, blackport_screen_2021]
  # ---- Eurasian October snow cover (M25). The second contested Arctic
  # precursor, paired with the Barents–Kara ice (M24) as one lesson. Only the
  # high-snow phase draws arrows: the NAO pushed negative, northern Europe
  # and the eastern United States colder, every one contested. The lag is
  # 2–3 as the plan asks, so an October reading reaches December through
  # the stratosphere; the season is the three winter months. Nothing pushes
  # the snow.
  - id: high_snow_negative_nao
    from: eurasian_october_snow
    when: high
    to: nao
    effect: -1
    lag_months: [2, 3]
    season: [12, 1, 2]
    confidence: contested
    mechanism: >
      Snow cools the ground beneath it, so a wide October snow cover
      builds the Siberian high early and strong. The high sits where the
      planetary-scale waves of early winter have their source, and it
      strengthens them, so more wave energy rises into the stratosphere
      in November and December and breaks against the polar vortex. The
      vortex weakens and warms, and over the following weeks the
      weakening works its way down to the surface as the negative phase
      of the Arctic Oscillation, which on this map is the negative NAO:
      high pressure over the pole, slack westerlies, cold spilling south.
      Six steps, each of them observed in 2009–10.
    caveat: >
      Contested, and dotted. The correlation was found in the satellite
      era, from 1972, and a reanalysis of the whole twentieth century
      shows it did not exist before the 1970s; it may depend on the phase
      of the equatorial stratospheric wind, or be a statistical accident.
      Models give a weak version at best, and some suggest the autumn
      circulation makes the snow rather than the snow making the winter.
      Since about 2010 the forecasts that used it have missed badly. The
      satellite snow record itself charted more October snow after 1990
      than other data show. A chosen NAO is never pushed, so pick the
      snow alone with the chain on to see this arrow; the NAO's own
      winter map then follows, still dotted. The Barents–Kara ice pushes
      the NAO the same way, and the two precursors are largely one
      signal; picking both is not evidence that they add up.
    evidence_note: >
      Early-season Eurasian snow cover is associated with a stronger,
      more expansive Siberian high and with the dominant mode of winter
      variability in the following winter (Cohen and Entekhabi 1999); the
      correlation between autumn snow and winter circulation strengthens
      downward from the stratosphere, consistent with snow acting through
      upward-propagating waves (Saito, Cohen and Entekhabi 2001); a model
      forced with the highest (1976) and lowest (1988) observed Siberian
      snow produces a downward-propagating negative Arctic Oscillation
      through the winter (Gong, Entekhabi and Cohen 2003); years with
      large October snow feature strong upward wave pulses, a weaker
      vortex and high polar heights (Cohen et al. 2007); a hundred-member
      ensemble reproduces the stratosphere–troposphere response to a
      Siberian snow anomaly (Fletcher et al. 2009); prescribing observed
      snow in a model that lacked it recovers the snow–AO relationship
      and the recent AO trend (Allen and Zender 2011); a snow-advance
      index explains a large fraction of the winter AO's variance (Cohen
      and Jones 2011); in high-snow years surface pressure is higher from
      1 November and the lower-stratospheric heat flux is stronger from
      mid-November, with surface-to-stratosphere wave events nearly twice
      as frequent (Cohen et al. 2014); the snow–NAO link is strongest in
      Arctic warming periods, for November snow (Wegmann et al. 2020).
      Against: the teleconnection is not stationary and did not emerge
      until the 1970s, with the QBO a possible modulator, so statistical
      forecasts should not rest on snow alone (Peings et al. 2013); the
      snow–AO relationship has only emerged since the 1970s, the QBO
      modulation may be a purely stochastic effect, and empirical
      prediction from snow or ice alone is limited (Douville, Peings and
      Saint-Martin 2017); CMIP5 models do not capture a robust link
      (Furtado et al. 2015); the remote influence of snow is weak in two
      models, the atmosphere may have driven the snow rather than the
      reverse, and the teleconnection may be a stochastic artefact
      (Peings et al. 2017); snow–atmosphere coupling is real locally but
      the remote link is weak in models and non-stationary in the record
      (Henderson et al. 2018); causal analysis finds snow's role on the
      AO unclear (Kretschmer et al. 2016); only November snow, not
      October, covaries significantly with the winter NAO (Santolaria-
      Otín et al. 2020); the November snow dipole and Barents–Kara ice
      are driven by the same Scandinavian pattern (Gastineau, García-
      Serrano and Frankignoul 2017); the rising October snow trend in the
      NOAA charts is an internal artefact of the dataset (Brown and
      Derksen 2013).
    sources: [cohen_entekhabi_1999, saito_2001, gong_2003, cohen_2007_snow, fletcher_2009, allen_zender_2011, cohen_jones_2011, cohen_2014_snow, wegmann_2020, peings_2013, douville_2017, furtado_2015, peings_2017, henderson_2018, kretschmer_2016, santolaria_otin_2020, gastineau_2017, brown_derksen_2013]

  - id: high_snow_eastern_us_cold
    from: eurasian_october_snow
    when: high
    to: eastern_north_america_winter
    effect: -1
    lag_months: [2, 3]
    season: [12, 1, 2]
    confidence: contested
    mechanism: >
      The same path, one step further: the weakened vortex and the
      negative Arctic Oscillation that follow a snowy Siberian October
      put a blocking high over Greenland and the pole, and Arctic air is
      steered south down the eastern side of North America, where the
      big coastal snowstorms follow. The index's makers found their snow
      index a better guide to eastern United States winter temperature
      than the observed winter AO itself.
    caveat: >
      Contested, and the arrow with the most public record of failure.
      In October 2016 the snow spread across Siberia wider than in all
      but a handful of Octobers, and the forecasts built on it called for
      a cold, snowy winter in the eastern United States; the winter was
      the sixth warmest in the American record and February 2017 the
      second warmest. The link is drawn for the winters it fitted, 1976–77
      and 2009–10 above all. The eastern United States is also reached by
      the NAO's own arrow on this map, at the established tier; with the
      chain on this region carries two arrows from one cause.
    evidence_note: >
      A snow index built from summer and autumn anomalies is more highly
      correlated with eastern United States winter temperatures than the
      observed winter AO (Cohen and Saito 2003); a statistical forecast
      model using October snow and pressure shows positive skill over the
      eastern United States in seven real-time winters and thirty-three
      hindcasts, where dynamical models had none (Cohen and Fletcher
      2007); a model forced with the snow of the winter of 1977–78
      reproduces the observed mid-latitude circulation anomalies (Cohen
      and Entekhabi 2001); in 2009–10 the expansion of cold into the
      eastern United States followed the second stratospheric warming
      and Mid-Atlantic snowfalls exceeded 135 cm in seventeen days (Cohen
      et al. 2010). Against: the snow–AO teleconnection did not exist
      before the 1970s (Peings et al. 2013; Douville, Peings and Saint-
      Martin 2017) and may be a stochastic artefact (Peings et al. 2017);
      the winter of 2016–17 was the sixth warmest on record for the
      contiguous United States after a wide October snow (NOAA National
      Centers for Environmental Information 2017; Rutgers Global Snow
      Lab); the severe winter of 1976–77 has been attributed instead to
      the Pacific and a persistent El Niño (Namias 1978).
    sources: [cohen_saito_2003, cohen_fletcher_2007, cohen_entekhabi_2001, cohen_2010, peings_2013, douville_2017, peings_2017, ncei_winter_2017, weather_channel_2016, rutgers_snow_lab, namias_1978]

  - id: high_snow_northern_europe_cold
    from: eurasian_october_snow
    when: high
    to: northern_europe_winter
    effect: -1
    lag_months: [2, 3]
    season: [12, 1, 2]
    confidence: contested
    mechanism: >
      Two paths into Europe. Directly, the early, strong Siberian high
      pushes cold air west across Russia toward Scandinavia and Germany.
      Through the stratosphere, the weakened vortex and the negative
      Arctic Oscillation that follow slacken the Atlantic westerlies, so
      the mild maritime air stops at the coast and northern Europe sits
      under Arctic or continental air for weeks at a time, as it did in
      the winter of 2009–10.
    caveat: >
      Contested. The statistical model that used October snow had skill
      over northern Eurasia in hindcasts, and the winter of 2009–10 fits
      the path step by step; but the same twentieth-century reanalysis
      that undercuts the NAO link undercuts this one, and the winter of
      2019–20, after a wide October snow, was the mildest on record
      across much of Europe with the strongest polar vortex and the most
      positive Arctic Oscillation ever measured. Northern Europe is also
      reached by the NAO's own arrow at the established tier; with the
      chain on this region carries two arrows from one cause.
    evidence_note: >
      The snow-based forecast model has positive skill over northern
      Eurasia in hindcasts and real-time forecasts (Cohen and Fletcher
      2007); the cooling effect of snow builds a stronger, more expansive
      Siberian high with more frequent intrusions west (Cohen and
      Entekhabi 1999); winter cooling trends across northern Eurasia in
      the last two decades are argued to follow increasing autumn snow
      (Cohen et al. 2012); in 2009–10 the cold that reached Europe
      followed the two stratospheric warmings (Cohen et al. 2010).
      Against: the teleconnection is non-stationary (Peings et al. 2013;
      Douville, Peings and Saint-Martin 2017); weak or absent in models
      (Furtado et al. 2015; Henderson et al. 2018); the increasing snow
      trend behind the cooling argument is largely a dataset artefact
      (Brown and Derksen 2013); the winter of 2019–20 featured an
      exceptionally strong vortex and an unprecedentedly positive Arctic
      Oscillation with above-normal temperatures across Europe (Lawrence
      et al. 2020) after an above-normal October snow (Rutgers Global
      Snow Lab).
    sources: [cohen_fletcher_2007, cohen_entekhabi_1999, cohen_2012_snow, cohen_2010, peings_2013, douville_2017, furtado_2015, henderson_2018, brown_derksen_2013, lawrence_2020, rutgers_snow_lab]

  # ================================================================ EL NIÑO, CENTRAL PACIFIC (M36)
  # Links that hold only for the central-Pacific kind (docs/PLAN.md §4 rule
  # 11). Each replaces a classic El Niño link that lists el_nino_central
  # in `except`; everything not listed here is inherited from El Niño.
  - id: el_nino_central_indian_monsoon
    from: enso
    when: el_nino_central
    to: indian_summer_monsoon
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: established
    mechanism: >
      With the warmest water near the dateline, the rising air of the
      Pacific sits where its compensating sinking branch settles squarely
      over India, cutting the moist inflow that feeds the monsoon. Model
      experiments with idealised warmings place the drought-making
      subsidence over India for a central warming and further east for an
      eastern one.
    caveat: >
      The monsoon has weather of its own from week to week, and a warm
      Indian Ocean or a positive dipole can hold the rains up in a
      central-Pacific year.
    evidence_note: >
      Kumar and others (2006) found in the 132-year record that every
      severe Indian drought came with an El Niño, but that the El Niños
      that brought drought were the ones with their warmest water in the
      central Pacific; 2002, 2004 and 2009, all central-Pacific events,
      were drought years. This link replaces the classic El Niño link for
      this kind.
    sources: [kumar_2006, kumar_1999, francis_gadgil_2010]

  - id: el_nino_central_atlantic_hurricanes
    from: enso
    when: el_nino_central
    to: atlantic_hurricanes
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: contested
    mechanism: >
      With the warming near the dateline rather than off South America, the
      atmosphere's answer over the Atlantic changes: Kim, Webster and Curry
      found weaker wind shear over the main hurricane region and more
      storms, with more of them heading for the Gulf of Mexico and Central
      America.
    caveat: >
      Contested: later studies found no consistent Atlantic signal from
      central-Pacific warming, and the quiet 2009 season, in the strongest
      such event on record, ran the other way.
    evidence_note: >
      Kim, Webster and Curry (2009) reported a busier Atlantic season in
      central-Pacific warming years; Lee, Wang and Enfield (2010) found that
      only three of their five years were busy and two were quiet, Larson
      and others (2012) found no significant effect either way, and
      Patricola and others (2016) find in models that the classic
      suppression simply weakens. What the studies agree on is that the
      classic suppression is missing; whether the season is actually busier
      is the contested part, so this link is drawn dotted.
    sources: [kim_webster_curry_2009, lee_wang_enfield_2010, larson_2012, patricola_2016]

  - id: el_nino_central_us_gulf_coast
    from: enso
    when: el_nino_central
    to: us_gulf_coast_winter
    effect: 1
    lag_months: [4, 7]
    season: [11, 12, 1, 2, 3]
    confidence: probable
    mechanism: >
      The strengthened subtropical jet still steers storms toward the Gulf,
      but with the warming near the dateline its core sits further south,
      over the Gulf itself, so only a smaller strip of the coast and Florida
      is left wetter than usual.
    caveat: >
      Yu and Zou (2013) find the wet signal on the Southeast coast weaker
      and smaller in area than in a classic El Niño; a dry winter is a real
      possibility.
    evidence_note: >
      Larkin and Harrison (2005) first showed that "dateline" El Niño
      winters have a different weather map over the United States from
      classic ones; Yu and Zou (2013) find the wet anomalies of the
      Southeast smaller and the dry ones of the Ohio valley larger. This
      link replaces the classic El Niño link for this kind, one tier lower.
      The Pacific Decadal Oscillation weakens it as it does the classic
      link: the link is shown one tier lower again when a negative PDO is
      chosen alongside.
    sources: [yu_zou_2013, larkin_harrison_2005]
    weakened_by:
      - driver: pdo
        phase: negative
        sources: [gershunov_barnett_1998, mccabe_dettinger_1999, yu_zwiers_2007]

  - id: el_nino_central_eastern_north_america
    from: enso
    when: el_nino_central
    to: eastern_north_america_winter
    effect: -1
    lag_months: [5, 8]
    season: [12, 1, 2, 3]
    confidence: contested
    mechanism: >
      The wave train that a central-Pacific warming sets off across North
      America arrives in a different place from the classic one: instead of
      the warm north and cool south of a classic El Niño winter, it tends to
      give a warm Northwest and a cold Southeast, with the cold reaching the
      eastern seaboard.
    caveat: >
      Contested: the pattern rests on about a dozen events since 1950,
      climate models reproduce it poorly, and the North Atlantic
      Oscillation can overwhelm it, as it did in the winter of 2009–10.
    evidence_note: >
      Yu and others (2012) find the largest central-Pacific El Niño
      temperature signal over the northwestern and southeastern United
      States, a warm Northwest and a cold Southeast, where the classic kind
      mostly affects the Great Lakes, the Northeast and the Southwest; Zou
      and others (2014) find most climate models cannot reproduce it. The
      map has no separate Southeast marker, so the cold is drawn on the
      eastern North America marker.
    sources: [yu_2012, zou_2014, larkin_harrison_2005, weng_2009]

  - id: el_nino_central_west_pacific_typhoons
    from: enso
    when: el_nino_central
    to: west_pacific_typhoons
    effect: 1
    lag_months: [0, 4]
    season: [7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      Warming near the dateline pulls the monsoon trough and its westerly
      winds into the northwestern part of the basin, so typhoons form
      further west and north than in a classic El Niño, more of them form,
      and more of them reach the coasts of China, Korea and Japan.
    caveat: >
      The events are few and the landfall statistics are not strong; the
      Philippines and Japan can be hit hard in any year, whichever kind of
      El Niño is under way.
    evidence_note: >
      Kim, Webster and Curry (2011) find typhoon activity shifted west and
      extended through the northwestern Pacific in central-Pacific warming
      years, with better conditions for landfall in East Asia; Chen and Tam
      (2010) find typhoon numbers rise with the Modoki index where the
      classic index shows no such signal; Wang and Wang (2013) split the
      central-Pacific kind further by its typhoon tracks. This link
      replaces the classic El Niño link for this kind.
    sources: [kim_webster_curry_2011, chen_tam_2010, wang_wang_2013]

