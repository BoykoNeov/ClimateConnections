    evidence_note: >
      Observations and model experiments tie the multidecadal swings in
      summer climate over western Europe to basin-wide changes in the
      Atlantic, and the shift to warmer summers in the mid-1990s is
      attributed largely to the ocean's swing to warm.
    sources: [sutton_hodson_2005, sutton_dong_2012, knight_2006]

  - id: negative_amo_western_europe_summer
    from: amo
    when: negative
