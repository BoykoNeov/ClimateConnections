    to: east_africa_short_rains
    effect: -1
    lag_months: [3, 5]
    season: [10, 11, 12]
    confidence: probable
    mechanism: >
      Cool water off East Africa and westerly winds along the equator carry
      moisture away from the Horn of Africa, so the short rains tend to be
      weak or late.
    caveat: >
      The drying is less reliable than the flooding of a positive event, and
      negative events often coincide with La Niña, which pushes the same way,
      so the Indian Ocean's own share is uncertain.
    sources: [behera_2005, black_2003]

  - id: negative_iod_indonesia
    from: iod
    when: negative
    to: indonesia_rainfall
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      Warm water off Sumatra and Java feeds rising air and rain over western
      Indonesia during what is normally the dry season, so the dry season
      tends to be short and wet.
    caveat: >
      Western Indonesia is rarely short of rain, so the change is easier to
      see in the data than on the ground, and eastern Indonesia answers more
      to ENSO than to the Indian Ocean.
    sources: [saji_1999, bom_iod]

  - id: negative_iod_south_india_northeast_monsoon
    from: iod
    when: negative
    to: south_india_northeast_monsoon
    effect: -1
    lag_months: [3, 5]
    season: [10, 11, 12]
    confidence: probable
    mechanism: >
      A cool western Indian Ocean feeds less moisture into the winds that
      bring the October–December rains to southern India and Sri Lanka, so
      the season tends to run dry.
    caveat: >
      There are fewer strong negative events to check this against, and La
      Niña, which often comes with them, also acts on this season.
    sources: [zubair_2003, kripalani_kumar_2004]

  # ================================================================ POSITIVE NAO
  # The NAO is a winter pattern of the atmosphere: no lag, and nothing outside
  # the cold season. Positive and negative links are both listed because the
  # sources describe the pattern as a see-saw that works in both directions.
  - id: positive_nao_northern_europe
    from: nao
    when: positive
    to: northern_europe_winter
    effect: 1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      A strong Icelandic low and Azores high drive strong westerly winds that
      carry mild, moist Atlantic air deep into Europe, so winters from
      Ireland to the Baltic tend to be mild, wet and windy.
    caveat: >
      The pattern can flip within a week, so a winter that leans positive on
      average can still hold a cold, snowy fortnight. The effect fades with
      distance from the Atlantic and is weaker in the Alps and the south.
    evidence_note: >
      Hurrell found the pattern accounts for roughly a third of the
      winter-to-winter temperature swings across northern Europe, more than
      any other single influence; the mild winters of the early 1990s were
      strongly positive years.
    sources: [hurrell_1995, hurrell_2003]

  - id: positive_nao_scandinavia_rain
    from: nao
    when: positive
    to: scandinavia_winter_rainfall
    effect: 1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      The storm track runs northeast toward Scotland and Norway, so one
      Atlantic depression after another unloads rain and snow on the
      mountains facing the ocean.
    caveat: >
      The extra precipitation is concentrated on the windward western slopes;
      the sheltered east of Norway and Sweden see much less of it and can
      even be drier.
    sources: [hurrell_1995, uvo_2003]

  - id: positive_nao_mediterranean
    from: nao
    when: positive
    to: mediterranean_winter_rainfall
    effect: -1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      With the Azores high strong and the storm track held far to the north,
      few Atlantic depressions reach Iberia and the western Mediterranean,
      so the winter rains that supply most of the year's water fall short.
    caveat: >
      Local storms in the Mediterranean itself can still bring heavy rain
      in a positive winter, and the effect weakens eastward from Portugal
      toward Italy.
    evidence_note: >
      In Portugal and western Spain the pattern explains around half of the
      winter-to-winter change in rainfall and river flow, one of the
      strongest teleconnections on this map; it is the reason a run of
      positive winters in the late 1980s and early 1990s left Iberian
      reservoirs low.
    sources: [hurrell_1995, trigo_2004]

  - id: positive_nao_eastern_north_america
    from: nao
    when: positive
    to: eastern_north_america_winter
    effect: 1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      A strong Icelandic low pulls mild southerly air up the eastern
      seaboard and keeps the Arctic air bottled up to the north, so eastern
      winters tend to be milder with less snow along the coast.
    caveat: >
      The effect is weaker than in Europe and is often overridden by the
      Pacific: ENSO and the Pacific–North American pattern have as much or
      more say over an eastern US winter.
    sources: [hurrell_2003, seager_2010]

  - id: positive_nao_greenland
    from: nao
    when: positive
    to: greenland_winter
    effect: -1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      The strong Icelandic low draws cold northerly air down its western
      flank over Greenland and the Labrador Sea, so winters there tend to be
      colder while northern Europe is mild.
    caveat: >
      Greenland's east coast and its interior respond less than the west
      coast and Labrador, and the Arctic has warmed enough in recent decades
      that a "cold" positive winter can still be milder than the past.
    evidence_note: >
      This Greenland–Europe seesaw is the oldest documented part of the
      pattern; van Loon and Rogers traced it through two centuries of
      records.
    sources: [van_loon_rogers_1978, hurrell_1995]

  - id: positive_nao_middle_east
    from: nao
    when: positive
    to: middle_east_winter_rainfall
    effect: -1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: contested
    mechanism: >
      Storms that would normally cross the Mediterranean and end over
      Turkey and the Middle East are held to the north, so winters there
      tend to be drier and the Tigris and Euphrates carry less water.
    caveat: >
      The connection is weaker and less steady than in Iberia. Some studies
      find it clearly in river flows and rainfall over Turkey; others find
      it only in some decades or not at all, and local Mediterranean storms
      can dominate a winter.
    sources: [cullen_demenocal_2000, turkes_erlat_2003]

  # ================================================================ NEGATIVE NAO
  - id: negative_nao_northern_europe
    from: nao
    when: negative
    to: northern_europe_winter
    effect: -1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      With the Icelandic low and Azores high both weak, the westerlies
      slacken and often stall behind a blocking high near Greenland, so
      cold air from Scandinavia and Russia spreads west and winters tend to
      be cold, calm and snowy.
    caveat: >
      Blocking highs come and go within a winter, so even a strongly
      negative season alternates cold snaps with milder spells. The cold is
      most marked in the British Isles and the North Sea countries.
    evidence_note: >
      The winter of 2009–10, the most negative on record, was the coldest in
      Britain since 1978–79; studies noted it would have been colder still
      without the warming of recent decades.
    sources: [hurrell_1995, cattiaux_2010, osborn_2011]

  - id: negative_nao_scandinavia_rain
    from: nao
    when: negative
    to: scandinavia_winter_rainfall
    effect: -1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      The storm track shifts south toward Iberia and fewer Atlantic
      depressions reach Norway and Scotland, so the mountains facing the
      ocean have a drier winter than usual.
    caveat: >
      Snowfall can still be heavy from cold easterly winds off the Baltic,
      and the sheltered east of Scandinavia does not follow the west.
    sources: [hurrell_1995, uvo_2003]

  - id: negative_nao_mediterranean
    from: nao
    when: negative
    to: mediterranean_winter_rainfall
    effect: 1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      With the Azores high weak, Atlantic depressions run south into Iberia
      and the western Mediterranean one after another, so winters tend to
      be wet, sometimes with flooding in Portugal, Spain and Morocco.
    caveat: >
      A wet winter needs the storms to actually arrive; a negative winter
      dominated by a stationary block can leave Iberia dry and cold instead.
    evidence_note: >
      The winter of 2009–10 brought the wettest season in decades to
      southern Iberia, with flooding in Andalusia and Portugal, the
      textbook negative-phase footprint.
    sources: [hurrell_1995, trigo_2004, vicente_serrano_2011]

  - id: negative_nao_eastern_north_america
    from: nao
    when: negative
    to: eastern_north_america_winter
    effect: -1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      A weak Icelandic low and a blocking high over Greenland steer Arctic
      air south into the eastern United States, and coastal storms running
      up against the cold air tend to bring heavy snow to the big eastern
      cities.
    caveat: >
      The Pacific often has more say: whether a negative winter is snowy or
      merely cold depends on the moisture that El Niño or La Niña sends
      across the continent.
    evidence_note: >
      The record snows of February 2010 in Washington, Baltimore and
      Philadelphia came in a winter that combined a strongly negative NAO
      with an El Niño; studies credit the NAO for the cold and El Niño for
      the moisture.
    sources: [hurrell_2003, seager_2010]

  - id: negative_nao_greenland
    from: nao
    when: negative
    to: greenland_winter
    effect: 1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      With the Icelandic low weak and a high sitting near Greenland, mild
      air is drawn north over the Labrador Sea and west Greenland, so
      winters there tend to be much milder than usual.
    caveat: >
      The warmth is largest over west Greenland and Baffin Bay; the east
      coast, facing the Greenland Sea, shows less of it.
    sources: [van_loon_rogers_1978, hurrell_1995]

  - id: negative_nao_middle_east
    from: nao
    when: negative
    to: middle_east_winter_rainfall
    effect: 1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: contested
    mechanism: >
      Storms that cross a wet Mediterranean tend to continue east and bring
      more rain and snow to Turkey and the headwaters of the Tigris and
      Euphrates.
    caveat: >
      The connection is weaker and less steady than in Iberia and some
      studies do not find it at all; a wet winter here can just as well come
      from a local Mediterranean low.
    sources: [cullen_demenocal_2000, turkes_erlat_2003]

# ================================================================== SOURCES
  # ================================================================ DRIVER TO DRIVER (M10)
  # These links push another driver into a phase rather than an outcome
  # along its axis. The engine then follows that driver's own links one
  # confidence tier lower (docs/PLAN.md §4). Links that would push the
  # scenario driver itself (feedback loops) are never drawn; the driver card
  # lists them in words.
  - id: el_nino_positive_iod
    from: enso
    when: el_nino
    to: iod
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      El Niño weakens the east-west overturning of air along the equator, so
      sinking, dry air settles over Indonesia and the winds along the
      equatorial Indian Ocean turn toward the west. Those winds push warm
      surface water away from Sumatra and let cooler water rise there, which
      is the start of a positive dipole.
    caveat: >
      The dipole has its own dynamics and can grow without El Niño, as in
      1961, 1994 and 2019, and many El Niño years pass without one; whether
      it develops also depends on the state of the Indian Ocean in spring.
    evidence_note: >
      Strong positive dipoles fell in the El Niño years 1972, 1982, 1997,
      2006 and 2015, and statistical studies find that El Niño accounts for
      a large share of dipole variability. How much of the rest is
      independent is still argued; the 2019 event, with no El Niño, is the
      standard counter-example.
    sources: [annamalai_2003, stuecker_2017, yamagata_2004, saji_1999]

  - id: la_nina_negative_iod
    from: enso
    when: la_nina
    to: iod
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      La Niña strengthens the rising air over Indonesia and turns the winds
      along the equatorial Indian Ocean toward the east, which piles warm
      water up against Sumatra and tends to tip the Indian Ocean into a
      negative dipole.
    caveat: >
      Negative dipoles are rarer and weaker than positive ones, and the
      pairing with La Niña is looser than the El Niño pairing; a La Niña
      year can pass with a neutral or even a positive dipole.
    evidence_note: >
      Negative dipoles fell in the La Niña years 1964, 1974, 1975, 1989,
      1998 and 2010, but the relationship is not a mirror image of the El
      Niño one: the pathway between the two oceans is asymmetric and the
      negative side of it is less consistent.
    sources: [stuecker_2017, cai_2012, yamagata_2004]

  - id: negative_iod_el_nino_next_year
    from: iod
    when: negative
    to: enso
    effect: 1
    lag_months: [11, 14]
    season: []
    confidence: contested
    mechanism: >
      A negative dipole strengthens the rain over the eastern Indian Ocean
      and Indonesia in autumn; when it collapses in winter the winds over
      the western Pacific swing to westerly, which can start the warming
      that grows into an El Niño by the following year.
    caveat: >
      The Pacific has its own two-to-seven-year rhythm, and several studies
      find the Indian Ocean adds little once that rhythm is allowed for; a
      negative dipole in autumn is at most one of several nudges toward an
      El Niño a year later.
    evidence_note: >
      The link was proposed from the 1981-2009 record, where a negative
      dipole preceded most El Niño onsets by about fourteen months, and
      argued to hold across earlier decades. Others find the same
      statistics can be explained by the Pacific's own cycle, with the
      dipole tagging along rather than leading.
    sources: [izumo_2010, izumo_2014, stuecker_2017]

  - id: positive_iod_la_nina_next_year
    from: iod
    when: positive
    to: enso
    effect: -1
    lag_months: [11, 14]
    season: []
    confidence: contested
    mechanism: >
      A positive dipole weakens the rain over Indonesia in autumn; when it
      collapses in winter the winds over the western Pacific swing to
      easterly, which can start the cooling that grows into a La Niña by
      the following year.
    caveat: >
      Positive dipoles usually come with an El Niño, and an El Niño is often
      followed by a La Niña anyway, so it is hard to tell how much the
      dipole itself contributes; the Pacific's own cycle may explain most
      of it.
    evidence_note: >
      Reported in the same studies as the negative-dipole link and less
      robust than it, because the positive dipole rarely occurs on its own.
    sources: [izumo_2010, izumo_2014]

  - id: el_nino_negative_nao
    from: enso
    when: el_nino
    to: nao
    effect: -1
    lag_months: [6, 9]
    season: [1, 2, 3]
    confidence: probable
    mechanism: >
      In an El Niño winter the storm track over the North Pacific shifts and
      strengthens, and planetary-scale waves carry that disturbance up into
      the stratosphere and across to the Atlantic, where late in winter it
      tends to weaken the Icelandic low and the Azores high: a negative NAO.
    caveat: >
      The signal is modest, appears mostly in late winter, and is easily
      hidden by the Atlantic's own week-to-week swings; the strongest El
      Niños of 1982-83 and 1997-98 did not produce it, and the relationship
      has come and gone over the twentieth century.
    evidence_note: >
      Reviews find a late-winter tendency toward a negative NAO in moderate
      El Niño winters, with the stratosphere as the likely route; model
      experiments reproduce it. Very strong events seem to behave
      differently, and some periods show no signal at all.
    sources: [bronnimann_2007, ineson_scaife_2009, toniazzo_scaife_2006, domeisen_2019]

  - id: la_nina_positive_nao
    from: enso
    when: la_nina
    to: nao
    effect: 1
    lag_months: [6, 9]
    season: [1, 2, 3]
    confidence: contested
    mechanism: >
      In a La Niña winter the North Pacific storm track weakens and shifts,
      and the disturbance that reaches the Atlantic tends to strengthen the
      westerlies there rather than weaken them, leaning the winter toward a
      positive NAO.
    caveat: >
      The La Niña signal over the Atlantic is weaker and less consistent
      than the El Niño one, and different studies find it in different
      months or not at all; a La Niña winter can easily be a negative NAO
      winter, as 2010-11 was.
    evidence_note: >
      One study of the twentieth century found the La Niña signal over the
      North Atlantic clearer than the El Niño one; later reviews find the
      opposite. Shown as contested because the literature does not agree.
    sources: [pozo_vazquez_2001, bronnimann_2007]

  # ================================================ EL NIÑO, added 2026-09-07
  - id: el_nino_canadian_prairies
    from: enso
    when: el_nino
    to: canadian_prairies_winter
    effect: 1
    lag_months: [5, 8]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      El Niño strengthens and stretches the Pacific jet stream so that it
      crosses North America further north and stronger than usual. Mild
      Pacific air flows across the Prairies and the Arctic air that normally
      pools there is held back.
    caveat: >
      A single Arctic outbreak can still make headlines in an El Niño
      winter; the tendency is for the season as a whole to average milder,
      not for cold snaps to vanish.
    evidence_note: >
      Shabbar and Khandekar found the winter warming over western and central
      Canada in almost every El Niño since 1900, and it is among the
      strongest ENSO temperature signals outside the tropics.
      The Pacific Decadal Oscillation sets how reliably this shows up: when
      the PDO is in its negative (cool) phase, El Niño's winter pattern over
      North America comes through weakly and less consistently than when the
      PDO is positive, so the link is shown one tier lower when a negative
      PDO is chosen alongside El Niño.
    sources: [shabbar_khandekar_1996, halpert_ropelewski_1992, noaa_cpc_north_america]
    weakened_by:
      - driver: pdo
        phase: negative
        sources: [gershunov_barnett_1998, mccabe_dettinger_1999, yu_zwiers_2007]

  - id: el_nino_hawaii
    from: enso
    when: el_nino
    to: hawaii_winter_rainfall
    effect: -1
    lag_months: [5, 8]
    season: [11, 12, 1, 2, 3, 4]
    confidence: probable
    mechanism: >
      Rising air over the warm central Pacific to the south of Hawaii is
      balanced by sinking air over the islands, which suppresses showers,
      while the storms of the north Pacific tend to pass north of them.
    caveat: >
      Not every El Niño winter is dry, and rainfall on the islands varies
      enormously from one valley to the next, so a wet windward slope can
      sit beside a parched leeward one.
    evidence_note: >
      Chu found dry winters following most El Niño onsets since the 1950s,
      with the driest conditions in the second winter of a long event.
    sources: [chu_1995, chu_chen_2005]

  - id: el_nino_northern_amazon
    from: enso
    when: el_nino
    to: northern_amazon_rainfall
    effect: -1
    lag_months: [2, 8]
    season: [9, 10, 11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      The rising branch of the tropical circulation moves out into the
      Pacific, and the compensating sinking air settles over the northern
      Amazon and the Caribbean coast of South America, cutting off the deep
      clouds that bring the rain.
    caveat: >
      The southern Amazon often escapes or even turns wetter, and the size
      of the drought also depends on the Atlantic, which decides how far
      north the rain belt sits.
    evidence_note: >
      The Ropelewski and Halpert maps show northern South America as one of
      the most consistent dry regions in El Niño; the 1997–98 and 2015–16
      events brought record low river levels and widespread forest fires in
      Roraima and the northeastern Amazon.
    sources: [ropelewski_halpert_1987, poveda_mesa_1997, jimenez_munoz_2016]

  - id: el_nino_central_america
    from: enso
    when: el_nino
    to: central_america_rainfall
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      A warm eastern Pacific strengthens the trade winds and the sinking air
      over the Caribbean and Central America, and the mid-summer break in
      the rains lengthens, so the rainy season delivers less than usual,
      above all on the Pacific side.
    caveat: >
      The Caribbean coast, fed by moist trade winds, often sees little
      change or even more rain, and a warm tropical Atlantic can cancel the
      Pacific's drying.
    evidence_note: >
      The dry-season signal is strongest in the late rainy season
      (August–October); Giannini and colleagues found the Caribbean turns
      wetter in the early rainy season of the following year, which is not
      shown here.
    sources: [magana_2003, enfield_alfaro_1999, giannini_2000]

  - id: el_nino_us_southwest
    from: enso
    when: el_nino
    to: us_southwest_winter
    effect: 1
    lag_months: [5, 8]
    season: [11, 12, 1, 2, 3, 4]
    confidence: established
    mechanism: >
      El Niño strengthens the subtropical jet stream across northern Mexico
      and the southern United States, steering a steady supply of Pacific
      storms across the desert Southwest that would otherwise pass further
      north.
    caveat: >
      The tendency is strongest in strong events; weak and central-Pacific
      El Niños have brought ordinary or even dry winters to Arizona and New
      Mexico.
    evidence_note: >
      The wet Southwest winter is clearest in strong eastern-Pacific El
      Niños. Studies disagree about the central-Pacific kind: forecasters
      have noted ordinary or dry winters in Arizona and New Mexico in weak
      and central-Pacific events, while Yu and Zou (2013) find southern
      Arizona and California the one region that a central-Pacific El Niño
      makes wetter, so the link is drawn for both kinds. The Pacific
      Decadal Oscillation sets how reliably this shows up: when the PDO is
      in its negative (cool) phase, El Niño's winter pattern over North
      America comes through weakly and less consistently than when the PDO
      is positive, so the link is shown one tier lower when a negative PDO
      is chosen alongside El Niño.
    sources: [ropelewski_halpert_1986, redmond_koch_1991, magana_2003, yu_zou_2013]
    weakened_by:
      - driver: pdo
        phase: negative
        sources: [gershunov_barnett_1998, mccabe_dettinger_1999, yu_zwiers_2007]

  - id: el_nino_south_pacific_cyclones
    from: enso
    when: el_nino
    to: south_pacific_cyclones
    effect: 1
    lag_months: [5, 9]
    season: [11, 12, 1, 2, 3, 4]
    confidence: established
    mechanism: >
      The band of warm water and rising air where South Pacific cyclones are
      born shifts east and toward the equator in El Niño, so storms tend to
      form near Fiji, Samoa and the Cook Islands, and further east, rather
      than in the Coral Sea.
    caveat: >
      It is where cyclones form that changes most reliably; the total count
      for the whole South Pacific rises only a little, and any one island
      can still be missed in a busy season.
    sources: [basher_zheng_1995, kuleshov_2008]

  - id: el_nino_north_australia_cyclones
    from: enso
    when: el_nino
    to: north_australia_cyclones
    effect: -1
    lag_months: [5, 9]
    season: [11, 12, 1, 2, 3, 4]
    confidence: established
    mechanism: >
      In El Niño the warm water and rising air move away from northern
      Australia toward the central Pacific, taking the conditions cyclones
      need with them, so fewer form in the Australian region and the first
      one tends to arrive later.
    caveat: >
      Fewer does not mean none: Cyclone Tracy, the most destructive in
      Australia's history, struck Darwin during the El Niño summer of
      1974–75, so a quiet season can still contain a bad storm.
    evidence_note: >
      Nicholls showed in the 1970s and 1980s that the coming season's
      cyclone count could be foretold from the Southern Oscillation, one of
      the first seasonal forecasts of its kind.
    sources: [nicholls_1984, kuleshov_2008, bom_enso_australia]

  - id: el_nino_west_pacific_typhoons
    from: enso
    when: el_nino
    to: west_pacific_typhoons
    effect: 1
    lag_months: [0, 4]
    season: [7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      Warm water and rising air spread east along the equator, so typhoons
      tend to form further southeast in the open Pacific. That gives them a
      longer track over warm water before they meet land or cold air, and
      more of them reach the highest intensities.
    caveat: >
      The number of typhoons in a season hardly changes with ENSO, only where
      they form and how long they live, and the Philippines and Japan can
      still be hit hard in any year.
    evidence_note: >
      Wang and Chan and Camargo and Sobel both find more long-lived, intense
      storms in El Niño years; the 2015 season, with an unusually large
      number of very intense typhoons, fits the pattern. This is the
      classic kind's pattern: in a central-Pacific El Niño typhoons form
      further west and north instead (Kim, Webster and Curry 2011), so that
      kind has a link of its own.
    sources: [wang_chan_2002, camargo_sobel_2005, chan_1985, kim_webster_curry_2011]
    except: [el_nino_central]

  - id: el_nino_south_china
    from: enso
    when: el_nino
    to: south_china_rainfall
    effect: 1
    lag_months: [4, 8]
    season: [11, 12, 1, 2, 3, 4, 5]
    confidence: established
    mechanism: >
      Cool water and sinking air over the western Pacific in El Niño set up a
      persistent high-pressure area over the sea east of the Philippines.
      Its southwesterly winds pump warm, moist air onto the coast of southern
      China through the winter and spring.
    caveat: >
      The wet signal fades if the event ends early, and the following summer
      is far less predictable: the great Yangtze flood of 1998 followed an El
      Niño but many other post-El Niño summers were unremarkable.
    sources: [wang_2000, zhang_1996, zhang_1999]

  - id: el_nino_ethiopia
    from: enso
    when: el_nino
    to: ethiopia_summer_rains
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: probable
    mechanism: >
      The Kiremt rains are part of the same summer rain belt as the Indian
      monsoon. El Niño weakens the rising air over that whole belt and
      shifts the tropical easterly jet that feeds moisture into the
      highlands, so the rains come late and fall short.
    caveat: >
      Roughly a third of El Niño summers have brought near-normal Kiremt
      rain, and the western highlands are affected less than the northeast
      and the Rift Valley.
    evidence_note: >
      Korecha and Barnston found the state of the Pacific to be the best
      single predictor of Kiremt rainfall; the failures of 1984, 1987 and
      2015 all came with El Niño.
    sources: [segele_lamb_2005, korecha_barnston_2007, gissila_2004]

  - id: el_nino_new_zealand
    from: enso
    when: el_nino
    to: new_zealand_summer
    effect: -1
    lag_months: [5, 8]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      El Niño strengthens the westerly and southwesterly winds over New
      Zealand in summer. They bring cooler air from the Southern Ocean, more
      rain to the west coast and drier weather to the north and east.
    caveat: >
      The temperature change is small, a fraction of a degree on average,
      and the rainfall signal reverses between the west and east coasts, so
      no single word describes a New Zealand El Niño summer.
    sources: [gordon_1986, mullan_1995]

  - id: el_nino_micronesia
    from: enso
    when: el_nino
    to: micronesia_dry_season
    effect: -1
    lag_months: [7, 11]
    season: [1, 2, 3, 4, 5]
    confidence: probable
    mechanism: >
      As an El Niño peaks and fades, the rain belt that had swung east
      toward the central Pacific leaves the western Pacific under sinking
      air and cooler-than-usual water, and the dry season in Micronesia turns
      severe and long.
    caveat: >
      The drought follows only strong events reliably; after a weak El Niño
      the dry season may be ordinary, and the islands nearest the equator
      are hit harder than the northern Marianas.
    evidence_note: >
      Guam, Palau and the Marshall Islands declared water emergencies in the
      early months of 1983, 1998 and 2016, each following a strong El Niño;
      this delayed signal is used for drought warnings across the region.
    sources: [he_barnston_1996, kruk_2015]

  # ================================================ LA NIÑA, added 2026-09-07
  - id: la_nina_canadian_prairies
    from: enso
    when: la_nina
    to: canadian_prairies_winter
    effect: -1
    lag_months: [5, 8]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      La Niña weakens the Pacific jet and favours a ridge of high pressure
      over the eastern Pacific, downstream of which cold Arctic air is drawn
      south across the Prairies and the northern Plains more often.
    caveat: >
      The cold signal in La Niña is weaker and less consistent than the warm
      signal in El Niño, and some La Niña winters on the Prairies have been
      close to normal.
    evidence_note: >
      The cold Prairie winter is the weaker mirror of El Niño's mild one,
      found in a majority of La Niña years but not all. The Pacific Decadal
      Oscillation sets how reliably this shows up: when the PDO is in its
      positive (warm) phase, La Niña's winter pattern over North America
      comes through weakly and less consistently than when the PDO is
      negative, so the link is shown one tier lower when a positive PDO is
      chosen alongside La Niña.
    sources: [shabbar_khandekar_1996, halpert_ropelewski_1992, noaa_cpc_north_america]
    weakened_by:
      - driver: pdo
        phase: positive
        sources: [gershunov_barnett_1998, mccabe_dettinger_1999, yu_zwiers_2007]

  - id: la_nina_hawaii
    from: enso
    when: la_nina
    to: hawaii_winter_rainfall
    effect: 1
    lag_months: [5, 8]
    season: [11, 12, 1, 2, 3, 4]
    confidence: probable
    mechanism: >
      With the central Pacific cool, the sinking air that dries Hawaii in El
      Niño is absent, and winter fronts and cut-off lows tend to reach the
      islands more often.
    caveat: >
      The wet tendency in La Niña is weaker than the dry tendency in El
      Niño, and the islands' rain depends heavily on a few large storms
      whose timing no seasonal pattern controls.
    sources: [chu_1995, chu_chen_2005]

  - id: la_nina_northern_amazon
    from: enso
    when: la_nina
    to: northern_amazon_rainfall
    effect: 1
    lag_months: [2, 8]
    season: [9, 10, 11, 12, 1, 2, 3]
    confidence: probable
    mechanism: >
      Rising air concentrates over the warm western Pacific and South
      America, and the northern Amazon, Colombia and Venezuela tend to sit
      under more active rain clouds than usual.
    caveat: >
      The wet response is less regular than the El Niño drought, and much of
      the region's flooding depends on the Atlantic and on the strength of
      the local rainy season.
    evidence_note: >
      Colombia's floods of 2010–11, during a strong La Niña, were the
      country's costliest weather disaster and fit the pattern.
    sources: [poveda_mesa_1997, marengo_1992]

  - id: la_nina_central_america
    from: enso
    when: la_nina
    to: central_america_rainfall
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      A cool eastern Pacific weakens the sinking air over the Caribbean and
      Central America and shortens the mid-summer break in the rains, so the
      rainy season tends to deliver more, and Atlantic hurricanes, which La
      Niña also favours, add to it.
    caveat: >
      The extra rain can be modest, and whether it turns into floods depends
      on hurricane tracks that no seasonal tendency predicts.
    sources: [enfield_alfaro_1999, giannini_2000, magana_2003]

  - id: la_nina_us_southwest
    from: enso
    when: la_nina
    to: us_southwest_winter
    effect: -1
    lag_months: [5, 8]
    season: [11, 12, 1, 2, 3, 4]
    confidence: established
    mechanism: >
      La Niña shifts the storm track north into the Pacific Northwest and
      weakens the subtropical jet, so Pacific storms rarely reach the
      Southwest and northern Mexico and the winter tends to be dry.
    caveat: >
      Dry winters have many origins, and a single slow-moving storm can
      rescue a La Niña season; the persistent Southwest drought of the early
      2000s spanned La Niña and neutral years alike.
    evidence_note: >
      The dry Southwest winter is among the more reliable La Niña signals
      and underlies much of the region's drought risk. The Pacific Decadal
      Oscillation sets how reliably this shows up: when the PDO is in its
      positive (warm) phase, La Niña's winter pattern over North America
      comes through weakly and less consistently than when the PDO is
      negative, so the link is shown one tier lower when a positive PDO is
      chosen alongside La Niña.
    sources: [ropelewski_halpert_1989, redmond_koch_1991]
    weakened_by:
      - driver: pdo
        phase: positive
        sources: [gershunov_barnett_1998, mccabe_dettinger_1999, yu_zwiers_2007]

  - id: la_nina_south_pacific_cyclones
    from: enso
    when: la_nina
    to: south_pacific_cyclones
    effect: -1
    lag_months: [5, 9]
    season: [11, 12, 1, 2, 3, 4]
    confidence: probable
    mechanism: >
      In La Niña the warm water and rising air retreat west toward the Coral
      Sea, so cyclones tend to form near Australia and Vanuatu and seldom
      reach the islands east of Fiji.
    caveat: >
      Cyclones can still develop near Fiji and Tonga in La Niña years, and
      the eastern islands' counts are small enough that one storm changes
      the season's story.
    sources: [basher_zheng_1995, kuleshov_2008]

  - id: la_nina_north_australia_cyclones
    from: enso
    when: la_nina
    to: north_australia_cyclones
    effect: 1
    lag_months: [5, 9]
    season: [11, 12, 1, 2, 3, 4]
    confidence: probable
    mechanism: >
      Warm water and the rising air of the Pacific rain belt sit close to
      northern Australia in La Niña, so more cyclones form in the region and
      the first one tends to arrive earlier in the season.
    caveat: >
      Cyclone numbers in the Australian region have fallen over recent
      decades for reasons that are still debated, so a La Niña season today
      may only match what an average season brought fifty years ago.
    sources: [nicholls_1984, kuleshov_2008, bom_enso_australia]

  - id: la_nina_west_pacific_typhoons
    from: enso
    when: la_nina
    to: west_pacific_typhoons
    effect: -1
    lag_months: [0, 4]
    season: [7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      Typhoons in La Niña tend to form further northwest, close to the
      Philippines and the South China Sea, and so have less time over warm
      water to strengthen before reaching land.
    caveat: >
      Forming closer to Asia can mean more landfalls even though storms are
      weaker on average, so a quieter season by this measure is not
      necessarily a safer one for the coast.
    sources: [wang_chan_2002, camargo_sobel_2005]

  - id: la_nina_south_china
    from: enso
    when: la_nina
    to: south_china_rainfall
    effect: -1
    lag_months: [4, 8]
    season: [11, 12, 1, 2, 3, 4, 5]
    confidence: probable
    mechanism: >
      A warm western Pacific in La Niña favours low pressure east of the
      Philippines, so the moist southwesterly feed onto southern China is
      replaced by dry northerly winter monsoon air.
    caveat: >
      The dry La Niña signal is weaker and less regular than the wet El Niño
      one, and cold northerly outbreaks can bring snow and freezing rain to
      the south, as in January 2008.
    sources: [wang_2000, zhang_1999]

  - id: la_nina_ethiopia
    from: enso
    when: la_nina
    to: ethiopia_summer_rains
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: probable
    mechanism: >
      A cool Pacific strengthens the rising air over Africa and South Asia
      and the tropical easterly jet that carries moisture to the Ethiopian
      highlands, so the Kiremt rains tend to be full.
    caveat: >
      Wetter summers bring their own harm, with floods along the Awash and
      in the lowlands, and the signal is weaker than the El Niño drought.
    sources: [korecha_barnston_2007, segele_lamb_2005]

  - id: la_nina_new_zealand
    from: enso
    when: la_nina
    to: new_zealand_summer
    effect: 1
    lag_months: [5, 8]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      La Niña brings more northeasterly winds over New Zealand in summer,
      carrying warm, humid air from the subtropics, so summers tend to be
      warmer, with more rain in the north and east.
    caveat: >
      Warm summers in New Zealand also come from warm seas around the
      country and from the Southern Annular Mode, so a La Niña is neither
      needed nor enough for one.
    evidence_note: >
      The record-warm summer of 2017–18 came with a weak La Niña and
      unusually warm seas around the country; both are usually credited with
      the record.
    sources: [gordon_1986, mullan_1995]

  # ============================================ POSITIVE NAO, added 2026-09-07
  - id: positive_nao_winter_storms
    from: nao
    when: positive
    to: nw_europe_winter_storms
    effect: 1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      A positive North Atlantic Oscillation means a strong pressure contrast
      between Iceland and the Azores. That contrast drives a fast jet stream
      aimed at the British Isles and the North Sea, and storm after storm
      rides along it.
    caveat: >
      A positive winter has more and stronger storms on average, but the
      most damaging single storm of a decade can still fall in an ordinary
      winter; the count changes, not the possibility.
    sources: [hurrell_1995, pinto_2009]

  - id: positive_nao_alpine_snow
    from: nao
    when: positive
    to: alpine_snow
    effect: -1
    lag_months: [0, 1]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      The strong westerlies of a positive winter carry mild Atlantic air over
      the Alps and leave high pressure sitting over them, so precipitation
      falls as rain rather than snow at low and middle altitudes and what
      snow there is melts sooner.
    caveat: >
      High-altitude resorts often do well in a positive winter, since the
      storms still bring moisture, and a single cold spell in a mild winter
      can lay down a season's worth of snow in the valleys.
    evidence_note: >
      Beniston tied the run of snow-poor Alpine winters in the late 1980s and
      1990s to the strongly positive North Atlantic Oscillation of those
      years; later work finds the link clear below about 1,500 metres and
      weaker above.
    sources: [beniston_1997, scherrer_2004]

  - id: positive_nao_western_russia
    from: nao
    when: positive
    to: western_russia_winter
    effect: 1
    lag_months: [0, 1]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      The strong westerlies of a positive winter carry mild, moist Atlantic
      air far inland across Scandinavia and European Russia toward the Urals
      and western Siberia, holding off the Siberian cold.
    caveat: >
      The mild tendency fades with distance east; in central Siberia and
      beyond other patterns matter more, and even a positive winter can
      contain a deep cold spell when the westerlies pause.
    sources: [hurrell_1995, hurrell_1996, thompson_wallace_1998]

  # ============================================ NEGATIVE NAO, added 2026-09-07
  - id: negative_nao_winter_storms
    from: nao
    when: negative
    to: nw_europe_winter_storms
    effect: -1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      In a negative winter the pressure contrast across the Atlantic
      weakens, the jet stream slows and wanders south, and northwest Europe
      often sits under a blocking high with calm, cold weather while the
      storms go to Iberia and the Mediterranean.
    caveat: >
      A quiet stormy season is not a calm winter: negative phases bring
      their own hazards, with cold spells, snow and freezing fog in place of
      wind.
    sources: [hurrell_1995, pinto_2009]

  - id: negative_nao_alpine_snow
    from: nao
    when: negative
    to: alpine_snow
    effect: 1
    lag_months: [0, 1]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      A negative winter lets cold continental air settle over the Alps and
      sends storms along a southern track that brings heavy snow to the
      southern and western Alps in particular, so snow tends to be deep and
      to last.
    caveat: >
      If the negative phase brings dry, blocked weather rather than southern
      storms, the winter can be cold but snow-poor, so the sign is less
      certain than the temperature signal.
    sources: [beniston_1997, scherrer_2004]

  - id: negative_nao_western_russia
    from: nao
    when: negative
    to: western_russia_winter
    effect: -1
    lag_months: [0, 1]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      When the westerlies falter in a negative winter the Siberian high can
      extend west, and cold continental air spreads over European Russia
      instead of being pushed back by mild air from the Atlantic.
    caveat: >
      Russia's coldest winters often owe as much to a blocking high over the
      Urals, which the North Atlantic Oscillation does not control, so a
      negative phase raises the odds of cold without deciding it.
    evidence_note: >
      The winter of 2009–10, a record negative phase, was one of the coldest
