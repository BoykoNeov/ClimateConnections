# Links: the causal edges. Schema: docs/DATA_FORMAT.md.
#
# Conventions:
#   effect      +1 / -1 on the target node's axis (see its `labels`)
#   lag_months  [min, max] months after the driver phase begins (month 0 = onset,
#               taken as the boreal early summer when an event starts to develop)
#   season      calendar months in which the effect is felt; [] = all year
#   confidence  established | probable | contested (meaning in docs/PLAN.md §3.3)
#   mechanism   plain-language "why"
#   caveat      plain-language "why it might not happen"
#   evidence_note  optional: where studies disagree, how often it shows up
#
# Every link needs at least one source key from the `sources` list below.

links:
  # ================================================================ EL NIÑO
  - id: el_nino_indian_monsoon
    from: enso
    when: el_nino
    to: indian_summer_monsoon
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: established
    mechanism: >
      El Niño shifts the rising branch of the tropical Pacific circulation
      eastward. The compensating sinking air settles over South Asia and
      weakens the moist inflow that drives the monsoon.
    caveat: >
      Roughly one El Niño monsoon in three turns out near normal, and the
      1997 event, the strongest of the century, brought an ordinary monsoon.
    evidence_note: >
      The relationship weakened noticeably from around 1980 to the early
      2000s and its strength depends on where in the Pacific the warming is
      centred; central-Pacific events tend to hurt the monsoon more than
      eastern-Pacific ones.
    sources: [rasmusson_carpenter_1983, kumar_1999]

  - id: el_nino_indonesia
    from: enso
    when: el_nino
    to: indonesia_rainfall
    effect: -1
    lag_months: [0, 2]
    season: [6, 7, 8, 9, 10, 11, 12]
    confidence: established
    mechanism: >
      The heaviest tropical rain normally sits over Indonesia. In El Niño it
      migrates east into the central Pacific, leaving the islands under
      sinking, dry air for months and extending the dry season.
    caveat: >
      Western Indonesia (Sumatra, Java) is affected less consistently than
      the east, and a wet Indian Ocean can offset part of the drying.
    evidence_note: >
      The 1982, 1997 and 2015 El Niños all coincided with severe Indonesian
      fire seasons; the link to fire depends on how much peatland has been
      drained, which has grown over time.
    sources: [ropelewski_halpert_1987, field_2009]

  - id: el_nino_east_australia
    from: enso
    when: el_nino
    to: east_australia_rainfall
    effect: -1
    lag_months: [0, 2]
    season: [6, 7, 8, 9, 10, 11, 12]
    confidence: established
    mechanism: >
      With the Pacific rain belt displaced eastward, moist tropical air
      reaches eastern Australia less often, and winter–spring rainfall falls
      below average across much of the east.
    caveat: >
      Some El Niño years have brought near-normal rain to Australia, and the
      Indian Ocean Dipole often matters as much for the southeast.
    evidence_note: >
      The Bureau of Meteorology notes that El Niño reliably lowers the odds
      of a wet winter–spring but is not a guarantee of drought.
    sources: [bom_enso_australia, ropelewski_halpert_1987]

  - id: el_nino_peru_coast
    from: enso
    when: el_nino
    to: peru_coast_rainfall
    effect: 1
    lag_months: [4, 8]
    season: [12, 1, 2, 3, 4]
    confidence: established
    mechanism: >
      Warm water spreads along the normally cold Peruvian coast during the
      mature phase of El Niño, heating the air above it enough to fuel
      thunderstorms over the coastal desert.
    caveat: >
      The heaviest floods come only with strong events that warm the far
      eastern Pacific; weaker or central-Pacific events may bring little rain.
    sources: [ropelewski_halpert_1987, lagos_2008]

  - id: el_nino_peru_fishery
    from: enso
    when: el_nino
    to: peru_fishery
    effect: -1
    lag_months: [3, 8]
    season: []
    confidence: established
    mechanism: >
      A thick layer of warm water arrives along the coast and stops cold,
      nutrient-rich water from reaching the surface. Plankton growth
      collapses and the anchoveta either starve, migrate or fail to spawn.
    caveat: >
      Overfishing can amplify or mask the effect, and the stock has recovered
      at different speeds after different events.
    sources: [barber_chavez_1983]

  - id: el_nino_us_gulf_coast
    from: enso
    when: el_nino
    to: us_gulf_coast_winter
    effect: 1
    lag_months: [4, 7]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      El Niño strengthens the subtropical jet stream across the southern
      United States in winter, steering more storms along the Gulf Coast and
      into Florida.
    caveat: >
      The signal is clearest in strong events; moderate ones can pass with
      an unremarkable winter.
    sources: [ropelewski_halpert_1986, noaa_cpc_north_america]

  - id: el_nino_california
    from: enso
    when: el_nino
    to: california_winter
    effect: 1
    lag_months: [5, 8]
    season: [12, 1, 2, 3]
    confidence: contested
    mechanism: >
      The same southward-shifted jet stream that wets the Gulf Coast can
      bring extra Pacific storms into southern California.
    caveat: >
      Many El Niño winters have been dry in California, including the strong
      2015–16 event, and northern California shows little consistent signal.
    evidence_note: >
      Only strong, eastern-Pacific El Niños show a clear wet signal, mostly
      in southern California and mostly in January–March. Averaged over all
      events the effect is small.
    sources: [jong_2016]

  - id: el_nino_pacific_northwest
    from: enso
    when: el_nino
    to: pacific_northwest_winter
    effect: 1
    lag_months: [5, 8]
    season: [12, 1, 2]
    confidence: established
    mechanism: >
      A stronger ridge of high pressure over western Canada in El Niño
      winters keeps storms south and lets mild Pacific air settle over the
      Northwest, reducing mountain snowpack.
    caveat: >
      Individual cold outbreaks still occur; the tendency is a milder average,
      not an absence of winter.
    sources: [halpert_ropelewski_1992, noaa_cpc_north_america]

  - id: el_nino_atlantic_hurricanes
    from: enso
    when: el_nino
    to: atlantic_hurricanes
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      El Niño strengthens westerly winds high over the tropical Atlantic.
      That wind shear tilts and tears apart developing storms before they
      can organise into hurricanes.
    caveat: >
      A very warm Atlantic can partly compensate, and a single landfalling
      storm can still make a "quiet" season destructive.
    evidence_note: >
      One of the most robust ENSO effects known; used operationally in
      seasonal hurricane outlooks since the 1980s.
    sources: [gray_1984, bell_2014]

  - id: el_nino_east_pacific_hurricanes
    from: enso
    when: el_nino
    to: east_pacific_hurricanes
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      Warmer water and weaker high-altitude wind shear over the eastern
      Pacific give storms off Mexico more fuel and a calmer environment to
      grow in.
    caveat: >
      The increase shows up more in storm strength and westward reach than
      in the raw count of storms.
    sources: [bell_2014]

  - id: el_nino_east_africa_short_rains
    from: enso
    when: el_nino
    to: east_africa_short_rains
    effect: 1
    lag_months: [3, 6]
    season: [10, 11, 12]
    confidence: established
    mechanism: >
      El Niño tends to warm the western Indian Ocean and weaken the winds
      that normally carry moisture away from East Africa, so the
      October–December rains are heavier.
    caveat: >
      The Indian Ocean Dipole controls this season at least as strongly as
      ENSO, and the two do not always line up.
    evidence_note: >
      Much of the ENSO signal here is thought to act through the Indian
      Ocean; El Niño years without a positive Indian Ocean Dipole show a
      weaker wet signal.
    sources: [indeje_2000, nicholson_kim_1997]

  - id: el_nino_southern_africa
    from: enso
    when: el_nino
    to: southern_africa_summer
    effect: -1
    lag_months: [5, 9]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      In El Niño summers the main rain-producing cloud band over southern
      Africa is displaced northeast over the ocean, and sinking air over the
      interior suppresses rainfall.
    caveat: >
      Some El Niño summers, such as 1997–98, brought near-normal rain to
      South Africa despite a strong event.
    sources: [lindesay_1988, nicholson_kim_1997]

  - id: el_nino_sahel
    from: enso
    when: el_nino
    to: sahel_rainfall
    effect: -1
    lag_months: [0, 3]
    season: [7, 8, 9]
    confidence: probable
    mechanism: >
      Warming in the tropical Pacific tends to weaken the northward push of
      the West African monsoon, so the Sahel's short rainy season delivers
      less.
    caveat: >
      Atlantic and Indian Ocean temperatures often matter more for the
      Sahel, and the ENSO link was weak before the 1970s.
    evidence_note: >
      The ENSO–Sahel relationship strengthened after about 1970 and remains
      weaker than the Atlantic influence in most studies.
    sources: [janicot_1996, nicholson_kim_1997]

  - id: el_nino_northeast_brazil
    from: enso
    when: el_nino
    to: northeast_brazil
    effect: -1
    lag_months: [8, 11]
    season: [2, 3, 4, 5]
    confidence: established
    mechanism: >
      Sinking air over the tropical Atlantic during El Niño keeps the
      Atlantic rain belt north of its usual position in the following
      February–May, so it never reaches the Nordeste.
    caveat: >
      The temperature contrast between the north and south tropical Atlantic
      can override ENSO in either direction.
    sources: [ropelewski_halpert_1987, hastenrath_heller_1977]

  - id: el_nino_southeast_south_america
    from: enso
    when: el_nino
    to: southeast_south_america
    effect: 1
    lag_months: [3, 8]
    season: [10, 11, 12, 1]
    confidence: established
    mechanism: >
      A strengthened subtropical jet over South America in El Niño years
      stalls fronts over Uruguay and southern Brazil and feeds them tropical
      moisture, giving persistent heavy rain.
    caveat: >
      The signal is strongest in spring (October–December); by late summer
      it usually fades.
    sources: [grimm_2000, ropelewski_halpert_1987]

  - id: el_nino_central_chile
    from: enso
    when: el_nino
    to: central_chile_winter
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: probable
    mechanism: >
      Winter storms that normally pass south of Santiago track further north
      when El Niño weakens the subtropical high-pressure belt off Chile.
    caveat: >
      The effect depends on latitude and the timing of the event; some El
      Niño winters in Santiago have been ordinary.
    sources: [montecinos_aceituno_2003]

  - id: el_nino_philippines
    from: enso
    when: el_nino
    to: philippines_rainfall
    effect: -1
    lag_months: [3, 6]
    season: [10, 11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      As the Pacific rain belt shifts east and the western Pacific cools,
      the Philippines fall under drier air from late in the El Niño year
      into the following spring.
    caveat: >
      The first months of a developing El Niño (July–September) often bring
      more rain than usual, not less, before the drying sets in.
    evidence_note: >
      The sign of the effect flips within a single event: wetter in the
      developing summer, drier from October onward. The drying phase is the
      more consistent of the two.
    sources: [lyon_camargo_2009]

  - id: el_nino_central_pacific_islands
    from: enso
    when: el_nino
    to: central_pacific_islands
    effect: 1
    lag_months: [0, 3]
    season: []
    confidence: established
    mechanism: >
      The heavy tropical rain that normally sits over Indonesia moves east
      to the date line, directly over Kiribati and its neighbours.
    caveat: >
      Islands further west or east of the date line see a smaller or
      delayed effect.
    sources: [ropelewski_halpert_1987, noaa_climate_gov_enso]

  - id: el_nino_coral_bleaching
    from: enso
    when: el_nino
    to: coral_bleaching_central_pacific
    effect: 1
    lag_months: [3, 9]
    season: []
    confidence: established
    mechanism: >
      Water over the central Pacific reefs stays one to three degrees warmer
      than usual for months, long enough to break down the algae that corals
      depend on.
    caveat: >
      Reefs already stressed bleach more easily, and with the long-term
      warming trend bleaching now also occurs in some non-El Niño years.
    sources: [glynn_1984, eakin_2019]

  - id: el_nino_global_temperature
    from: enso
    when: el_nino
    to: global_mean_temperature
    effect: 1
    lag_months: [3, 6]
    season: []
    confidence: established
    mechanism: >
      Heat stored in the tropical Pacific is released into the atmosphere,
      and the global average surface temperature rises by roughly a tenth
      to two tenths of a degree for several months.
    caveat: >
      This is a temporary bump on top of the long-term warming trend and is
      easily hidden by other factors in any single month.
    sources: [trenberth_2002]

  - id: el_nino_east_asia_winter
    from: enso
    when: el_nino
    to: east_asia_winter
    effect: 1
    lag_months: [5, 8]
    season: [12, 1, 2]
    confidence: probable
    mechanism: >
      A high-pressure anomaly forms over the western North Pacific in El
      Niño winters and weakens the cold northerly winds flowing out of
      Siberia toward Japan and eastern China.
    caveat: >
      Arctic and Eurasian snow-cover patterns often dominate East Asian
      winters and can cancel the ENSO tendency.
    sources: [wang_2000]

  # ================================================================ LA NIÑA
  - id: la_nina_indian_monsoon
    from: enso
    when: la_nina
    to: indian_summer_monsoon
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: probable
    mechanism: >
      With the Pacific rain belt pushed west, rising air over the Maritime
      Continent and South Asia strengthens the monsoon circulation and
      favours above-normal rain.
    caveat: >
      The wet tendency in La Niña is weaker than the dry tendency in El Niño;
      several La Niña monsoons have been merely normal.
    evidence_note: >
      Studies consistently find the monsoon's response to be asymmetric:
      El Niño suppresses it more than La Niña enhances it.
    sources: [rasmusson_carpenter_1983, kumar_1999]

  - id: la_nina_indonesia
    from: enso
    when: la_nina
    to: indonesia_rainfall
    effect: 1
    lag_months: [0, 2]
    season: [6, 7, 8, 9, 10, 11, 12]
    confidence: established
    mechanism: >
      Stronger trade winds pile warm water and rising air over Indonesia,
      intensifying and prolonging the rains.
    caveat: >
      Flooding depends heavily on local terrain and on the monsoon timing,
      so the extra rain is not evenly spread across the islands.
    sources: [ropelewski_halpert_1989]

  - id: la_nina_east_australia
    from: enso
    when: la_nina
    to: east_australia_rainfall
    effect: 1
    lag_months: [0, 2]
    season: [6, 7, 8, 9, 10, 11, 12, 1, 2]
    confidence: established
    mechanism: >
      Warm water and rising air in the western Pacific feed moist tropical
      air into eastern Australia, raising the odds of a wet winter, spring
      and early summer.
    caveat: >
      The wettest La Niña years, such as 2010–11, also had other drivers
      lined up; a La Niña alone does not guarantee floods.
    sources: [bom_enso_australia, ropelewski_halpert_1989]

  - id: la_nina_peru_coast
    from: enso
    when: la_nina
    to: peru_coast_rainfall
    effect: -1
    lag_months: [4, 8]
    season: [12, 1, 2, 3, 4]
    confidence: probable
    mechanism: >
      Colder-than-usual coastal water in La Niña keeps the air stable and
      suppresses the rare summer rain that the northern Peruvian coast
      normally receives.
    caveat: >
      The coast is already so dry that the difference between a normal and a
      La Niña year is small in absolute terms.
    sources: [ropelewski_halpert_1989]

  - id: la_nina_peru_fishery
    from: enso
    when: la_nina
    to: peru_fishery
    effect: 1
    lag_months: [3, 8]
    season: []
    confidence: probable
    mechanism: >
      Stronger trade winds drive more cold, nutrient-rich water to the
      surface along the Peruvian coast, boosting plankton and the anchoveta
      that feed on it.
    caveat: >
      Fish stocks also respond to slower decade-scale ocean shifts and to
      fishing pressure, so a La Niña does not always translate into a bumper catch.
    sources: [barber_chavez_1983]

  - id: la_nina_us_gulf_coast
    from: enso
    when: la_nina
    to: us_gulf_coast_winter
    effect: -1
    lag_months: [4, 7]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      In La Niña winters the storm track sits further north, so the southern
      United States sees fewer winter storms and often develops drought.
    caveat: >
      Occasional strong cold fronts still bring rain; the tendency is a drier
      average across the whole winter.
    sources: [ropelewski_halpert_1986, noaa_cpc_north_america]

  - id: la_nina_california
    from: enso
    when: la_nina
    to: california_winter
    effect: -1
    lag_months: [5, 8]
    season: [12, 1, 2, 3]
    confidence: contested
    mechanism: >
      The northward-shifted storm track of a La Niña winter tends to pass
      over the Pacific Northwest and miss southern California.
    caveat: >
      La Niña winters have included some of California's wettest, such as
      2016–17; the average tendency is small.
    evidence_note: >
      Southern California shows a modest dry lean in La Niña; northern
      California shows almost none.
    sources: [jong_2016]

  - id: la_nina_pacific_northwest
    from: enso
    when: la_nina
    to: pacific_northwest_winter
    effect: -1
    lag_months: [5, 8]
    season: [12, 1, 2]
    confidence: established
    mechanism: >
      The winter storm track aims squarely at the Pacific Northwest in La
      Niña years, bringing more rain to the lowlands and more snow to the
      mountains, with cooler average temperatures.
    caveat: >
      A warm blob of ocean water offshore can override the cool tendency, as
      happened in some recent La Niña winters.
    sources: [halpert_ropelewski_1992, noaa_cpc_north_america]

  - id: la_nina_atlantic_hurricanes
    from: enso
    when: la_nina
    to: atlantic_hurricanes
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      La Niña relaxes the high-altitude westerly winds over the tropical
      Atlantic, so developing storms are not sheared apart and more of them
      grow into hurricanes.
    caveat: >
      A cool Atlantic or dusty, dry air from the Sahara can still keep a La
      Niña season quiet.
    sources: [gray_1984, bell_2014]

  - id: la_nina_east_pacific_hurricanes
    from: enso
    when: la_nina
    to: east_pacific_hurricanes
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      Cooler water and stronger wind shear off Mexico in La Niña years give
      storms less energy and a more hostile environment.
    caveat: >
      Storm counts vary a great deal from year to year for reasons unrelated
      to ENSO.
    sources: [bell_2014]

  - id: la_nina_east_africa_short_rains
    from: enso
    when: la_nina
    to: east_africa_short_rains
    effect: -1
    lag_months: [3, 6]
    season: [10, 11, 12]
    confidence: probable
    mechanism: >
      La Niña tends to cool the western Indian Ocean and strengthen the
      winds that carry moisture away from East Africa, so the short rains
      are weaker or fail.
    caveat: >
      The Indian Ocean Dipole can offset this; a La Niña with a neutral or
      positive Dipole may bring normal rain.
    evidence_note: >
      The 2010–11 La Niña coincided with one of the worst Horn of Africa
      droughts on record, but the statistical link across all La Niña years
      is weaker than for El Niño floods.
    sources: [indeje_2000, nicholson_kim_1997]

  - id: la_nina_southern_africa
    from: enso
    when: la_nina
    to: southern_africa_summer
    effect: 1
    lag_months: [5, 9]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      The main summer cloud band over southern Africa sits over the interior
      in La Niña years, bringing above-average rain and, at times, floods.
    caveat: >
      The wet response is less consistent than the El Niño dry response, and
      some La Niña summers have been ordinary.
    sources: [lindesay_1988, nicholson_kim_1997]

  - id: la_nina_sahel
    from: enso
    when: la_nina
    to: sahel_rainfall
    effect: 1
    lag_months: [0, 3]
    season: [7, 8, 9]
    confidence: contested
    mechanism: >
      A cool tropical Pacific tends to let the West African monsoon push
      further north, which would favour a wetter Sahel.
    caveat: >
      The Sahel's rainy season responds mainly to the Atlantic and Indian
      Oceans; the La Niña signal is small and inconsistent.
    evidence_note: >
      Several studies find a weak wet lean in La Niña years; others find no
      significant effect. Shown here so the contrast with the better
      supported El Niño link is visible.
    sources: [janicot_1996, nicholson_kim_1997]

  - id: la_nina_northeast_brazil
    from: enso
    when: la_nina
    to: northeast_brazil
    effect: 1
    lag_months: [8, 11]
    season: [2, 3, 4, 5]
    confidence: probable
    mechanism: >
      Rising air over the tropical Atlantic in La Niña lets the Atlantic
      rain belt reach further south into the Nordeste during its
      February–May rainy season.
    caveat: >
      The Atlantic's own north–south temperature contrast frequently decides
      the season regardless of ENSO.
    sources: [ropelewski_halpert_1989, hastenrath_heller_1977]

  - id: la_nina_southeast_south_america
    from: enso
    when: la_nina
    to: southeast_south_america
    effect: -1
    lag_months: [3, 8]
    season: [10, 11, 12, 1]
    confidence: probable
    mechanism: >
      A weaker subtropical jet over South America in La Niña years means
      fewer stalled fronts and less tropical moisture over Uruguay and
      southern Brazil.
    caveat: >
      The dry response is weaker and less consistent than the El Niño wet
      response.
    evidence_note: >
      Grimm and colleagues found the response to be asymmetric: strong and
      wet in El Niño, weaker and dry in La Niña.
    sources: [grimm_2000, ropelewski_halpert_1989]

  - id: la_nina_central_chile
    from: enso
    when: la_nina
    to: central_chile_winter
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: probable
    mechanism: >
      A stronger subtropical high off Chile in La Niña winters keeps storms
      south of Santiago.
    caveat: >
      Central Chile's long drought since 2010 spans both La Niña and El Niño
      years, so ENSO is only part of the story.
    sources: [montecinos_aceituno_2003]

  - id: la_nina_philippines
    from: enso
    when: la_nina
    to: philippines_rainfall
    effect: 1
    lag_months: [3, 6]
    season: [10, 11, 12, 1, 2, 3]
    confidence: probable
    mechanism: >
      A warm western Pacific and stronger easterly winds feed more moisture
      into the Philippines during the northern winter.
    caveat: >
      Typhoon tracks, which dominate year-to-year rainfall, are not fully
      controlled by ENSO.
    sources: [lyon_camargo_2009]

  - id: la_nina_central_pacific_islands
    from: enso
    when: la_nina
    to: central_pacific_islands
    effect: -1
    lag_months: [0, 3]
    season: []
    confidence: established
    mechanism: >
      Strong trade winds push the rain belt west of the date line, leaving
      Kiribati and its neighbours under dry, subsiding air.
    caveat: >
      Short rain events still occur; the risk is a run of dry months long
      enough to exhaust freshwater lenses.
    sources: [ropelewski_halpert_1989, noaa_climate_gov_enso]

  - id: la_nina_coral_bleaching
    from: enso
    when: la_nina
    to: coral_bleaching_central_pacific
    effect: -1
    lag_months: [3, 9]
    season: []
    confidence: probable
    mechanism: >
      Cooler central Pacific water in La Niña keeps reefs near the date line
      below their bleaching threshold.
    caveat: >
      La Niña warms the western Pacific instead, and with the long-term
      warming trend some reefs now bleach even in La Niña years.
    sources: [eakin_2019]

  - id: la_nina_global_temperature
    from: enso
    when: la_nina
    to: global_mean_temperature
    effect: -1
    lag_months: [3, 6]
    season: []
    confidence: established
    mechanism: >
      The ocean takes up heat from the atmosphere during La Niña, so the
      global average temperature runs a little below the underlying trend
      for several months.
    caveat: >
      Recent La Niña years have still been among the warmest on record,
      because the wobble is small compared with the long-term trend.
    sources: [trenberth_2002]

  - id: la_nina_east_asia_winter
    from: enso
    when: la_nina
    to: east_asia_winter
    effect: -1
    lag_months: [5, 8]
    season: [12, 1, 2]
    confidence: probable
    mechanism: >
      A low-pressure anomaly over the western North Pacific in La Niña
      winters strengthens the cold northerly flow out of Siberia toward
      Japan and eastern China.
    caveat: >
      Arctic sea-ice and Eurasian snow patterns can dominate and produce
      mild winters even in La Niña.
    sources: [wang_2000]

  # ================================================================ POSITIVE IOD
  - id: positive_iod_east_africa_short_rains
    from: iod
    when: positive
    to: east_africa_short_rains
    effect: 1
    lag_months: [3, 5]
    season: [10, 11, 12]
    confidence: established
    mechanism: >
      Warm water off East Africa and easterly winds along the equator pile
      moist, rising air against the Horn of Africa just as the short rains
      begin, so the October–December rains tend to run heavy.
    caveat: >
      The effect is concentrated near the coast and in these three months.
      Many positive events fall in El Niño years, so a wet season is not
      always the Indian Ocean's doing alone, and a weak event can pass with
      ordinary rains.
    evidence_note: >
      Several studies find the Indian Ocean, not the Pacific, is the direct
      cause of the very wet short rains, with El Niño acting mostly through
      it; the flood years 1961, 1997 and 2019 all had strong positive events.
    sources: [saji_1999, black_2003, behera_2005]

  - id: positive_iod_indonesia
    from: iod
    when: positive
    to: indonesia_rainfall
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      Cool water off Sumatra and Java suppresses the rising air that usually
      brings rain, and the winds along the equator blow the moisture away to
      the west, so the dry season deepens and runs late.
    caveat: >
      The drying is strongest in Sumatra, Java and the islands facing the
      Indian Ocean; eastern Indonesia answers more to ENSO. When a positive
      event coincides with El Niño the two add up, and it is hard to say how
      much is which.
    evidence_note: >
      Fire seasons in Sumatra and Borneo have been worst when a positive
      dipole and El Niño occur together (1997, 2015), but a strong dipole on
      its own, as in 2019, has also brought a severe fire season.
    sources: [saji_1999, pan_2018, bom_iod]

  - id: positive_iod_southeast_australia
    from: iod
    when: positive
    to: southeast_australia_rainfall
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      The cloud bands that feed rain-bearing systems over southern Australia
      draw their moisture from the ocean northwest of the continent. Cool
      water there in a positive event starves them, so winter and spring
      rain tends to fall short.
    caveat: >
      The influence stops in December when the event breaks down, so a dry
      cool season is not a dry year. Single events vary a lot, and southern
      Australia has had ordinary winters during weak positive events.
    evidence_note: >
      Long droughts in the Murray–Darling basin have coincided with runs of
      positive events with no negative ones in between, and the 2019 event,
      one of the strongest on record, preceded the Black Summer fires.
    sources: [ummenhofer_2009, cai_2011, bom_iod]

  - id: positive_iod_indian_monsoon
    from: iod
    when: positive
    to: indian_summer_monsoon
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: contested
    mechanism: >
      Warm water in the western Indian Ocean strengthens the moist flow
      toward India and the rising air over the Bay of Bengal, which tends to
      nudge the summer monsoon toward more rain.
    caveat: >
      The direct effect is modest and studies disagree on whether it exists
      at all. Positive events often coincide with El Niño, which pushes the
      other way; the result is more often a near-normal monsoon than a strong
      one.
    evidence_note: >
      The best-known finding is that a positive dipole cancels part of El
      Niño's drying, as in 1997, rather than boosting the monsoon on its own.
    sources: [ashok_2001, saji_yamagata_2003]

  - id: positive_iod_south_india_northeast_monsoon
    from: iod
    when: positive
    to: south_india_northeast_monsoon
    effect: 1
    lag_months: [3, 5]
    season: [10, 11, 12]
    confidence: probable
    mechanism: >
      The warm western and central Indian Ocean feeds extra moisture into the
      winds that bring the October–December rains to southern India and Sri
      Lanka, so the season tends to run wet.
    caveat: >
      The relationship holds in most, not all, strong events, and El Niño
      tends to push this season in the same direction, which makes it hard to
      credit the Indian Ocean alone.
    sources: [kripalani_kumar_2004, zubair_2003]

  - id: positive_iod_east_asia_summer
    from: iod
    when: positive
    to: east_asia_summer
    effect: 1
    lag_months: [0, 2]
    season: [6, 7, 8]
    confidence: contested
    mechanism: >
      Extra rain over the Bay of Bengal in a positive event sets off a wave
      in the upper atmosphere that strengthens high pressure over Japan and
      Korea, favouring hot, dry summer weather.
    caveat: >
      This rests on a handful of events, above all the record summer of 1994,
      and several summers with a positive dipole have been unremarkable. It
      is included to show where the research is still open.
    sources: [guan_yamagata_2003, saji_yamagata_2003]

  # ================================================================ NEGATIVE IOD
  - id: negative_iod_southeast_australia
    from: iod
    when: negative
    to: southeast_australia_rainfall
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      Warm water northwest of Australia in a negative event loads the cloud
      bands and cold fronts that cross the south of the continent with extra
      moisture, so winter and spring tend to run wet.
    caveat: >
      Negative events are weaker and rarer than positive ones, and the extra
      rain depends on weather systems actually arriving to use the moisture.
      The 2016 event brought a very wet winter; others have been milder.
    sources: [ummenhofer_2009, cai_2011, bom_iod]

  - id: negative_iod_east_africa_short_rains
    from: iod
    when: negative
    to: east_africa_short_rains
    effect: -1
    lag_months: [3, 5]
    season: [10, 11, 12]
    confidence: probable
    mechanism: >
      Cool water off East Africa and westerly winds along the equator carry
      moisture away from the Horn of Africa, so the short rains tend to be
      weak or late.
    caveat: >
      The drying is less reliable than the flooding of a positive event, and
      negative events often coincide with La Niña, which pushes the same way,
      so the Indian Ocean's own share is uncertain.
    sources: [behera_2005, black_2003]

  - id: negative_iod_indonesia
    from: iod
    when: negative
    to: indonesia_rainfall
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      Warm water off Sumatra and Java feeds rising air and rain over western
      Indonesia during what is normally the dry season, so the dry season
      tends to be short and wet.
    caveat: >
      Western Indonesia is rarely short of rain, so the change is easier to
      see in the data than on the ground, and eastern Indonesia answers more
      to ENSO than to the Indian Ocean.
    sources: [saji_1999, bom_iod]

  - id: negative_iod_south_india_northeast_monsoon
    from: iod
    when: negative
    to: south_india_northeast_monsoon
    effect: -1
    lag_months: [3, 5]
    season: [10, 11, 12]
    confidence: probable
    mechanism: >
      A cool western Indian Ocean feeds less moisture into the winds that
      bring the October–December rains to southern India and Sri Lanka, so
      the season tends to run dry.
    caveat: >
      There are fewer strong negative events to check this against, and La
      Niña, which often comes with them, also acts on this season.
    sources: [zubair_2003, kripalani_kumar_2004]

  # ================================================================ POSITIVE NAO
  # The NAO is a winter pattern of the atmosphere: no lag, and nothing outside
  # the cold season. Positive and negative links are both listed because the
  # sources describe the pattern as a see-saw that works in both directions.
  - id: positive_nao_northern_europe
    from: nao
    when: positive
    to: northern_europe_winter
    effect: 1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      A strong Icelandic low and Azores high drive strong westerly winds that
      carry mild, moist Atlantic air deep into Europe, so winters from
      Ireland to the Baltic tend to be mild, wet and windy.
    caveat: >
      The pattern can flip within a week, so a winter that leans positive on
      average can still hold a cold, snowy fortnight. The effect fades with
      distance from the Atlantic and is weaker in the Alps and the south.
    evidence_note: >
      Hurrell found the pattern accounts for roughly a third of the
      winter-to-winter temperature swings across northern Europe, more than
      any other single influence; the mild winters of the early 1990s were
      strongly positive years.
    sources: [hurrell_1995, hurrell_2003]

  - id: positive_nao_scandinavia_rain
    from: nao
    when: positive
    to: scandinavia_winter_rainfall
    effect: 1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      The storm track runs northeast toward Scotland and Norway, so one
      Atlantic depression after another unloads rain and snow on the
      mountains facing the ocean.
    caveat: >
      The extra precipitation is concentrated on the windward western slopes;
      the sheltered east of Norway and Sweden see much less of it and can
      even be drier.
    sources: [hurrell_1995, uvo_2003]

  - id: positive_nao_mediterranean
    from: nao
    when: positive
    to: mediterranean_winter_rainfall
    effect: -1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      With the Azores high strong and the storm track held far to the north,
      few Atlantic depressions reach Iberia and the western Mediterranean,
      so the winter rains that supply most of the year's water fall short.
    caveat: >
      Local storms in the Mediterranean itself can still bring heavy rain
      in a positive winter, and the effect weakens eastward from Portugal
      toward Italy.
    evidence_note: >
      In Portugal and western Spain the pattern explains around half of the
      winter-to-winter change in rainfall and river flow, one of the
      strongest teleconnections on this map; it is the reason a run of
      positive winters in the late 1980s and early 1990s left Iberian
      reservoirs low.
    sources: [hurrell_1995, trigo_2004]

  - id: positive_nao_eastern_north_america
    from: nao
    when: positive
    to: eastern_north_america_winter
    effect: 1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      A strong Icelandic low pulls mild southerly air up the eastern
      seaboard and keeps the Arctic air bottled up to the north, so eastern
      winters tend to be milder with less snow along the coast.
    caveat: >
      The effect is weaker than in Europe and is often overridden by the
      Pacific: ENSO and the Pacific–North American pattern have as much or
      more say over an eastern US winter.
    sources: [hurrell_2003, seager_2010]

  - id: positive_nao_greenland
    from: nao
    when: positive
    to: greenland_winter
    effect: -1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      The strong Icelandic low draws cold northerly air down its western
      flank over Greenland and the Labrador Sea, so winters there tend to be
      colder while northern Europe is mild.
    caveat: >
      Greenland's east coast and its interior respond less than the west
      coast and Labrador, and the Arctic has warmed enough in recent decades
      that a "cold" positive winter can still be milder than the past.
    evidence_note: >
      This Greenland–Europe seesaw is the oldest documented part of the
      pattern; van Loon and Rogers traced it through two centuries of
      records.
    sources: [van_loon_rogers_1978, hurrell_1995]

  - id: positive_nao_middle_east
    from: nao
    when: positive
    to: middle_east_winter_rainfall
    effect: -1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: contested
    mechanism: >
      Storms that would normally cross the Mediterranean and end over
      Turkey and the Middle East are held to the north, so winters there
      tend to be drier and the Tigris and Euphrates carry less water.
    caveat: >
      The connection is weaker and less steady than in Iberia. Some studies
      find it clearly in river flows and rainfall over Turkey; others find
      it only in some decades or not at all, and local Mediterranean storms
      can dominate a winter.
    sources: [cullen_demenocal_2000, turkes_erlat_2003]

  # ================================================================ NEGATIVE NAO
  - id: negative_nao_northern_europe
    from: nao
    when: negative
    to: northern_europe_winter
    effect: -1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      With the Icelandic low and Azores high both weak, the westerlies
      slacken and often stall behind a blocking high near Greenland, so
      cold air from Scandinavia and Russia spreads west and winters tend to
      be cold, calm and snowy.
    caveat: >
      Blocking highs come and go within a winter, so even a strongly
      negative season alternates cold snaps with milder spells. The cold is
      most marked in the British Isles and the North Sea countries.
    evidence_note: >
      The winter of 2009–10, the most negative on record, was the coldest in
      Britain since 1978–79; studies noted it would have been colder still
      without the warming of recent decades.
    sources: [hurrell_1995, cattiaux_2010, osborn_2011]

  - id: negative_nao_scandinavia_rain
    from: nao
    when: negative
    to: scandinavia_winter_rainfall
    effect: -1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      The storm track shifts south toward Iberia and fewer Atlantic
      depressions reach Norway and Scotland, so the mountains facing the
      ocean have a drier winter than usual.
    caveat: >
      Snowfall can still be heavy from cold easterly winds off the Baltic,
      and the sheltered east of Scandinavia does not follow the west.
    sources: [hurrell_1995, uvo_2003]

  - id: negative_nao_mediterranean
    from: nao
    when: negative
    to: mediterranean_winter_rainfall
    effect: 1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      With the Azores high weak, Atlantic depressions run south into Iberia
      and the western Mediterranean one after another, so winters tend to
      be wet, sometimes with flooding in Portugal, Spain and Morocco.
    caveat: >
      A wet winter needs the storms to actually arrive; a negative winter
      dominated by a stationary block can leave Iberia dry and cold instead.
    evidence_note: >
      The winter of 2009–10 brought the wettest season in decades to
      southern Iberia, with flooding in Andalusia and Portugal, the
      textbook negative-phase footprint.
    sources: [hurrell_1995, trigo_2004, vicente_serrano_2011]

  - id: negative_nao_eastern_north_america
    from: nao
    when: negative
    to: eastern_north_america_winter
    effect: -1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: probable
    mechanism: >
      A weak Icelandic low and a blocking high over Greenland steer Arctic
      air south into the eastern United States, and coastal storms running
      up against the cold air tend to bring heavy snow to the big eastern
      cities.
    caveat: >
      The Pacific often has more say: whether a negative winter is snowy or
      merely cold depends on the moisture that El Niño or La Niña sends
      across the continent.
    evidence_note: >
      The record snows of February 2010 in Washington, Baltimore and
      Philadelphia came in a winter that combined a strongly negative NAO
      with an El Niño; studies credit the NAO for the cold and El Niño for
      the moisture.
    sources: [hurrell_2003, seager_2010]

  - id: negative_nao_greenland
    from: nao
    when: negative
    to: greenland_winter
    effect: 1
    lag_months: [0, 0]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      With the Icelandic low weak and a high sitting near Greenland, mild
      air is drawn north over the Labrador Sea and west Greenland, so
      winters there tend to be much milder than usual.
    caveat: >
      The warmth is largest over west Greenland and Baffin Bay; the east
      coast, facing the Greenland Sea, shows less of it.
    sources: [van_loon_rogers_1978, hurrell_1995]

  - id: negative_nao_middle_east
    from: nao
    when: negative
    to: middle_east_winter_rainfall
    effect: 1
    lag_months: [0, 0]
    season: [11, 12, 1, 2, 3]
    confidence: contested
    mechanism: >
      Storms that cross a wet Mediterranean tend to continue east and bring
      more rain and snow to Turkey and the headwaters of the Tigris and
      Euphrates.
    caveat: >
      The connection is weaker and less steady than in Iberia and some
      studies do not find it at all; a wet winter here can just as well come
      from a local Mediterranean low.
    sources: [cullen_demenocal_2000, turkes_erlat_2003]

# ================================================================== SOURCES
  # ================================================================ DRIVER TO DRIVER (M10)
  # These links push another driver into a phase rather than an outcome
  # along its axis. The engine then follows that driver's own links one
  # confidence tier lower (docs/PLAN.md §4). Links that would push the
  # scenario driver itself (feedback loops) are never drawn; the driver card
  # lists them in words.
  - id: el_nino_positive_iod
    from: enso
    when: el_nino
    to: iod
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      El Niño weakens the east-west overturning of air along the equator, so
      sinking, dry air settles over Indonesia and the winds along the
      equatorial Indian Ocean turn toward the west. Those winds push warm
      surface water away from Sumatra and let cooler water rise there, which
      is the start of a positive dipole.
    caveat: >
      The dipole has its own dynamics and can grow without El Niño, as in
      1961, 1994 and 2019, and many El Niño years pass without one; whether
      it develops also depends on the state of the Indian Ocean in spring.
    evidence_note: >
      Strong positive dipoles fell in the El Niño years 1972, 1982, 1997,
      2006 and 2015, and statistical studies find that El Niño accounts for
      a large share of dipole variability. How much of the rest is
      independent is still argued; the 2019 event, with no El Niño, is the
      standard counter-example.
    sources: [annamalai_2003, stuecker_2017, yamagata_2004, saji_1999]

  - id: la_nina_negative_iod
    from: enso
    when: la_nina
    to: iod
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      La Niña strengthens the rising air over Indonesia and turns the winds
      along the equatorial Indian Ocean toward the east, which piles warm
      water up against Sumatra and tends to tip the Indian Ocean into a
      negative dipole.
    caveat: >
      Negative dipoles are rarer and weaker than positive ones, and the
      pairing with La Niña is looser than the El Niño pairing; a La Niña
      year can pass with a neutral or even a positive dipole.
    evidence_note: >
      Negative dipoles fell in the La Niña years 1964, 1974, 1975, 1989,
      1998 and 2010, but the relationship is not a mirror image of the El
      Niño one: the pathway between the two oceans is asymmetric and the
      negative side of it is less consistent.
    sources: [stuecker_2017, cai_2012, yamagata_2004]

  - id: negative_iod_el_nino_next_year
    from: iod
    when: negative
    to: enso
    effect: 1
    lag_months: [11, 14]
    season: []
    confidence: contested
    mechanism: >
      A negative dipole strengthens the rain over the eastern Indian Ocean
      and Indonesia in autumn; when it collapses in winter the winds over
      the western Pacific swing to westerly, which can start the warming
      that grows into an El Niño by the following year.
    caveat: >
      The Pacific has its own two-to-seven-year rhythm, and several studies
      find the Indian Ocean adds little once that rhythm is allowed for; a
      negative dipole in autumn is at most one of several nudges toward an
      El Niño a year later.
    evidence_note: >
      The link was proposed from the 1981-2009 record, where a negative
      dipole preceded most El Niño onsets by about fourteen months, and
      argued to hold across earlier decades. Others find the same
      statistics can be explained by the Pacific's own cycle, with the
      dipole tagging along rather than leading.
    sources: [izumo_2010, izumo_2014, stuecker_2017]

  - id: positive_iod_la_nina_next_year
    from: iod
    when: positive
    to: enso
    effect: -1
    lag_months: [11, 14]
    season: []
    confidence: contested
    mechanism: >
      A positive dipole weakens the rain over Indonesia in autumn; when it
      collapses in winter the winds over the western Pacific swing to
      easterly, which can start the cooling that grows into a La Niña by
      the following year.
    caveat: >
      Positive dipoles usually come with an El Niño, and an El Niño is often
      followed by a La Niña anyway, so it is hard to tell how much the
      dipole itself contributes; the Pacific's own cycle may explain most
      of it.
    evidence_note: >
      Reported in the same studies as the negative-dipole link and less
      robust than it, because the positive dipole rarely occurs on its own.
    sources: [izumo_2010, izumo_2014]

  - id: el_nino_negative_nao
    from: enso
    when: el_nino
    to: nao
    effect: -1
    lag_months: [6, 9]
    season: [1, 2, 3]
    confidence: probable
    mechanism: >
      In an El Niño winter the storm track over the North Pacific shifts and
      strengthens, and planetary-scale waves carry that disturbance up into
      the stratosphere and across to the Atlantic, where late in winter it
      tends to weaken the Icelandic low and the Azores high: a negative NAO.
    caveat: >
      The signal is modest, appears mostly in late winter, and is easily
      hidden by the Atlantic's own week-to-week swings; the strongest El
      Niños of 1982-83 and 1997-98 did not produce it, and the relationship
      has come and gone over the twentieth century.
    evidence_note: >
      Reviews find a late-winter tendency toward a negative NAO in moderate
      El Niño winters, with the stratosphere as the likely route; model
      experiments reproduce it. Very strong events seem to behave
      differently, and some periods show no signal at all.
    sources: [bronnimann_2007, ineson_scaife_2009, toniazzo_scaife_2006, domeisen_2019]

  - id: la_nina_positive_nao
    from: enso
    when: la_nina
    to: nao
    effect: 1
    lag_months: [6, 9]
    season: [1, 2, 3]
    confidence: contested
    mechanism: >
      In a La Niña winter the North Pacific storm track weakens and shifts,
      and the disturbance that reaches the Atlantic tends to strengthen the
      westerlies there rather than weaken them, leaning the winter toward a
      positive NAO.
    caveat: >
      The La Niña signal over the Atlantic is weaker and less consistent
      than the El Niño one, and different studies find it in different
      months or not at all; a La Niña winter can easily be a negative NAO
      winter, as 2010-11 was.
    evidence_note: >
      One study of the twentieth century found the La Niña signal over the
      North Atlantic clearer than the El Niño one; later reviews find the
      opposite. Shown as contested because the literature does not agree.
    sources: [pozo_vazquez_2001, bronnimann_2007]

