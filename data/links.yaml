    evidence_note: >
      During warm phases most of the United States sees less rain than
      usual, mainly in summer, including the Midwest droughts of the 1930s
      and 1950s; about half of the multidecadal swing in drought over the
      United States is tied to the Atlantic and Pacific oscillations
      together.
    sources: [enfield_2001, sutton_hodson_2005, mccabe_2004, nigam_2011]

  - id: negative_amo_great_plains
    from: amo
    when: negative
    to: us_great_plains_summer
    effect: 1
    lag_months: [0, 1]
    season: [6, 7, 8]
    confidence: probable
    mechanism: >
      With a cool North Atlantic the summer flow of moisture out of the
