    sources: [hurrell_1995, hurrell_1996]

  # ---- Southern Annular Mode (M16). The sources describe regressions and
  # composites that work in both directions, so most targets get a link per
  # phase; the seasons follow Hendon et al. (extended winter May–October,
  # extended summer November–April).
  - id: positive_sam_southwest_australia
    from: sam
    when: positive
    to: southwest_australia_winter_rainfall
    effect: -1
    lag_months: [0, 1]
    season: [5, 6, 7, 8, 9, 10]
    confidence: established
    mechanism: >
      With the westerly belt tightened toward the pole, the winter cold
      fronts that bring the southwest its rain pass to the south of the
      coast instead of crossing it.
    caveat: >
      The mode explains only part of the winter rainfall here, and it swings
      within weeks, so a winter that leans positive on average can still
      hold a few very wet fronts.
    evidence_note: >
      Daily and seasonal studies agree on the sign, with the mode explaining
      up to about fifteen percent of the week-to-week rainfall variance in
      winter, comparable with ENSO. The region's long decline in winter rain since the 1970s is
      only partly explained by the mode's trend.
    sources: [hendon_2007, meneghini_2007, bom_sam]

  - id: negative_sam_southwest_australia
    from: sam
    when: negative
    to: southwest_australia_winter_rainfall
    effect: 1
    lag_months: [0, 1]
    season: [5, 6, 7, 8, 9, 10]
    confidence: established
    mechanism: >
      With the westerly belt loosened and spread toward the equator, more
      winter cold fronts reach the southwest coast and the rain they carry
      falls there.
    caveat: >
      A negative winter brings more fronts, not necessarily wetter ones; a
      dry winter is still possible if the fronts arrive weak, and the
      long-term decline in rain here continues under either phase.
    sources: [hendon_2007, meneghini_2007, bom_sam]

  - id: positive_sam_southeast_australia
    from: sam
    when: positive
    to: southeast_australia_rainfall
    effect: -1
    lag_months: [0, 1]
    season: [5, 6, 7, 8, 9, 10]
    confidence: established
    mechanism: >
      In winter the southern coast, Victoria and Tasmania get their rain from
      westerly fronts; with the belt held to the south, fewer fronts cross
      the coast.
    caveat: >
      The Indian Ocean Dipole and ENSO act on the same region in the same
      months and can outweigh the mode; and the same positive phase tends to
      bring the east coast more rain once summer comes.
    evidence_note: >
      Found in daily rainfall for southern Victoria, South Australia and
      western Tasmania, and in seasonal totals; the winter signal is the
      most consistent of the mode's Australian effects.
    sources: [hendon_2007, meneghini_2007]

  - id: negative_sam_southeast_australia
    from: sam
    when: negative
    to: southeast_australia_rainfall
    effect: 1
    lag_months: [0, 1]
    season: [5, 6, 7, 8, 9, 10]
