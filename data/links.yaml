    sources: [knight_2006, folland_2001]

  - id: positive_amo_indian_monsoon
    from: amo
    when: positive
    to: indian_summer_monsoon
    effect: 1
    lag_months: [0, 1]
    season: [6, 7, 8, 9]
    confidence: contested
    mechanism: >
      A warm North Atlantic is proposed to warm the air over Eurasia in
      late summer, which keeps the land–sea temperature contrast that
      drives the monsoon going for longer, so the monsoon tends to be a
      little stronger and to withdraw later.
    caveat: >
      Mostly a model result about a small multidecadal tilt; ENSO and the
      Indian Ocean set any one monsoon, and studies disagree on how much
      the Atlantic adds.
    evidence_note: >
      Statistical work links the multidecadal swings of Indian and Sahel
      rain and of hurricanes to the Atlantic, and one model traces a
      pathway through the temperature of the upper air over Eurasia; the
      signal is small and the link is shown as contested.
    sources: [zhang_delworth_2006, goswami_2006]

  - id: negative_amo_indian_monsoon
    from: amo
    when: negative
    to: indian_summer_monsoon
    effect: -1
    lag_months: [0, 1]
    season: [6, 7, 8, 9]
    confidence: contested
    mechanism: >
      A cool North Atlantic is proposed to cool the air over Eurasia in
