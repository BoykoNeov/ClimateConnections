      bands and cold fronts that cross the south of the continent with extra
      moisture, so winter and spring tend to run wet.
    caveat: >
      Negative events are weaker and rarer than positive ones, and the extra
      rain depends on weather systems actually arriving to use the moisture.
      The 2016 event brought a very wet winter; others have been milder.
    sources: [ummenhofer_2009, cai_2011, bom_iod]

  - id: negative_iod_east_africa_short_rains
