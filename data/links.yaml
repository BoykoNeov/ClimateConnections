    to: patagonia_rainfall
    effect: 1
    lag_months: [0, 1]
    season: []
    confidence: established
    mechanism: >
      With the westerly belt loosened, more fronts reach the Chilean coast
      south of 40°S and rainfall on the windward side of the Andes tends to
      increase.
    caveat: >
      The Argentine side sits in the rain shadow and gains little; and a
