    citation: "NOAA Climate Prediction Center. North Atlantic Oscillation (NAO) index, monthly, standardised, 1950 to date. Read for the years table in August 2026: a winter is positive when its December–February mean is at or above +0.5 and negative at or below −0.5, in standardised units; the phase is dated from December and held three months."
    url: https://www.cpc.ncep.noaa.gov/products/precip/CWlink/pna/nao.shtml
  - key: marshall_sam_index
    citation: "British Antarctic Survey. Station-based Southern Annular Mode index (Marshall 2003), monthly, 1957 to date. Read for the years table in August 2026: a positive or negative SAM is called when the three-month running mean stays at or beyond +1.5 or −1.5 (the index's standard deviation is about 1.2) for at least two overlapping seasons; the year's entry is the first such run to begin in the year, and the others are named in its note."
    url: https://legacy.bas.ac.uk/met/gjma/sam.html
  - key: ncei_pdo_index
    citation: "NOAA National Centers for Environmental Information. Pacific Decadal Oscillation index from ERSST version 5, monthly, 1854 to date. Read for the years table in August 2026: a year is positive when its calendar-year mean is at or above +0.5 and negative at or below −0.5; a run of same-phase years is one phase, dated from January of its first year."
    url: https://www.ncei.noaa.gov/access/monitoring/pdo/
  - key: psl_amo_kaplan_index
    citation: "NOAA Physical Sciences Laboratory. Atlantic Multidecadal Oscillation index, unsmoothed and detrended, from the Kaplan SST version 2 North Atlantic mean, monthly, 1856 to January 2023. Read for the years table in August 2026, for 1980–2022: a year is positive when its calendar-year mean is at or above +0.1 °C and negative at or below −0.1 °C; a run of same-phase years is one phase, dated from January of its first year."
    url: https://psl.noaa.gov/data/timeseries/AMO/
  - key: ncei_amo_ersst_index
    citation: "NOAA National Centers for Environmental Information. North Atlantic (0–60°N) sea-surface temperature anomaly from ERSST version 5, monthly, 1854 to date, offered as an AMO index. Read for the years table in August 2026, for 2023 onwards, where the Kaplan series ends: its calendar-year means were linearly detrended over 1854–2025 for this table and read with the same ±0.1 °C rule. Over 1980–2022 the two series give the same phase in most years and differ in eight, all with the Kaplan value within 0.07 °C of the threshold."
    url: https://www.ncei.noaa.gov/pub/data/cmb/ersst/v5/index/
  - key: ersst_atl3_index
    citation: "NOAA ERSST version 5, Atlantic Niño (ATL3) index computed for the years table in August 2026. Sea-surface temperature averaged over 3°S–3°N, 20°W–0° from the monthly ERSST v5 grid (Huang and others, 2017), as anomalies from the 1991–2020 monthly means; a warm or cool event is called when the three-month running mean is at or beyond +0.5 °C or −0.5 °C, about one standard deviation, for at least one season, the rule the Atlantic Niño literature uses; the year's entry is the first such event to begin in the year."
    url: https://psl.noaa.gov/data/gridded/data.noaa.ersst.v5.html
  - key: ersst_iobm_index
    citation: "NOAA ERSST version 5, Indian Ocean Basin Mode index computed for the years table in September 2026. Sea-surface temperature averaged over 20°S–20°N, 40–110°E from the monthly ERSST v5 grid (Huang and others, 2017), as anomalies from the 1991–2020 monthly means with the linear trend over 1980–2025 (+0.14 °C a decade) removed, since the mode is the year-to-year swing on top of the basin's warming; a warm or cool basin is called when the three-month running mean is at or beyond +0.25 °C or −0.25 °C, about one standard deviation, for at least two overlapping seasons; the year's entry is the first such event to begin in the year."
    url: https://psl.noaa.gov/data/gridded/data.noaa.ersst.v5.html
  - key: psl_amm_index
    citation: "NOAA Physical Sciences Laboratory. Atlantic Meridional Mode (AMM) sea-surface temperature index of Chiang and Vimont (2004), monthly, January 1948 to August 2024, where the series ends. Read for the years table in September 2026: a positive or negative AMM is called when the three-month running mean is at or beyond +2.5 or −2.5, about one standard deviation, for at least two overlapping seasons; the year's entry is the first such event to begin in the year, and 2025 is not recorded."
    url: https://psl.noaa.gov/data/timeseries/monthly/AMM/
  - key: psl_pmm_index
    citation: "NOAA Physical Sciences Laboratory. Pacific Meridional Mode (PMM) sea-surface temperature index of Chiang and Vimont (2004), monthly, January 1948 to August 2024, where the series ends. Read for the years table in September 2026: a positive or negative PMM is called when the three-month running mean is at or beyond +3 or −3, about one standard deviation, for at least two overlapping seasons; the year's entry is the first such event to begin in the year, and 2025 is not recorded."
    url: https://psl.noaa.gov/data/timeseries/monthly/PMM/
  - key: giss_glossac_aod_index
    citation: "NASA Goddard Institute for Space Studies. Stratospheric aerosol optical depth at 550 nm by latitude, monthly, 1979 to 2025, derived by A. Lacis from the Global Space-based Stratospheric Aerosol Climatology version 2.24 (Kovilakam and others, 2020). Read for the years table in September 2026 as the area-weighted global mean: an eruption is in force while the monthly value is above 0.02, about four times the quiet background of 0.005; the onset is the first such month and the duration counts the months above it. Only El Chichón (1982) and Pinatubo (1991) qualify in these years; the Hunga Tonga eruption of January 2022 lifted the value to 0.015 at most and is not called."
    url: https://data.giss.nasa.gov/modelforce/strataer/
  - key: psl_qbo30_index
    citation: "NOAA Physical Sciences Laboratory. Quasi-Biennial Oscillation index: monthly mean zonal wind at 30 hPa over the equator from the NCEP/NCAR reanalysis, 1948 to date, in m/s. Read for the years table in September 2026: the phase is the sign of the monthly wind, westerly or easterly, beginning in the first month of the new sign and holding until the next change; a reversal shorter than three months is ignored; the year's entry is the first phase to begin in the year, the other named in its note. Checked against the Singapore radiosonde series of the Freie Universität Berlin at the same level for 1990–2021: the two agree on every phase change to within three months, except that the balloons show the weak easterly interruption of early 2020 as two months only, under this rule's three; the disruption of February 2016 cut through the westerlies at 40 hPa, one level lower, and shows at 30 hPa only as a weakening."
    url: https://psl.noaa.gov/data/correlation/qbo.data
  - key: nsidc_barents_kara_index
    citation: "National Snow and Ice Data Center. Sea Ice Index, version 4 (Fetterer and others), regional monthly extent for the Barents and Kara seas, November 1978 to date. Read for the years table in September 2026 as the October–November mean of the two seas together, with the linear trend over 1979–2025 (−0.18 million km² a decade) removed, since the links describe the year-to-year swing rather than the long decline: high or low ice is called when the departure from the trend line is at or beyond +0.2 or −0.2 million km², about one standard deviation; the phase is dated from October and held six months, to March, the winter the links describe."
    url: https://noaadata.apps.nsidc.org/NOAA/G02135/seaice_analysis/
  - key: rutgers_eurasia_snow_index
    citation: "Rutgers University Global Snow Lab (Robinson, D. A.). Eurasia monthly snow cover extent from the NOAA climate data record, November 1966 to date. Read for the years table in September 2026 as the October extent against the 1991–2020 October mean of 10.7 million km², with the linear trend over 1980–2025 (+0.9 million km² a decade, disputed as an artefact of the record's change of method by Brown and Derksen 2013) removed: high or low snow is called when the departure from the trend line is at or beyond +1.5 or −1.5 million km², about one standard deviation; the phase is dated from October and held six months, to March, the winter the links describe. This is the month's extent, not the rate of advance across it that the snow-advance index of Cohen and Jones (2011) reads."
    url: https://climate.rutgers.edu/snowcover/files/moncov.eurasia.txt
  - key: sellitto_2022
    citation: "Sellitto, P., Podglajen, A., Belhadji, R., Boichu, M., Carboni, E., Cuesta, J., Duchamp, C., Kloss, C., Siddans, R., Bègue, N., Blarel, L., Jegou, F., Khaykin, S., Renard, J.-B., & Legras, B. (2022). The unexpected radiative impact of the Hunga Tonga eruption of 15th January 2022. Communications Earth & Environment, 3, 288."
