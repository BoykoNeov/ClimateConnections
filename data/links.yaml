    sources: [sutton_hodson_2005, sutton_dong_2012]

  - id: positive_amo_northeast_brazil
    from: amo
    when: positive
    to: northeast_brazil
    effect: -1
    lag_months: [0, 1]
    season: [2, 3, 4, 5]
    confidence: contested
    mechanism: >
      When the North Atlantic is warmer than the South Atlantic the
      tropical rain belt sits further north in the early months of the
      year and reaches the Nordeste less, so its short rainy season tends
      to be weaker.
    caveat: >
      What matters for the Nordeste is the north–south contrast across the
      tropical Atlantic in that particular spring, and the Pacific; the
      slow basin-wide warming is only one part of that contrast, so the
      link is shown as contested.
    evidence_note: >
      Drier Nordeste seasons in warm phases appear in observations and in
      a long climate-model run, but the instrumental record holds only a
      few phases, and forecasts of Nordeste rain lean on the year's own
      Atlantic contrast and on ENSO.
    sources: [knight_2006, folland_2001]

  - id: negative_amo_northeast_brazil
    from: amo
    when: negative
    to: northeast_brazil
    effect: 1
    lag_months: [0, 1]
