    sources: [gillett_2006, garreaud_2009]

  - id: positive_sam_antarctic_peninsula
    from: sam
    when: positive
    to: antarctic_peninsula_summer
    effect: 1
    lag_months: [0, 1]
    season: [12, 1, 2]
    confidence: established
