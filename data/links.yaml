  # ================================================================ POSITIVE IOD
  - id: positive_iod_east_africa_short_rains
    from: iod
    when: positive
    to: east_africa_short_rains
    effect: 1
    lag_months: [3, 5]
    season: [10, 11, 12]
    confidence: established
    mechanism: >
      Warm water off East Africa and easterly winds along the equator pile
      moist, rising air against the Horn of Africa just as the short rains
      begin, so the October–December rains tend to run heavy.
    caveat: >
      The effect is concentrated near the coast and in these three months.
      Many positive events fall in El Niño years, so a wet season is not
      always the Indian Ocean's doing alone, and a weak event can pass with
      ordinary rains.
    evidence_note: >
      Several studies find the Indian Ocean, not the Pacific, is the direct
      cause of the very wet short rains, with El Niño acting mostly through
      it; the flood years 1961, 1997 and 2019 all had strong positive events.
    sources: [saji_1999, black_2003, behera_2005]

  - id: positive_iod_indonesia
    from: iod
    when: positive
    to: indonesia_rainfall
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      Cool water off Sumatra and Java suppresses the rising air that usually
      brings rain, and the winds along the equator blow the moisture away to
      the west, so the dry season deepens and runs late.
    caveat: >
      The drying is strongest in Sumatra, Java and the islands facing the
      Indian Ocean; eastern Indonesia answers more to ENSO. When a positive
      event coincides with El Niño the two add up, and it is hard to say how
      much is which.
    evidence_note: >
      Fire seasons in Sumatra and Borneo have been worst when a positive
      dipole and El Niño occur together (1997, 2015), but a strong dipole on
      its own, as in 2019, has also brought a severe fire season.
    sources: [saji_1999, pan_2018, bom_iod]

  - id: positive_iod_southeast_australia
    from: iod
    when: positive
    to: southeast_australia_rainfall
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      The cloud bands that feed rain-bearing systems over southern Australia
      draw their moisture from the ocean northwest of the continent. Cool
      water there in a positive event starves them, so winter and spring
      rain tends to fall short.
    caveat: >
      The influence stops in December when the event breaks down, so a dry
      cool season is not a dry year. Single events vary a lot, and southern
      Australia has had ordinary winters during weak positive events.
    evidence_note: >
      Long droughts in the Murray–Darling basin have coincided with runs of
      positive events with no negative ones in between, and the 2019 event,
      one of the strongest on record, preceded the Black Summer fires.
    sources: [ummenhofer_2009, cai_2011, bom_iod]

  - id: positive_iod_indian_monsoon
    from: iod
    when: positive
    to: indian_summer_monsoon
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: contested
    mechanism: >
      Warm water in the western Indian Ocean strengthens the moist flow
      toward India and the rising air over the Bay of Bengal, which tends to
      nudge the summer monsoon toward more rain.
    caveat: >
      The direct effect is modest and studies disagree on whether it exists
      at all. Positive events often coincide with El Niño, which pushes the
      other way; the result is more often a near-normal monsoon than a strong
      one.
    evidence_note: >
      The best-known finding is that a positive dipole cancels part of El
      Niño's drying, as in 1997, rather than boosting the monsoon on its own.
    sources: [ashok_2001, saji_yamagata_2003]

  - id: positive_iod_south_india_northeast_monsoon
    from: iod
    when: positive
    to: south_india_northeast_monsoon
    effect: 1
    lag_months: [3, 5]
    season: [10, 11, 12]
    confidence: probable
    mechanism: >
      The warm western and central Indian Ocean feeds extra moisture into the
      winds that bring the October–December rains to southern India and Sri
      Lanka, so the season tends to run wet.
    caveat: >
      The relationship holds in most, not all, strong events, and El Niño
      tends to push this season in the same direction, which makes it hard to
      credit the Indian Ocean alone.
    sources: [kripalani_kumar_2004, zubair_2003]

  - id: positive_iod_east_asia_summer
    from: iod
    when: positive
    to: east_asia_summer
    effect: 1
    lag_months: [0, 2]
    season: [6, 7, 8]
    confidence: contested
    mechanism: >
      Extra rain over the Bay of Bengal in a positive event sets off a wave
      in the upper atmosphere that strengthens high pressure over Japan and
      Korea, favouring hot, dry summer weather.
    caveat: >
      This rests on a handful of events, above all the record summer of 1994,
      and several summers with a positive dipole have been unremarkable. It
      is included to show where the research is still open.
    sources: [guan_yamagata_2003, saji_yamagata_2003]

  # ================================================================ NEGATIVE IOD
  - id: negative_iod_southeast_australia
    from: iod
    when: negative
    to: southeast_australia_rainfall
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
