  # ENSO tends to set the summer mode: El Niño toward negative, La Niña toward positive.
  - id: el_nino_negative_sam
    from: enso
    when: el_nino
    to: sam
    effect: -1
    lag_months: [4, 6]
    season: [11, 12, 1, 2]
    confidence: probable
    mechanism: >
      El Niño warms the tropics and shifts the winds of the subtropics, which
      changes how weather systems are steered in the Southern Hemisphere and
      tends to weaken and spread the westerly belt in the austral summer: a
      negative mode.
    caveat: >
      Roughly a quarter of the summer mode follows ENSO; the rest is the
      atmosphere's own noise, and the pairing has been strong in some
      decades and weak in others.
    evidence_note: >
      Found for the austral summer in the reanalysis record, and in the
      1990s in spring as well; in the 1980s the two patterns interfered
      rather than lining up, so the link is shown as probable rather than
      established.
    sources: [lheureux_thompson_2006, fogt_bromwich_2006]

  - id: la_nina_positive_sam
    from: enso
    when: la_nina
    to: sam
    effect: 1
    lag_months: [4, 6]
    season: [11, 12, 1, 2]
    confidence: probable
    mechanism: >
      La Niña cools the tropics and strengthens the subtropical winds, which
      tends to tighten the westerly belt toward the pole in the austral
      summer: a positive mode.
    caveat: >
      The same quarter-share applies: most of the summer mode is not set by
      ENSO, and a La Niña summer can still lean negative for weeks.
    evidence_note: >
      The same summer relationship as the El Niño link, read the other way;
      when the two line up, a wet La Niña summer on the east coast of
      Australia gets the mode's onshore winds on top.
    sources: [lheureux_thompson_2006, fogt_bromwich_2006, hendon_2007]


  # ---- Pacific Decadal Oscillation (M17). The oscillation is defined by a
  # regression pattern, so every target gets a link per phase. Its own
  # effects are ENSO-like and weaker, and much of the PDO is ENSO's footprint,
  # so nothing here is rated established.
  - id: positive_pdo_alaska
    from: pdo
    when: positive
    to: alaska_winter
    effect: 1
    lag_months: [0, 1]
    season: [10, 11, 12, 1, 2, 3]
    confidence: probable
    mechanism: >
      Warm water in the Gulf of Alaska and a deep Aleutian low pump mild
      Pacific air north over Alaska through the winter.
    caveat: >
      The oscillation is a decade-scale average; any one winter inside a
      positive phase can be cold if the Aleutian low sits in the wrong place
      for a few weeks, and much of the signal is El Niño's own winter
      pattern.
    evidence_note: >
      The warm-phase regression shows Alaska and northwest North America
      warm in winter, and Alaska's climate stepped warmer at the 1976–77
      flip; the mixed causes of the oscillation mean the tendency is rated
      probable rather than established.
    sources: [mantua_1997, mantua_hare_2002, newman_2016]

  - id: negative_pdo_alaska
    from: pdo
    when: negative
    to: alaska_winter
    effect: -1
    lag_months: [0, 1]
    season: [10, 11, 12, 1, 2, 3]
    confidence: probable
    mechanism: >
      Cool water in the Gulf of Alaska and a weak Aleutian low leave Alaska
      under its own cold air through the winter.
    caveat: >
      A single winter inside a negative phase can still be mild; the
      tendency is over the decade, and a strong El Niño can override it.
    sources: [mantua_1997, mantua_hare_2002]

  - id: positive_pdo_pacific_northwest
    from: pdo
    when: positive
    to: pacific_northwest_winter
    effect: 1
    lag_months: [0, 1]
    season: [12, 1, 2]
    confidence: probable
