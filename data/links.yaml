  # ENSO tends to set the PDO: El Niño toward positive, La Niña toward negative.
  - id: el_nino_positive_pdo
    from: enso
    when: el_nino
    to: pdo
    effect: 1
    lag_months: [3, 6]
    season: []
    confidence: probable
    mechanism: >
      El Niño deepens the Aleutian low through the "atmospheric bridge",
      which cools the central North Pacific and warms the water along the
      North American coast, the pattern of a positive oscillation; the
      ocean then remembers it from one winter to the next.
    caveat: >
      The oscillation also has its own North Pacific sources and a
      decade-long memory, so a single El Niño tips the index for a season
      or a year rather than flipping the phase; the 1997–98 El Niño was
      followed by a cool phase, not a warm one.
    evidence_note: >
      A simple model of ENSO forcing plus the re-emergence of last winter's
      anomalies plus noise reproduces the index well, and the current view
      is that the oscillation is a mix of processes rather than one, with
      the tropics supplying much of it.
    sources: [newman_2003, alexander_2002, newman_2016]

  - id: la_nina_negative_pdo
    from: enso
    when: la_nina
    to: pdo
    effect: -1
    lag_months: [3, 6]
    season: []
    confidence: probable
    mechanism: >
      La Niña weakens the Aleutian low through the same bridge, which warms
      the central North Pacific and cools the coastal water, the pattern of
      a negative oscillation.
    caveat: >
      One La Niña nudges the index; the phase itself turns on the ocean's
      decade-long memory, so a La Niña inside a warm phase does not end
      it.
    evidence_note: >
      The same bridge as the El Niño link, read the other way; the run of
      La Niña years around 1999–2001 and 2010–12 fell in a mostly cool
      phase, but the fit is loose year by year.
    sources: [newman_2003, alexander_2002, newman_2016]


  # ---- Atlantic Multidecadal Oscillation (M18). A phase lasts decades, so
  # every link is a tendency held for the year shown, with lag 0–1. The
  # links are one per phase and target; the tiers follow how many
  # independent lines of evidence agree, not how big the effect is.
  - id: positive_amo_atlantic_hurricanes
    from: amo
    when: positive
    to: atlantic_hurricanes
    effect: 1
    lag_months: [0, 1]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      A warm tropical North Atlantic feeds storms more energy and comes
      with weaker wind shear over the main hurricane-forming region between
      Africa and the Caribbean, so more storms form and more of them grow
      into major hurricanes.
    caveat: >
      El Niño can quieten a season inside a warm phase, and a single
      season's count swings widely for reasons of its own; the tendency is
      over the decades.
    evidence_note: >
      Activity from 1995 on roughly doubled that of 1971–1994, with a
      two-and-a-half-fold rise in major hurricanes, and the same
      warm-Atlantic, low-shear pairing marks the active decades before
      1970; a long climate-model run reproduces the association.
    sources: [goldenberg_2001, zhang_delworth_2006, knight_2006]

  - id: negative_amo_atlantic_hurricanes
    from: amo
    when: negative
    to: atlantic_hurricanes
    effect: -1
    lag_months: [0, 1]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      A cool tropical North Atlantic and stronger wind shear over the
      hurricane-forming region between Africa and the Caribbean tend to
      tear developing storms apart, so seasons are quieter.
    caveat: >
      A quiet phase still produces destructive hurricanes (Andrew in 1992
      fell in one), and a La Niña can make a season inside a cool phase
      busy.
    sources: [goldenberg_2001, knight_2006]

  - id: positive_amo_sahel
    from: amo
    when: positive
    to: sahel_rainfall
    effect: 1
    lag_months: [0, 1]
    season: [7, 8, 9]
    confidence: established
    mechanism: >
      A warm North Atlantic, warmer than the ocean south of the equator,
      pulls the tropical rain belt north in summer and draws moist air
      further inland over West Africa, so the Sahel's short rainy season
      tends to be stronger.
    caveat: >
      The Sahel also answers the Pacific and the Indian Ocean, and a warm
      phase does not guarantee a wet year; the tendency is over decades,
      with wet and dry years inside each phase.
    evidence_note: >
      The wet Sahel of the 1950s and the drought of the 1970s and 1980s
      line up with the warm and cool Atlantic phases, model runs driven by
      the observed sea temperatures reproduce the swing, and a
      1400-year climate-model run shows the same link. What set the
      Atlantic's phases is argued over: pollution haze and volcanic dust
      may have driven much of the twentieth-century cooling. The link
      from the ocean to the rain holds either way.
    sources: [folland_1986, giannini_2003, zhang_delworth_2006, knight_2006, booth_2012]

  - id: negative_amo_sahel
    from: amo
    when: negative
    to: sahel_rainfall
    effect: -1
    lag_months: [0, 1]
    season: [7, 8, 9]
    confidence: established
    mechanism: >
      A cool North Atlantic, cool relative to the ocean south of the
      equator, holds the tropical rain belt further south in summer, so
      the Sahel's rains tend to fail.
    caveat: >
      The tendency is over decades: even in the drought decades a few
      summers were wet, and the drying of the 1970s and 1980s was helped
      along by warm water in the Indian Ocean and the tropics generally.
    evidence_note: >
      The Sahel drought of the 1970s and 1980s coincided with the cool
      phase from the mid-1960s to 1994, and the drying trend is reproduced
      by models driven with the observed sea temperatures.
    sources: [folland_1986, giannini_2003, zhang_delworth_2006]

  - id: positive_amo_great_plains
    from: amo
    when: positive
    to: us_great_plains_summer
    effect: -1
    lag_months: [0, 1]
    season: [6, 7, 8]
    confidence: probable
    mechanism: >
      With a warm North Atlantic, high pressure over the ocean and the Gulf
