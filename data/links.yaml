# Links: the causal edges. Schema: docs/DATA_FORMAT.md.
#
# Conventions:
#   effect      +1 / -1 on the target node's axis (see its `labels`)
#   lag_months  [min, max] months after the driver phase begins (month 0 = onset,
#               taken as the boreal early summer when an event starts to develop)
#   season      calendar months in which the effect is felt; [] = all year
#   confidence  established | probable | contested (meaning in docs/PLAN.md §3.3)
#   mechanism   plain-language "why"
#   caveat      plain-language "why it might not happen"
#   evidence_note  optional: where studies disagree, how often it shows up
#
# Every link needs at least one source key from the `sources` list below.

links:
  # ================================================================ EL NIÑO
  - id: el_nino_indian_monsoon
    from: enso
    when: el_nino
    to: indian_summer_monsoon
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: established
    mechanism: >
      El Niño shifts the rising branch of the tropical Pacific circulation
      eastward. The compensating sinking air settles over South Asia and
      weakens the moist inflow that drives the monsoon.
    caveat: >
      Roughly one El Niño monsoon in three turns out near normal, and the
      1997 event, the strongest of the century, brought an ordinary monsoon.
    evidence_note: >
      The relationship weakened noticeably from around 1980 to the early
      2000s and its strength depends on where in the Pacific the warming is
      centred. Central-Pacific events are the ones that most reliably fail
      the monsoon (Kumar and others 2006), so this link is drawn for the
      classic kind and the central-Pacific kind has a link of its own.
    sources: [rasmusson_carpenter_1983, kumar_1999, kumar_2006]
    except: [el_nino_central]

  - id: el_nino_indonesia
    from: enso
    when: el_nino
    to: indonesia_rainfall
    effect: -1
    lag_months: [0, 2]
    season: [6, 7, 8, 9, 10, 11, 12]
    confidence: established
    mechanism: >
      The heaviest tropical rain normally sits over Indonesia. In El Niño it
      migrates east into the central Pacific, leaving the islands under
      sinking, dry air for months and extending the dry season.
    caveat: >
      Western Indonesia (Sumatra, Java) is affected less consistently than
      the east, and a wet Indian Ocean can offset part of the drying.
    evidence_note: >
      The 1982, 1997 and 2015 El Niños all coincided with severe Indonesian
      fire seasons; the link to fire depends on how much peatland has been
      drained, which has grown over time.
    sources: [ropelewski_halpert_1987, field_2009]

  - id: el_nino_east_australia
    from: enso
    when: el_nino
    to: east_australia_rainfall
    effect: -1
    lag_months: [0, 2]
    season: [6, 7, 8, 9, 10, 11, 12]
    confidence: established
    mechanism: >
      With the Pacific rain belt displaced eastward, moist tropical air
      reaches eastern Australia less often, and winter–spring rainfall falls
      below average across much of the east.
    caveat: >
      Some El Niño years have brought near-normal rain to Australia, and the
      Indian Ocean Dipole often matters as much for the southeast.
    evidence_note: >
      The Bureau of Meteorology notes that El Niño reliably lowers the odds
      of a wet winter–spring but is not a guarantee of drought. Both kinds
      of El Niño dry the east: eastern Australia is most sensitive to
      warming at the eastern edge of the Pacific warm pool (Wang and Hendon
      2007), so the central-Pacific kind, if anything, brings the drought
      more reliably, as the modest 2002 event did while the huge 1997 one
      did not. Its own extra signature, drier northwestern Australia in
      autumn (Taschetto and England 2009), has no place on this map.
    sources: [bom_enso_australia, ropelewski_halpert_1987, wang_hendon_2007, taschetto_england_2009]

  - id: el_nino_peru_coast
    from: enso
    when: el_nino
    to: peru_coast_rainfall
    effect: 1
    lag_months: [4, 8]
    season: [12, 1, 2, 3, 4]
    confidence: established
    mechanism: >
      Warm water spreads along the normally cold Peruvian coast during the
      mature phase of El Niño, heating the air above it enough to fuel
      thunderstorms over the coastal desert.
    caveat: >
      The heaviest floods come only with strong events that warm the far
      eastern Pacific; weaker or central-Pacific events may bring little rain.
    evidence_note: >
      Holds for the classic kind only. The coastal rains need the warming to
      reach the far eastern Pacific; in a central-Pacific El Niño the warm
      water stays near the dateline, the coast stays cool and the rains do
      not come, so this link is not drawn for that kind (Kao and Yu 2009;
      Takahashi and others 2011; Capotondi and others 2015).
    sources: [ropelewski_halpert_1987, lagos_2008, kao_yu_2009, takahashi_2011, capotondi_2015]
    except: [el_nino_central]

  - id: el_nino_peru_fishery
    from: enso
    when: el_nino
    to: peru_fishery
    effect: -1
    lag_months: [3, 8]
    season: []
    confidence: established
    mechanism: >
      A thick layer of warm water arrives along the coast and stops cold,
      nutrient-rich water from reaching the surface. Plankton growth
      collapses and the anchoveta either starve, migrate or fail to spawn.
    caveat: >
      Overfishing can amplify or mask the effect, and the stock has recovered
      at different speeds after different events.
    evidence_note: >
      Holds for the classic kind only. The collapse needs the thick layer of
      warm, nutrient-poor water to arrive at the coast, which the strong
      eastern-Pacific events bring and central-Pacific events do not, so
      this link is not drawn for that kind (Dewitte and others 2012;
      Espinoza-Morriberón and others 2017).
    sources: [barber_chavez_1983, dewitte_2012, espinoza_morriberon_2017]
    except: [el_nino_central]

  - id: el_nino_us_gulf_coast
    from: enso
    when: el_nino
    to: us_gulf_coast_winter
    effect: 1
    lag_months: [4, 7]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      El Niño strengthens the subtropical jet stream across the southern
      United States in winter, steering more storms along the Gulf Coast and
      into Florida.
    caveat: >
      The signal is clearest in strong events; moderate ones can pass with
      an unremarkable winter.
    evidence_note: >
      The wet, cool Gulf Coast winter is among the most reliable El Niño
      signals in the United States. The Pacific Decadal Oscillation sets how
      reliably this shows up: when the PDO is in its negative (cool) phase,
      El Niño's winter pattern over North America comes through weakly and
      less consistently than when the PDO is positive, so the link is shown
      one tier lower when a negative PDO is chosen alongside El Niño. In a
      central-Pacific El Niño the jet's core sits further south, over the
      Gulf itself, and the wet signal on land is weaker and smaller (Yu and
      Zou 2013), so that kind has a link of its own, one tier lower.
    sources: [ropelewski_halpert_1986, noaa_cpc_north_america, yu_zou_2013]
    except: [el_nino_central]
    weakened_by:
      - driver: pdo
        phase: negative
        sources: [gershunov_barnett_1998, mccabe_dettinger_1999, yu_zwiers_2007]

  - id: el_nino_california
    from: enso
    when: el_nino
    to: california_winter
    effect: 1
    lag_months: [5, 8]
    season: [12, 1, 2, 3]
    confidence: contested
    mechanism: >
      The same southward-shifted jet stream that wets the Gulf Coast can
      bring extra Pacific storms into southern California.
    caveat: >
      Many El Niño winters have been dry in California, including the strong
      2015–16 event, and northern California shows little consistent signal.
    evidence_note: >
      Only strong, eastern-Pacific El Niños show a clear wet signal, mostly
      in southern California and mostly in January–March. Averaged over all
      events the effect is small.
      The Pacific Decadal Oscillation sets how reliably this shows up: when
      the PDO is in its negative (cool) phase, El Niño's winter pattern over
      North America comes through weakly and less consistently than when the
      PDO is positive, so the link is shown one tier lower when a negative
      PDO is chosen alongside El Niño. The link is already at the lowest
      tier, so the line itself does not change; the card says so.
    sources: [jong_2016]
    weakened_by:
      - driver: pdo
        phase: negative
        sources: [gershunov_barnett_1998, mccabe_dettinger_1999, yu_zwiers_2007]

  - id: el_nino_pacific_northwest
    from: enso
    when: el_nino
    to: pacific_northwest_winter
    effect: 1
    lag_months: [5, 8]
    season: [12, 1, 2]
    confidence: established
    mechanism: >
      A stronger ridge of high pressure over western Canada in El Niño
      winters keeps storms south and lets mild Pacific air settle over the
      Northwest, reducing mountain snowpack.
    caveat: >
      Individual cold outbreaks still occur; the tendency is a milder average,
      not an absence of winter.
    evidence_note: >
      The mild Northwest winter appears in most El Niño years, most clearly
      in temperature and mountain snowpack. The Pacific Decadal Oscillation
      sets how reliably this shows up: when the PDO is in its negative
      (cool) phase, El Niño's winter pattern over North America comes
      through weakly and less consistently than when the PDO is positive, so
      the link is shown one tier lower when a negative PDO is chosen
      alongside El Niño. Holds for both kinds of El Niño: the Northwest is,
      if anything, the region a central-Pacific El Niño warms most reliably
      (Yu and others 2012).
    sources: [halpert_ropelewski_1992, noaa_cpc_north_america, yu_2012]
    weakened_by:
      - driver: pdo
        phase: negative
        sources: [gershunov_barnett_1998, mccabe_dettinger_1999, yu_zwiers_2007]

  - id: el_nino_atlantic_hurricanes
    from: enso
    when: el_nino
    to: atlantic_hurricanes
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      El Niño strengthens westerly winds high over the tropical Atlantic.
      That wind shear tilts and tears apart developing storms before they
      can organise into hurricanes.
    caveat: >
      A very warm Atlantic can partly compensate, and a single landfalling
      storm can still make a "quiet" season destructive.
    evidence_note: >
      One of the most robust ENSO effects known; used operationally in
      seasonal hurricane outlooks since the 1980s. It holds for the classic
      kind. A central-Pacific El Niño, with its warming near the dateline,
      does not reliably raise the shear over the Atlantic, so this link is
      not drawn for that kind; whether that kind in fact makes the season
      busier is disputed (Kim, Webster and Curry 2009 against Lee, Wang and
      Enfield 2010 and Larson and others 2012) and drawn as a contested
      link of its own.
    sources: [gray_1984, bell_2014, kim_webster_curry_2009, lee_wang_enfield_2010, larson_2012]
    except: [el_nino_central]

  - id: el_nino_east_pacific_hurricanes
    from: enso
    when: el_nino
    to: east_pacific_hurricanes
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      Warmer water and weaker high-altitude wind shear over the eastern
      Pacific give storms off Mexico more fuel and a calmer environment to
      grow in.
    caveat: >
      The increase shows up more in storm strength and westward reach than
      in the raw count of storms.
    sources: [bell_2014]

  - id: el_nino_east_africa_short_rains
    from: enso
    when: el_nino
    to: east_africa_short_rains
    effect: 1
    lag_months: [3, 6]
    season: [10, 11, 12]
    confidence: established
    mechanism: >
      El Niño tends to warm the western Indian Ocean and weaken the winds
      that normally carry moisture away from East Africa, so the
      October–December rains are heavier.
    caveat: >
      The Indian Ocean Dipole controls this season at least as strongly as
      ENSO, and the two do not always line up.
    evidence_note: >
      Much of the ENSO signal here is thought to act through the Indian
      Ocean; El Niño years without a positive Indian Ocean Dipole show a
      weaker wet signal.
    sources: [indeje_2000, nicholson_kim_1997]

  - id: el_nino_southern_africa
    from: enso
    when: el_nino
    to: southern_africa_summer
    effect: -1
    lag_months: [5, 9]
    season: [12, 1, 2, 3]
    confidence: established
    mechanism: >
      In El Niño summers the main rain-producing cloud band over southern
      Africa is displaced northeast over the ocean, and sinking air over the
      interior suppresses rainfall.
    caveat: >
      Some El Niño summers, such as 1997–98, brought near-normal rain to
      South Africa despite a strong event.
    sources: [lindesay_1988, nicholson_kim_1997]

  - id: el_nino_sahel
    from: enso
    when: el_nino
    to: sahel_rainfall
    effect: -1
    lag_months: [0, 3]
    season: [7, 8, 9]
    confidence: probable
    mechanism: >
      Warming in the tropical Pacific tends to weaken the northward push of
      the West African monsoon, so the Sahel's short rainy season delivers
      less.
    caveat: >
      Atlantic and Indian Ocean temperatures often matter more for the
      Sahel, and the ENSO link was weak before the 1970s.
    evidence_note: >
      The ENSO–Sahel relationship strengthened after about 1970 and remains
      weaker than the Atlantic influence in most studies.
    sources: [janicot_1996, nicholson_kim_1997]

  - id: el_nino_northeast_brazil
    from: enso
    when: el_nino
    to: northeast_brazil
    effect: -1
    lag_months: [8, 11]
    season: [2, 3, 4, 5]
    confidence: established
    mechanism: >
      Sinking air over the tropical Atlantic during El Niño keeps the
      Atlantic rain belt north of its usual position in the following
      February–May, so it never reaches the Nordeste.
    caveat: >
      The temperature contrast between the north and south tropical Atlantic
      can override ENSO in either direction.
    sources: [ropelewski_halpert_1987, hastenrath_heller_1977]

  - id: el_nino_southeast_south_america
    from: enso
    when: el_nino
    to: southeast_south_america
    effect: 1
    lag_months: [3, 8]
    season: [10, 11, 12, 1]
    confidence: established
    mechanism: >
      A strengthened subtropical jet over South America in El Niño years
      stalls fronts over Uruguay and southern Brazil and feeds them tropical
      moisture, giving persistent heavy rain.
    caveat: >
      The signal is strongest in spring (October–December); by late summer
      it usually fades.
    sources: [grimm_2000, ropelewski_halpert_1987]

  - id: el_nino_central_chile
    from: enso
    when: el_nino
    to: central_chile_winter
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: probable
    mechanism: >
      Winter storms that normally pass south of Santiago track further north
      when El Niño weakens the subtropical high-pressure belt off Chile.
    caveat: >
      The effect depends on latitude and the timing of the event; some El
      Niño winters in Santiago have been ordinary.
    sources: [montecinos_aceituno_2003]

  - id: el_nino_philippines
    from: enso
    when: el_nino
    to: philippines_rainfall
    effect: -1
    lag_months: [3, 6]
    season: [10, 11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      As the Pacific rain belt shifts east and the western Pacific cools,
      the Philippines fall under drier air from late in the El Niño year
      into the following spring.
    caveat: >
      The first months of a developing El Niño (July–September) often bring
      more rain than usual, not less, before the drying sets in.
    evidence_note: >
      The sign of the effect flips within a single event: wetter in the
      developing summer, drier from October onward. The drying phase is the
      more consistent of the two.
    sources: [lyon_camargo_2009]

  - id: el_nino_central_pacific_islands
    from: enso
    when: el_nino
    to: central_pacific_islands
    effect: 1
    lag_months: [0, 3]
    season: []
    confidence: established
    mechanism: >
      The heavy tropical rain that normally sits over Indonesia moves east
      to the date line, directly over Kiribati and its neighbours.
    caveat: >
      Islands further west or east of the date line see a smaller or
      delayed effect.
    sources: [ropelewski_halpert_1987, noaa_climate_gov_enso]

  - id: el_nino_coral_bleaching
    from: enso
    when: el_nino
    to: coral_bleaching_central_pacific
    effect: 1
    lag_months: [3, 9]
    season: []
    confidence: established
    mechanism: >
      Water over the central Pacific reefs stays one to three degrees warmer
      than usual for months, long enough to break down the algae that corals
      depend on.
    caveat: >
      Reefs already stressed bleach more easily, and with the long-term
      warming trend bleaching now also occurs in some non-El Niño years.
    sources: [glynn_1984, eakin_2019]

  - id: el_nino_global_temperature
    from: enso
    when: el_nino
    to: global_mean_temperature
    effect: 1
    lag_months: [3, 6]
    season: []
    confidence: established
    mechanism: >
      Heat stored in the tropical Pacific is released into the atmosphere,
      and the global average surface temperature rises by roughly a tenth
      to two tenths of a degree for several months.
    caveat: >
      This is a temporary bump on top of the long-term warming trend and is
      easily hidden by other factors in any single month.
    sources: [trenberth_2002]

  - id: el_nino_east_asia_winter
    from: enso
    when: el_nino
    to: east_asia_winter
    effect: 1
    lag_months: [5, 8]
    season: [12, 1, 2]
    confidence: probable
    mechanism: >
      A high-pressure anomaly forms over the western North Pacific in El
      Niño winters and weakens the cold northerly winds flowing out of
      Siberia toward Japan and eastern China.
    caveat: >
      Arctic and Eurasian snow-cover patterns often dominate East Asian
      winters and can cancel the ENSO tendency.
    sources: [wang_2000]

  # ================================================================ LA NIÑA
  - id: la_nina_indian_monsoon
    from: enso
    when: la_nina
    to: indian_summer_monsoon
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9]
    confidence: probable
    mechanism: >
      With the Pacific rain belt pushed west, rising air over the Maritime
      Continent and South Asia strengthens the monsoon circulation and
      favours above-normal rain.
    caveat: >
      The wet tendency in La Niña is weaker than the dry tendency in El Niño;
      several La Niña monsoons have been merely normal.
    evidence_note: >
      Studies consistently find the monsoon's response to be asymmetric:
      El Niño suppresses it more than La Niña enhances it.
    sources: [rasmusson_carpenter_1983, kumar_1999]

  - id: la_nina_indonesia
    from: enso
    when: la_nina
    to: indonesia_rainfall
    effect: 1
    lag_months: [0, 2]
    season: [6, 7, 8, 9, 10, 11, 12]
    confidence: established
    mechanism: >
      Stronger trade winds pile warm water and rising air over Indonesia,
      intensifying and prolonging the rains.
    caveat: >
      Flooding depends heavily on local terrain and on the monsoon timing,
      so the extra rain is not evenly spread across the islands.
    sources: [ropelewski_halpert_1989]

  - id: la_nina_east_australia
    from: enso
    when: la_nina
    to: east_australia_rainfall
    effect: 1
    lag_months: [0, 2]
    season: [6, 7, 8, 9, 10, 11, 12, 1, 2]
    confidence: established
    mechanism: >
      Warm water and rising air in the western Pacific feed moist tropical
      air into eastern Australia, raising the odds of a wet winter, spring
      and early summer.
    caveat: >
      The wettest La Niña years, such as 2010–11, also had other drivers
      lined up; a La Niña alone does not guarantee floods.
    sources: [bom_enso_australia, ropelewski_halpert_1989]

  - id: la_nina_peru_coast
    from: enso
    when: la_nina
    to: peru_coast_rainfall
    effect: -1
    lag_months: [4, 8]
    season: [12, 1, 2, 3, 4]
    confidence: probable
    mechanism: >
      Colder-than-usual coastal water in La Niña keeps the air stable and
      suppresses the rare summer rain that the northern Peruvian coast
      normally receives.
    caveat: >
      The coast is already so dry that the difference between a normal and a
      La Niña year is small in absolute terms.
    sources: [ropelewski_halpert_1989]

  - id: la_nina_peru_fishery
    from: enso
    when: la_nina
    to: peru_fishery
    effect: 1
    lag_months: [3, 8]
    season: []
    confidence: probable
    mechanism: >
      Stronger trade winds drive more cold, nutrient-rich water to the
      surface along the Peruvian coast, boosting plankton and the anchoveta
      that feed on it.
    caveat: >
      Fish stocks also respond to slower decade-scale ocean shifts and to
      fishing pressure, so a La Niña does not always translate into a bumper catch.
    sources: [barber_chavez_1983]

  - id: la_nina_us_gulf_coast
    from: enso
    when: la_nina
    to: us_gulf_coast_winter
    effect: -1
    lag_months: [4, 7]
    season: [11, 12, 1, 2, 3]
    confidence: established
    mechanism: >
      In La Niña winters the storm track sits further north, so the southern
      United States sees fewer winter storms and often develops drought.
    caveat: >
      Occasional strong cold fronts still bring rain; the tendency is a drier
      average across the whole winter.
    evidence_note: >
      The dry Gulf Coast winter shows up in most La Niña years and is a
      usual start of drought in Texas and the Southeast. The Pacific Decadal
      Oscillation sets how reliably this shows up: when the PDO is in its
      positive (warm) phase, La Niña's winter pattern over North America
      comes through weakly and less consistently than when the PDO is
      negative, so the link is shown one tier lower when a positive PDO is
      chosen alongside La Niña.
    sources: [ropelewski_halpert_1986, noaa_cpc_north_america]
    weakened_by:
      - driver: pdo
        phase: positive
        sources: [gershunov_barnett_1998, mccabe_dettinger_1999, yu_zwiers_2007]

  - id: la_nina_california
    from: enso
    when: la_nina
    to: california_winter
    effect: -1
    lag_months: [5, 8]
    season: [12, 1, 2, 3]
    confidence: contested
    mechanism: >
      The northward-shifted storm track of a La Niña winter tends to pass
      over the Pacific Northwest and miss southern California.
    caveat: >
      La Niña winters have included some of California's wettest, such as
      2016–17; the average tendency is small.
    evidence_note: >
      Southern California shows a modest dry lean in La Niña; northern
      California shows almost none.
      The Pacific Decadal Oscillation sets how reliably this shows up: when
      the PDO is in its positive (warm) phase, La Niña's winter pattern over
      North America comes through weakly and less consistently than when the
      PDO is negative, so the link is shown one tier lower when a positive
      PDO is chosen alongside La Niña. The link is already at the lowest
      tier, so the line itself does not change; the card says so.
    sources: [jong_2016]
    weakened_by:
      - driver: pdo
        phase: positive
        sources: [gershunov_barnett_1998, mccabe_dettinger_1999, yu_zwiers_2007]

  - id: la_nina_pacific_northwest
    from: enso
    when: la_nina
    to: pacific_northwest_winter
    effect: -1
    lag_months: [5, 8]
    season: [12, 1, 2]
    confidence: established
    mechanism: >
      The winter storm track aims squarely at the Pacific Northwest in La
      Niña years, bringing more rain to the lowlands and more snow to the
      mountains, with cooler average temperatures.
    caveat: >
      A warm blob of ocean water offshore can override the cool tendency, as
      happened in some recent La Niña winters.
    evidence_note: >
      The cool, wet Northwest winter appears in most La Niña years, most
      clearly in mountain snowpack. The Pacific Decadal Oscillation sets how
      reliably this shows up: when the PDO is in its positive (warm) phase,
      La Niña's winter pattern over North America comes through weakly and
      less consistently than when the PDO is negative, so the link is shown
      one tier lower when a positive PDO is chosen alongside La Niña.
    sources: [halpert_ropelewski_1992, noaa_cpc_north_america]
    weakened_by:
      - driver: pdo
        phase: positive
        sources: [gershunov_barnett_1998, mccabe_dettinger_1999, yu_zwiers_2007]

  - id: la_nina_atlantic_hurricanes
    from: enso
    when: la_nina
    to: atlantic_hurricanes
    effect: 1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: established
    mechanism: >
      La Niña relaxes the high-altitude westerly winds over the tropical
      Atlantic, so developing storms are not sheared apart and more of them
      grow into hurricanes.
    caveat: >
      A cool Atlantic or dusty, dry air from the Sahara can still keep a La
      Niña season quiet.
    sources: [gray_1984, bell_2014]

  - id: la_nina_east_pacific_hurricanes
    from: enso
    when: la_nina
    to: east_pacific_hurricanes
    effect: -1
    lag_months: [0, 3]
    season: [6, 7, 8, 9, 10, 11]
    confidence: probable
    mechanism: >
      Cooler water and stronger wind shear off Mexico in La Niña years give
      storms less energy and a more hostile environment.
    caveat: >
      Storm counts vary a great deal from year to year for reasons unrelated
      to ENSO.
    sources: [bell_2014]

  - id: la_nina_east_africa_short_rains
    from: enso
    when: la_nina
    to: east_africa_short_rains
    effect: -1
    lag_months: [3, 6]
    season: [10, 11, 12]
    confidence: probable
    mechanism: >
      La Niña tends to cool the western Indian Ocean and strengthen the
      winds that carry moisture away from East Africa, so the short rains
      are weaker or fail.
    caveat: >
      The Indian Ocean Dipole can offset this; a La Niña with a neutral or
      positive Dipole may bring normal rain.
    evidence_note: >
      The 2010–11 La Niña coincided with one of the worst Horn of Africa
      droughts on record, but the statistical link across all La Niña years
      is weaker than for El Niño floods.
    sources: [indeje_2000, nicholson_kim_1997]

  - id: la_nina_southern_africa
    from: enso
