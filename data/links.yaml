    caveat: >
      The Sahel's rainy season responds mainly to the Atlantic and Indian
      Oceans; the La Niña signal is small and inconsistent.
    evidence_note: >
      Several studies find a weak wet lean in La Niña years; others find no
      significant effect. Shown here so the contrast with the better
      supported El Niño link is visible.
    sources: [janicot_1996, nicholson_kim_1997]

  - id: la_nina_northeast_brazil
    from: enso
    when: la_nina
    to: northeast_brazil
    effect: 1
    lag_months: [8, 11]
    season: [2, 3, 4, 5]
    confidence: probable
    mechanism: >
      Rising air over the tropical Atlantic in La Niña lets the Atlantic
      rain belt reach further south into the Nordeste during its
      February–May rainy season.
    caveat: >
      The Atlantic's own north–south temperature contrast frequently decides
      the season regardless of ENSO.
    sources: [ropelewski_halpert_1989, hastenrath_heller_1977]

  - id: la_nina_southeast_south_america
    from: enso
    when: la_nina
    to: southeast_south_america
    effect: -1
    lag_months: [3, 8]
    season: [10, 11, 12, 1]
    confidence: probable
    mechanism: >
      A weaker subtropical jet over South America in La Niña years means
      fewer stalled fronts and less tropical moisture over Uruguay and
      southern Brazil.
    caveat: >
      The dry response is weaker and less consistent than the El Niño wet
      response.
    evidence_note: >
      Grimm and colleagues found the response to be asymmetric: strong and
