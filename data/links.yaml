    mechanism: >
      With the westerly belt spread north, more winter fronts cross the
      southern coast, Victoria and Tasmania and bring their rain with them.
    caveat: >
      A positive dipole or an El Niño in the same year tends to dry the same
      region and can cancel this; in spring the negative phase turns hot and
