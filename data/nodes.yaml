      plus: Dry season tends to be wetter than usual
      zero: Near normal
      minus: Dry season tends to be severe, with raised drought risk
    summary: >
      The small islands of Micronesia depend on rain for fresh water. An El
      Niño tends to bring them extra rain while it develops, but once the
      rain belt swings back the following winter and spring turn very dry,
      and the atolls have run out of water in the wake of the 1982–83,
      1997–98 and 2015–16 events. This is one of the clearest examples of a
      delayed effect on this map.
    sources: [he_barnston_1996, kruk_2015]

  # ---------------------------------------- outcomes added 2026-09-07 (NAO)
  - id: nw_europe_winter_storms
    name: Northwest Europe winter storms
    label: Storm track
    kind: outcome
    lat: 43.5
    lon: -14
    area: [[-25, 62], [10, 62], [10, 47], [-25, 47]]
    region: The British Isles, the North Sea coasts, northern France, the Low Countries
    timescale: November–March
    axis: active_quiet
    labels:
      plus: Winter storms tend to be more frequent and stronger
      zero: Near normal
      minus: Winter storms tend to be fewer, with calmer, blocked weather
    summary: >
      The storms that cross the North Atlantic in winter follow the jet
      stream. When the North Atlantic Oscillation is positive the jet is
      strong and aimed at the British Isles and the North Sea, so gales
      arrive one after another; when it is negative the jet weakens and
      wanders south, and northwest Europe sits under quiet, often frosty,
      high pressure.
    sources: [hurrell_1995, pinto_2009]

  - id: alpine_snow
    name: Alpine snow cover
    label: Alpine snow
    kind: outcome
    lat: 46.5
    lon: 16
    area: [[5, 48], [16, 48], [16, 44], [5, 44]]
    region: The Alps of France, Switzerland, Italy, Austria and Germany
    timescale: December–March
    axis: high_low
    labels:
      plus: Snow tends to be deeper and to last longer, especially at low altitude
      zero: Near normal
      minus: Snow tends to be scarce, especially below about 1,500 metres
    summary: >
      Snow in the Alps depends on winters being both cold and stormy. A
      positive North Atlantic Oscillation brings mild westerly air and high
      pressure over the Alps, so snow is scarce below the tree line even
      when the high peaks do well; a negative one lets cold air and southern
      storms in and tends to bury the valleys.
    sources: [beniston_1997, scherrer_2004]

  - id: western_russia_winter
    name: Western Russia and Siberia winter temperature
    label: Western Russia
    kind: outcome
    lat: 55
    lon: 54
    area: [[30, 66], [90, 66], [90, 50], [30, 50]]
    region: European Russia, the Urals, western Siberia
    timescale: December–March
    axis: warm_cool
    labels:
      plus: Winter tends to be milder than usual
      zero: Near normal
      minus: Winter tends to be colder than usual
    summary: >
      The mild Atlantic air that a positive North Atlantic Oscillation drives
      into Scandinavia does not stop there: it carries on east across
      Russia into Siberia, and winters from Moscow to the Urals tend to be
      several degrees milder. In negative winters the westerlies falter and
      the Siberian cold spreads west instead.
    sources: [hurrell_1995, hurrell_1996, thompson_wallace_1998]

  # ---------------------------------------------------------------- outcomes added with the Southern Annular Mode (M16)
  - id: southwest_australia_winter_rainfall
    name: Southwest Western Australia winter rainfall
    label: SW Australia
    kind: outcome
    lat: -30
    lon: 114
    area: [[113, -28], [122, -28], [122, -35], [115, -35]]
    region: Perth and the southwest corner of Western Australia
    timescale: May–October
    axis: wet_dry
    labels:
      plus: Winter tends to be wetter than usual
      zero: Near normal
      minus: Winter tends to be drier than usual
    summary: >
      The southwest corner of Western Australia gets nearly all its rain from
      winter cold fronts that ride in on the westerlies. When the westerly
      belt sits further south than usual fewer fronts reach the coast, and
      when it spreads north more do. Winter rain here has declined since
      the 1970s; the swing toward a positive Southern Annular Mode explains
      part of that decline, but not all of it.
    sources: [hendon_2007, meneghini_2007, bom_sam]

  - id: patagonia_rainfall
    name: Southern Chile and Patagonia rainfall
    label: Patagonia
    kind: outcome
    lat: -44
    lon: -72
    area: [[-76, -40], [-66, -40], [-66, -54], [-76, -54]]
    region: Southern Chile and Argentine Patagonia, south of about 40°S
    timescale: All year
    axis: wet_dry
    labels:
      plus: Tends to be wetter than usual
      zero: Near normal
      minus: Tends to be drier and warmer than usual
    summary: >
      The westerlies bring rain to the Chilean side of the Andes all year
      round, and the Argentine side sits in their rain shadow. When the belt
      of westerlies tightens toward the pole the region south of 40°S turns
      drier and warmer; when it loosens more fronts arrive. Patagonia's
      warming since the 1970s has been tied to the same shift.
    sources: [gillett_2006, garreaud_2009, thompson_solomon_2002]

  - id: antarctic_peninsula_summer
    name: Antarctic Peninsula summer temperature
    label: Antarctic Peninsula
    kind: outcome
    lat: -66
    lon: -63
    area: [[-70, -62], [-55, -62], [-55, -70], [-70, -70]]
    region: The northern Antarctic Peninsula, especially its eastern side
    timescale: December–February
    axis: warm_cool
    labels:
      plus: Summer tends to be warmer than usual, most of all on the eastern side
      zero: Near normal
      minus: Summer tends to be cooler than usual
    summary: >
      The peninsula is a mountain wall across the westerlies. When they
      strengthen, more mild, moist Pacific air is pushed over the spine and
      descends on the eastern side as a warm, dry foehn wind, where the
      Larsen ice shelves sit. The summer warming of the northeastern
      peninsula since the 1960s, and the break-up of the northern Larsen
      shelves, have been tied to the strengthening westerlies.
    sources: [marshall_2006, thompson_solomon_2002, gillett_2006]

  - id: western_cape_winter_rainfall
    name: Western Cape winter rainfall
    label: Western Cape
    kind: outcome
    lat: -33.5
    lon: 19
    area: [[17, -31], [24, -31], [24, -35], [17, -35]]
    region: Cape Town and the winter-rainfall corner of South Africa
    timescale: June–August, often carrying into spring
    axis: wet_dry
    labels:
      plus: Winter tends to be wetter than usual
      zero: Near normal
      minus: Winter tends to be drier than usual
    summary: >
      Unlike the rest of South Africa, the Cape gets its rain in winter, from
      cold fronts that sweep in off the South Atlantic. When the storm track
      and the South Atlantic high shift south, fewer fronts reach the Cape:
      most of the driest winters since 1948 came with a positive Southern
      Annular Mode, and Cape Town's "Day Zero" drought of 2015–2017 came
      with a poleward shift of the moisture corridor.
    sources: [reason_rouault_2005, sousa_2018]

  # ---------------------------------------------------------------- outcomes added with the Pacific Decadal Oscillation (M17)
  - id: alaska_winter
    name: Alaska winter temperature
    label: Alaska
    kind: outcome
    lat: 62
    lon: -150
    area: [[-168, 71], [-140, 71], [-140, 55], [-168, 55]]
    region: Alaska and the Yukon
    timescale: October–March
    axis: warm_cool
    labels:
      plus: Winter tends to be milder than usual
      zero: Near normal
      minus: Winter tends to be colder than usual
    summary: >
      Alaska's winters follow the Gulf of Alaska. When the water there is
      warm and the Aleutian low is deep, mild Pacific air is pumped north
      over the state; when the water is cool and the low weak, the cold sits.
      Alaska's climate stepped warmer after the Pacific flipped in 1976–77,
      one of the clearest regional marks of the oscillation.
    sources: [mantua_1997, mantua_hare_2002]

  # ---- Atlantic Multidecadal Oscillation outcomes (M18)
  - id: western_europe_summer
    name: Western Europe summer temperature
    label: W Europe
    kind: outcome
    lat: 51
    lon: -16
    area: [[-11, 58], [15, 58], [15, 43], [-11, 43]]
    region: The British Isles, France, the Low Countries and Germany
    timescale: June–August
    axis: warm_cool
    labels:
      plus: Summer tends to be warmer than usual
      zero: Near normal
      minus: Summer tends to be cooler than usual
    summary: >
      Western Europe's summers follow the Atlantic slowly, the way its
      winters follow the NAO quickly. When the ocean is in its warm phase
      the summers tend to be warmer, with more rain in the north-west of
      the continent and less in the south. The shift to warmer summers in
      the mid-1990s came with the Atlantic's swing to warm.
    sources: [sutton_hodson_2005, sutton_dong_2012]

  - id: us_great_plains_summer
    name: US Great Plains summer rainfall
    label: Great Plains
    kind: outcome
    lat: 42
    lon: -106.5
    area: [[-105, 49], [-95, 49], [-95, 30], [-105, 30]]
    region: The central United States, from the Dakotas to Texas
    timescale: May–September, the growing season
    axis: wet_dry
    labels:
      plus: Summer tends to be wetter than usual
      zero: Near normal
      minus: Summer tends to be drier than usual, with drought risk
    summary: >
      The Plains get most of their rain in late spring and summer, from
      moisture carried north out of the Gulf of Mexico. When the North
      Atlantic is warm, less of that moisture reaches inland and summers run
      dry; the great droughts of the 1930s and 1950s fell in warm-Atlantic
      decades, and the wet years of the early twentieth century in a cool
      one.
    sources: [enfield_2001, nigam_2011, mccabe_2004]

  # ---- Atlantic Niño outcomes (M19)
  - id: guinea_coast_rainfall
    name: Gulf of Guinea coast rainfall
    label: Guinea coast
    kind: outcome
    lat: 6
    lon: -3
    area: [[-10, 9], [8, 9], [8, 4], [-10, 4]]
    region: The coast from Liberia to Nigeria, including Côte d'Ivoire and Ghana
    timescale: May–July, the coast's main rainy season
    axis: wet_dry
    labels:
      plus: Tends to be wetter than usual
      zero: Near normal
      minus: Tends to be drier than usual
    summary: >
      The Guinea coast has its main rains in May–July, before the rain belt
      jumps north to the Sahel. Those rains follow the sea just offshore: a
      warm Gulf of Guinea feeds them and holds the rain belt at the coast,
      a cold one starves them. On year-to-year timescales the coast and the
      Sahel do not rise and fall together.
    sources: [wagner_da_silva_1994, lubbecke_2018, polo_2008]

  # ---- Indian Ocean Basin Mode outcomes (M20)
  - id: yangtze_summer_rainfall
    name: Yangtze valley summer rainfall
    label: Yangtze
    kind: outcome
    lat: 32.5
    lon: 107
    area: [[105, 34], [122, 34], [122, 28], [105, 28]]
    region: The Yangtze valley from the Sichuan basin to Shanghai
    timescale: June–August, the Meiyu ("plum rain") season and the summer after it
    axis: wet_dry
    labels:
      plus: Summer rains tend to be heavier than usual
      zero: Near normal
      minus: Summer rains tend to be lighter than usual
    summary: >
      Each June a stationary front settles over the Yangtze valley and
      brings the Meiyu, the "plum rains", that fill the river and the
      paddies. How heavy they are depends on the high-pressure area over
      the western Pacific: when that high is strong and lies far to the
      west, it pumps moist air up the valley and the rains run heavy, as in
      the flood summer of 1998. The summer after an El Niño is the classic
      case, and the warm Indian Ocean the El Niño leaves behind is the
      reason the pattern lasts into summer.
    sources: [xie_2009, xie_2016, zong_chen_2000]

  - id: north_indian_ocean_cyclones
    name: North Indian Ocean cyclones, pre-monsoon season
    label: N Indian Ocean cyclones
    kind: outcome
    lat: 15.5
    lon: 64
    area: [[55, 25], [95, 25], [95, 5], [55, 5]]
    region: The Arabian Sea and the Bay of Bengal
    timescale: April–June, the storm season before the monsoon (a second season follows it in October–November)
    axis: active_quiet
    labels:
      plus: More pre-monsoon storms than usual
      zero: Near normal
      minus: Fewer pre-monsoon storms than usual
    summary: >
      The North Indian Ocean breeds only a handful of cyclones a year, in
      two short seasons either side of the monsoon, but they strike some of
      the most crowded coasts on Earth. The reliable record is short, since
      trustworthy storm counts begin with the satellite era, so the
      year-to-year science rests on few storms. The autumn season is known
      to answer to ENSO; the spring season is less understood, and the
      arrow pointing here is the least certain on this map.
    sources: [evan_camargo_2011, ng_chan_2011, felton_2013]
