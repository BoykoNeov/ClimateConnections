# Nodes: the phenomena on the map.
# Schema: docs/DATA_FORMAT.md. Ids are permanent; change `name`, never `id`.
# Positions are marker positions for the map, not precise scientific regions.
# `area` is a rough outline of the region the node describes, as [lon, lat]
# corners; edges follow straight lines in lon/lat. Illustrative, not a
# scientific boundary.

nodes:
  # ---------------------------------------------------------------- drivers
  # Each phase carries `value` (+1 / 0 / -1): a link into a driver with
  # effect +1 pushes it into its +1 phase, -1 into its -1 phase (M10).
  - id: enso
    name: El Niño–Southern Oscillation (ENSO)
    label: ENSO
    kind: driver
    lat: -2
    lon: -125
    area: [[-175, 8], [-85, 8], [-85, -8], [-175, -8]]
    region: Tropical Pacific Ocean
    timescale: Events every 2–7 years, each lasting about 9–18 months
    summary: >
      A see-saw in ocean temperature and air pressure across the tropical
      Pacific. In El Niño the eastern and central Pacific turn unusually warm
      and the trade winds weaken; in La Niña the same region turns unusually
      cool and the trade winds strengthen. Because the tropical Pacific is so
      large, this shifts where the heaviest tropical rain falls, which in
      turn nudges weather patterns around the whole planet.
    phases:
      - id: el_nino
        value: 1
        label: El Niño
        color: "#d7301f"
        summary: >
          The warm phase. Surface water in the central and eastern tropical
          Pacific is warmer than usual, the trade winds weaken, and the
          heaviest rain moves east from Indonesia toward the central Pacific.
          Events usually begin to develop around May–July, peak in
          November–January, and fade by the following spring.
      - id: neutral
        value: 0
        label: Neutral
        color: "#999999"
        summary: >
          Neither warm nor cool. Tropical Pacific temperatures are close to
          their long-term average and none of the ENSO-related tendencies on
          this map are expected. Other drivers still shape the weather.
      - id: la_nina
        value: -1
        label: La Niña
        color: "#2b8cbe"
        summary: >
          The cool phase. Surface water in the central and eastern tropical
          Pacific is cooler than usual, the trade winds strengthen, and the
          heaviest rain piles up over Indonesia and the western Pacific.
          La Niña often follows an El Niño and can persist for two or three
          winters in a row.
    onset_hint: El Niño and La Niña events usually start to develop between May and July.
    default_start_month: 6
    sources: [noaa_climate_gov_enso, trenberth_1997]

  - id: iod
    name: Indian Ocean Dipole (IOD)
    label: IOD
    kind: driver
    lat: -4
    lon: 70
    area: [[46, 8], [100, 8], [100, -10], [46, -10]]
    region: Tropical Indian Ocean
    timescale: Events every few years, each lasting about 4–8 months
    summary: >
      A see-saw in sea temperature between the two ends of the tropical Indian
      Ocean. In a positive event the water off Sumatra turns unusually cool
      and the water off East Africa unusually warm; the winds along the
      equator swing toward the west and the rain follows them. A negative
      event is the reverse. Events grow through the northern summer, peak
      around September–November and collapse when the monsoon winds reverse
      in December. Positive events often fall in the same year as an El
      Niño, which makes their separate effects hard to untangle.
    onset_hint: Indian Ocean Dipole events usually start to develop between May and July and are over by December.
    default_start_month: 6
    phases:
      - id: positive
        value: 1
        label: Positive IOD
        color: "#e6550d"
        summary: >
          The western Indian Ocean is warmer than usual and the water off
          Sumatra and Java is cooler. Rising air and rain shift toward East
          Africa and away from Indonesia and Australia. Events usually begin
          around May–July, peak in September–November and end by December.
          The strongest recent cases were 1994, 1997, 2006 and 2019.
      - id: neutral
        value: 0
        label: Neutral
        color: "#999999"
        summary: >
          Neither end of the ocean is unusually warm or cool. None of the
          Indian Ocean Dipole tendencies on this map are expected. ENSO and
          other drivers still shape the weather.
      - id: negative
        value: -1
        label: Negative IOD
        color: "#238b45"
        summary: >
          The water off Sumatra is warmer than usual and the western Indian
          Ocean cooler. Rain shifts toward Indonesia and Australia and away
          from East Africa. Negative events are somewhat rarer and weaker
          than positive ones; recent cases include 1998, 2010 and 2016.
    sources: [saji_1999, webster_1999, bom_iod]

  - id: nao
    name: North Atlantic Oscillation (NAO)
    label: NAO
    kind: driver
    lat: 52
    lon: -23
    area: [[-50, 68], [-5, 68], [-5, 32], [-50, 32]]
    region: North Atlantic Ocean, between Iceland and the Azores
    timescale: Swings within weeks; a winter tends to lean one way for months
    summary: >
      A see-saw in air pressure between the low near Iceland and the high
      near the Azores. When both are stronger than usual (positive phase)
      the westerly winds across the Atlantic strengthen and winter storms
      are steered into northern Europe; when both are weaker (negative
      phase) the westerlies slacken, storms head for the Mediterranean, and
      cold air spills from the Arctic over Europe and the eastern United
      States. It matters mostly in winter. Unlike ENSO it is a pattern of
      the atmosphere alone, so it can flip within a week; the map holds one
      phase for the whole timeline, which is a simplification of a winter
      that leans one way on average.
    onset_hint: The North Atlantic Oscillation matters mostly in winter; start in December to see a winter that leans one way.
    default_start_month: 12
    phases:
      - id: positive
        value: 1
        label: Positive NAO
        color: "#7b3294"
        summary: >
          The Icelandic low and the Azores high are both stronger than usual,
          so the westerly winds across the Atlantic are strong and the storm
          track runs toward Scotland and Norway. Winters tend to be mild and
          wet in northern Europe, dry in the Mediterranean, mild in the
          eastern United States and cold in Greenland. Winters that leaned
          strongly positive include 1988–89, 1989–90 and 2014–15.
      - id: neutral
        value: 0
        label: Neutral
        color: "#999999"
        summary: >
          The Atlantic pressure pattern is close to its average and none of
          the North Atlantic Oscillation tendencies on this map are
          expected. ENSO and other drivers still shape the weather.
      - id: negative
        value: -1
        label: Negative NAO
        color: "#008080"
        summary: >
          The Icelandic low and the Azores high are both weak, so the
          westerlies slacken and often buckle into a blocking high near
          Greenland. Storms are steered south into Iberia and the
          Mediterranean, while cold air reaches northern Europe and the
          eastern United States and Greenland turns unusually mild. The
          winter of 2009–10 was the most strongly negative on record.
    sources: [hurrell_1995, hurrell_2003, ncar_nao_guide]

  - id: sam
    name: Southern Annular Mode (SAM)
    label: SAM
    kind: driver
    lat: -58
    lon: 160
    area: [[100, -42], [-140, -42], [-140, -66], [100, -66]]
    region: Southern Ocean, the belt of westerly winds around Antarctica
    timescale: Swings within weeks; a season tends to lean one way for months
    summary: >
      A see-saw in air pressure between Antarctica and the middle latitudes
      near 40°S. In the positive phase pressure is low over Antarctica and
      high in the middle latitudes, and the belt of westerly winds and storms
      that circles the Southern Ocean tightens toward the pole: stronger,
      and further south. In the negative phase the belt loosens and spreads
      toward the equator, and its fronts reach further north into southern
      Australia, New Zealand, southern South America and South Africa. It
      matters in every season, but what it does differs by season. Like the
      North Atlantic Oscillation it is a pattern of the atmosphere alone and
      can flip within a week; the map holds one phase for a year, which is a
      simplification of a season that leans one way. Since the 1970s it has
      leaned positive in summer, largely because of the ozone hole.
    onset_hint: The Southern Annular Mode swings within weeks and matters in every season; start in June to see its winter rain effects first, or in November for the summer ones.
    default_start_month: 6
    phases:
      - id: positive
        value: 1
        label: Positive SAM
        color: "#c51b7d"
        summary: >
          Pressure is lower than usual over Antarctica and higher over the
          middle latitudes, so the westerlies are strong and sit far south.
          Winter cold fronts miss southern Australia and the Cape, southern
          Chile dries, and warm air is pushed over the Antarctic Peninsula in
          summer, while the southern east coast of Australia tends to be
          wetter in summer. Positive summers have become more common since
          the 1980s as the ozone hole cooled the stratosphere over the pole.
      - id: neutral
        value: 0
        label: Neutral
        color: "#999999"
        summary: >
          The westerly belt is close to its usual strength and position and
          none of the Southern Annular Mode tendencies on this map are
          expected. ENSO and the other drivers still shape the weather.
      - id: negative
        value: -1
        label: Negative SAM
        color: "#b8860b"
        summary: >
          Pressure is higher than usual over Antarctica and lower over the
          middle latitudes, so the westerlies weaken and spread toward the
          equator. Cold fronts reach further into southern Australia and the
          Cape in winter, southern Chile is wetter, and in spring and summer
          hot, dry northwesterlies cross eastern Australia. The spring of
          2019, after a rare weakening of the stratospheric polar vortex, was
          the most strongly negative on record.
    sources: [thompson_wallace_2000, marshall_2003, gong_wang_1999, bom_sam]

  - id: pdo
    name: Pacific Decadal Oscillation (PDO)
    label: PDO
    kind: driver
    lat: 42
    lon: -165
    area: [[145, 58], [-125, 58], [-125, 22], [145, 22]]
    region: North Pacific Ocean, north of about 20°N
    timescale: Phases last a decade or more, with swings of a year or two inside them
    summary: >
      The leading pattern of sea-surface temperature in the North Pacific. In
      the positive (warm) phase the water along the North American coast and
      in the Gulf of Alaska is warmer than usual while the central and
      western North Pacific are cool, and the winter low near the Aleutians
      is deep; the negative phase is the reverse. Phases have lasted twenty
      to thirty years, with flips around 1925, 1947 and 1977 and a swing to
      positive in 2014. It is not one thing: much of it is El Niño's
      footprint carried into the North Pacific by the atmosphere, plus the
      ocean's memory from one winter to the next, so its own effects are
      ENSO-like and weaker. The map shows one year inside a phase. What it
      cannot show is the PDO's better-known role: making ENSO's effects on
      North America and Australia stronger in some decades and weaker in
      others.
    onset_hint: The Pacific Decadal Oscillation holds a phase for years, so the year shown is one year inside such a phase; start in November to see its winter effects first.
    default_start_month: 11
    phases:
      - id: positive
        value: 1
        label: Positive PDO
        color: "#fd8d3c"
        summary: >
          Warm water along the coast from California to the Gulf of Alaska,
          cool water in the central North Pacific, and a deep Aleutian low
          in winter. Winters tend to be mild in Alaska and the Pacific
          Northwest and wet in the Southwest, and El Niño's own winter
          pattern over North America tends to come through strongly. The
          warm phase ran from 1977 to the late 1990s and returned in 2014.
      - id: neutral
        value: 0
        label: Neutral
        color: "#999999"
        summary: >
          The North Pacific is close to its average pattern and none of the
          Pacific Decadal Oscillation tendencies on this map are expected.
          ENSO and the other drivers still shape the weather.
      - id: negative
        value: -1
        label: Negative PDO
        color: "#4a1486"
        summary: >
          Cool water along the North American coast, warm water in the
          central North Pacific, and a weak Aleutian low. Winters tend to be
          cold in Alaska and the Pacific Northwest and dry in the Southwest,
          and La Niña's winter pattern tends to come through strongly. The
          cool phase ran from 1947 to 1976 and, less cleanly, from about
          1999 to 2013.
    sources: [mantua_1997, mantua_hare_2002, zhang_wallace_battisti_1997, newman_2016, power_1999, noaa_ncei_pdo]

  - id: amo
    name: Atlantic Multidecadal Oscillation (AMO)
    label: AMO
    kind: driver
    lat: 33
    lon: -40
    area: [[-80, 60], [0, 60], [0, 0], [-80, 0]]
    region: North Atlantic Ocean, from the equator to Greenland
    timescale: Phases last twenty to forty years; a whole cycle runs sixty to eighty years
    summary: >
      A slow warming and cooling of the whole North Atlantic, from the
      tropics to Greenland, by a few tenths of a degree. Warm phases ran
      from about 1860 to 1880, from the 1930s to 1960 and from 1995 on;
      cool phases from 1905 to 1925 and from the mid-1960s to 1994. It is
      the pattern behind the long swings in Sahel rain, in Atlantic
      hurricane activity and in summer weather on both sides of the ocean.
      What drives it is argued over: the slow overturning of the ocean,
      or pollution haze and volcanic dust changing the sunlight the ocean
      receives, or the atmosphere's own noise soaked up by the sea. The
      map shows one year inside a phase.
    onset_hint: The Atlantic Multidecadal Oscillation holds a phase for decades, so the year shown is one year inside such a phase; start in June to see the summer and hurricane-season effects first.
    default_start_month: 6
    phases:
      - id: positive
        value: 1
        label: Positive AMO
        color: "#7f0000"
        summary: >
          The North Atlantic is warmer than usual from the tropics to
          Greenland. The Sahel's rains tend to be stronger, hurricane
          seasons more active, summers on both sides of the ocean warmer
          and the Great Plains drier. The warm phase that began around 1995
          brought the active hurricane era that peaked in 2004 and 2005.
      - id: neutral
        value: 0
        label: Neutral
        color: "#999999"
        summary: >
          The North Atlantic is close to its long-term average and none of
          the Atlantic Multidecadal Oscillation tendencies on this map are
          expected. ENSO and the other drivers still shape the weather.
      - id: negative
        value: -1
        label: Negative AMO
        color: "#5ab4ac"
        summary: >
          The North Atlantic is cooler than usual. The Sahel's rains tend to
          fail, hurricane seasons are quieter and Great Plains summers
          wetter. The cool phase from the mid-1960s to 1994 is the one
          behind the long Sahel drought of the 1970s and 1980s and the
          quiet hurricane decades before 1995.
    sources: [kerr_2000, enfield_2001, knight_2005, schlesinger_ramankutty_1994, booth_2012, clement_2015, noaa_psl_amo]

  - id: atlantic_nino
    name: Atlantic Niño
    label: Atlantic Niño
    kind: driver
    lat: -2
    lon: -6
    area: [[-30, 5], [10, 5], [10, -5], [-30, -5]]
    region: Equatorial Atlantic Ocean, from the Gulf of Guinea west along the equator
    timescale: Events every few years, peaking June–August and lasting three to five months
    summary: >
      The Atlantic's smaller cousin of El Niño. In most years the eastern
      equatorial Atlantic cools sharply in early summer as the trade winds
      push warm water west; in an Atlantic Niño the trades slacken in
      spring, the cooling fails and the water off the Gulf of Guinea runs
      about a degree warm from May to August. An Atlantic Niña is the
      reverse, an unusually strong cold tongue. The events are weaker and
      shorter than the Pacific's, and unlike El Niño they peak in the
      northern summer, right in the West African monsoon season. Since the
      1970s a summer Atlantic Niño has tended to be followed by a Pacific
      La Niña the next winter. The map holds the phase for a year; a real
      event has usually faded by autumn.
    onset_hint: An Atlantic Niño builds in spring and peaks in June–August, then fades by autumn; start in May to watch the Gulf of Guinea coast's rainy season and the Sahel's summer rains.
    default_start_month: 5
    phases:
      - id: warm
        value: 1
        label: Atlantic Niño
        color: "#e7298a"
        summary: >
          The eastern equatorial Atlantic is warmer than usual in early
          summer. The Gulf of Guinea coast tends to be wetter, the Sahel to
          the north drier, the Indian monsoon a little weaker, and the
          Pacific tends to swing toward La Niña by the following winter. The
          event of 1984 was the strongest of its kind on record at the time.
      - id: neutral
        value: 0
        label: Neutral
        color: "#999999"
        summary: >
          The equatorial Atlantic runs its usual seasonal cycle, with the
          cold tongue forming in early summer, and none of the Atlantic Niño
          tendencies on this map are expected.
      - id: cool
        value: -1
        label: Atlantic Niña
        color: "#253494"
        summary: >
          The eastern equatorial Atlantic is colder than usual in early
          summer, with a strong cold tongue. The Gulf of Guinea coast tends
          to be drier, the Sahel wetter, and the Pacific tends to swing
          toward El Niño by the following winter.
    sources: [zebiak_1993, lubbecke_2018, keenlyside_latif_2007, carton_huang_1994]

  - id: indian_ocean_basin
    name: Indian Ocean Basin Mode
    label: Indian Ocean basin
    kind: driver
    lat: -13
    lon: 87
    area: [[40, 15], [100, 15], [100, -15], [40, -15]]
    region: The whole tropical Indian Ocean, from East Africa to Sumatra
    timescale: Follows ENSO, one season behind; peaks February–April and lasts into the summer
    summary: >
      A warming, or cooling, of the whole tropical Indian Ocean at once.
      It is mostly not the Indian Ocean's own doing: in the winter of an El
      Niño the Pacific's changed winds and clouds let the Indian Ocean
      gather heat, and the whole basin runs warm from late winter into the
      following summer, after the El Niño itself has faded. The ocean acts
      like a capacitor, storing the El Niño's signal and releasing it onto
      East Asia the next summer through a strong high-pressure area over
      the western Pacific. After a La Niña the basin cools, though less
      reliably. This is not the Indian Ocean Dipole: the dipole is a
      contrast between the two ends of the ocean in autumn, the basin mode
      is the whole ocean warming together in spring. Most warm years are
      the year after an El Niño, so choosing this driver alone is a way of
      looking at the second half of an El Niño story.
    onset_hint: The basin warms a season after an El Niño begins and peaks in February–April; start in February to watch the East Asian summer that follows.
    default_start_month: 2
    phases:
      - id: warm
        value: 1
        label: Warm basin
        color: "#8c510a"
        summary: >
          The whole tropical Indian Ocean is warmer than usual, typically
          the spring after an El Niño. Rain rises over the warm basin and
          sets up a strong high over the western Pacific: the Yangtze's
          summer rains tend to be heavy, the typhoon season quiet, and the
          Pacific is nudged toward La Niña. The summers of 1983, 1998 and
          2016 followed this pattern.
      - id: neutral
        value: 0
        label: Neutral
        color: "#999999"
        summary: >
          The tropical Indian Ocean is near its usual temperature and none
          of the basin-mode tendencies on this map are expected. ENSO and
          the Indian Ocean Dipole still shape the region's weather.
      - id: cool
        value: -1
        label: Cool basin
        color: "#00acc1"
        summary: >
          The whole tropical Indian Ocean is cooler than usual, typically
          the spring after a La Niña. The western Pacific high tends to be
          weak, the Yangtze's summer rains lighter and the typhoon season
          busier. The cooling after a La Niña is weaker and less reliable
          than the warming after an El Niño, so fewer links are drawn.
    sources: [klein_1999, xie_2009, xie_2016, du_2009, chowdary_gnanaseelan_2007]
  # ---------------------------------------------------------------- outcomes
  - id: indian_summer_monsoon
    name: Indian summer monsoon
    label: Indian monsoon
    kind: outcome
    lat: 21
    lon: 78
    area: [[68, 24], [72, 34], [80, 31], [89, 28], [92, 22], [88, 20], [80, 12], [77, 7], [72, 15]]
    region: India
    timescale: June–September each year
    axis: wet_dry
    labels:
      plus: Monsoon tends to be stronger than usual
      zero: Monsoon near normal
      minus: Monsoon tends to be weaker than usual
    summary: >
      The rains that fall on the Indian subcontinent from June to September
      supply most of the year's water for over a billion people. Their
      strength varies from year to year, and ENSO is the single largest known
      influence on that variation.
    sources: [rasmusson_carpenter_1983, kumar_1999]

  - id: indonesia_rainfall
    name: Indonesia and the Maritime Continent
    label: Indonesia
    kind: outcome
    lat: -2
    lon: 115
    area: [[95, 7], [150, 7], [150, -11], [95, -11]]
    region: Indonesia, Malaysia, Papua New Guinea
    timescale: Dry season roughly June–October
    axis: wet_dry
    labels:
      plus: Tends to be wetter than usual
      zero: Near normal
      minus: Tends to be drier than usual, with raised wildfire risk
    summary: >
      The islands between the Indian and Pacific Oceans normally sit under
      the wettest air on Earth. When ENSO shifts that rain eastward, the dry
      season here lengthens and peatland fires can spread; when it shifts
      back west, floods become more likely.
    sources: [ropelewski_halpert_1987, field_2009]

  - id: east_australia_rainfall
    name: Eastern Australia rainfall
    label: Eastern Australia
    kind: outcome
    lat: -28
    lon: 148
    area: [[138, -10], [155, -10], [155, -39], [140, -39]]
    region: Queensland, New South Wales, Victoria
    timescale: Winter and spring (June–November) most affected
    axis: wet_dry
    labels:
      plus: Tends to be wetter than usual, with raised flood risk
      zero: Near normal
      minus: Tends to be drier than usual, with raised drought and fire risk
    summary: >
      Eastern Australia's rainfall is strongly tied to the tropical Pacific.
      Many of the country's worst droughts and some of its biggest floods
      coincided with El Niño and La Niña respectively.
    sources: [bom_enso_australia, ropelewski_halpert_1987]

  - id: peru_coast_rainfall
    name: Coastal Peru and Ecuador rainfall
    label: Peru coast rain
    kind: outcome
    lat: -3.5
    lon: -80
    area: [[-82, 2], [-78, 2], [-78, -8], [-82, -8]]
    region: Northern Peru, southern Ecuador
    timescale: December–April of the year after an event begins
    axis: wet_dry
    labels:
      plus: Tends to be much wetter than usual, with flooding
      zero: Near normal
      minus: Tends to be drier than usual
    summary: >
      Normally one of the driest coastlines in the world. When the ocean
      just offshore warms in El Niño, thunderstorms form over the desert
      and rivers that are usually dry can flood towns.
    sources: [ropelewski_halpert_1987, lagos_2008]

  - id: peru_fishery
    name: Peruvian anchoveta fishery
    label: Peru fishery
    kind: outcome
    lat: -12
    lon: -79
    area: [[-84, -4], [-79, -4], [-72, -18], [-78, -20]]
    region: Humboldt Current, offshore Peru
    timescale: Months to a year
    axis: active_quiet
    labels:
      plus: Fishery tends to be more productive than usual
      zero: Near normal
      minus: Fishery tends to collapse as nutrient-rich upwelling shuts down
    summary: >
      Cold, nutrient-rich water rising along the Peruvian coast feeds the
      largest single-species fishery on Earth. El Niño caps that upwelling
      with warm water, and the fish disappear; the 1972 collapse is the
      classic example.
    sources: [barber_chavez_1983]

  - id: us_gulf_coast_winter
    name: US Gulf Coast and Florida winter rainfall
    label: US Gulf Coast
    kind: outcome
    lat: 30
    lon: -88
    area: [[-100, 33], [-80, 33], [-80, 25], [-98, 25]]
    region: Texas to Florida
    timescale: November–March
    axis: wet_dry
    labels:
      plus: Tends to be wetter and stormier than usual
      zero: Near normal
      minus: Tends to be drier than usual
    summary: >
      In winter the jet stream over North America shifts with ENSO. A
      stronger, more southerly storm track brings extra rain to the Gulf
      Coast and Florida in El Niño years and starves them in La Niña years.
    sources: [ropelewski_halpert_1986, noaa_cpc_north_america]

  - id: california_winter
    name: California winter rainfall
    label: California
    kind: outcome
    lat: 36
    lon: -120
    area: [[-125, 42], [-120, 42], [-114, 32.5], [-118, 32.5], [-124, 38]]
    region: California
    timescale: December–March
    axis: wet_dry
    labels:
      plus: Tends to be wetter than usual
      zero: Near normal
      minus: Tends to be drier than usual
    summary: >
      California's link to ENSO is popular in the news but weaker than
      people expect. Strong El Niño events have brought very wet winters to
      southern California, yet several El Niño winters have been dry, and
      northern California shows little consistent signal.
    sources: [jong_2016]

  - id: pacific_northwest_winter
    name: Pacific Northwest winter temperature
    label: Pacific Northwest
    kind: outcome
    lat: 48
    lon: -122
    area: [[-130, 54], [-114, 54], [-114, 42], [-125, 42]]
    region: Washington, Oregon, British Columbia
    timescale: December–February
    axis: warm_cool
    labels:
      plus: Tends to be milder and drier than usual
      zero: Near normal
      minus: Tends to be cooler and wetter than usual, with more mountain snow
    summary: >
      The same jet-stream shift that wets the southern United States in El
      Niño years steers storms away from the Northwest and lets mild Pacific
      air dominate. La Niña winters do the opposite and are prized by ski
      resorts.
    sources: [halpert_ropelewski_1992, noaa_cpc_north_america]

  - id: atlantic_hurricanes
    name: Atlantic hurricane season
    label: Atlantic hurricanes
    kind: outcome
    lat: 15
    lon: -50
    area: [[-90, 30], [-20, 30], [-20, 8], [-90, 8]]
    region: Tropical North Atlantic and Caribbean
    timescale: June–November
    axis: active_quiet
    labels:
      plus: Season tends to be more active than usual
      zero: Near normal activity
      minus: Season tends to be quieter than usual
    summary: >
      Hurricanes need calm upper-level winds to grow. El Niño strengthens the
      high-altitude winds over the Atlantic, shearing storms apart; La Niña
      relaxes them. This is one of the most reliable ENSO effects known.
    sources: [gray_1984, bell_2014]

  - id: east_pacific_hurricanes
    name: Eastern Pacific hurricane season
    label: E. Pacific hurricanes
    kind: outcome
    lat: 14
    lon: -110
    area: [[-125, 25], [-95, 25], [-90, 8], [-125, 8]]
    region: Off the Pacific coast of Mexico
    timescale: May–November
    axis: active_quiet
