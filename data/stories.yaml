# Guided walkthroughs. Each story fixes a scenario (driver phase + start
# month) and walks the timeline in steps. Every step names the node to
# highlight, the month index to jump to, and a short plain-language text with
# at least one source from the `sources` list in links.yaml.
#
# The validator checks that every focus node is actually affected by the
# scenario at that month (or is the driver itself), so a story can never
# point at a hollow marker and claim something is happening there.
#
# Historical facts in the text are illustrations of the map's tendencies.
# Where the real event broke the pattern, say so; that is the teaching point.

stories:
  - id: el_nino_1997_98
    title: "The 1997–98 El Niño"
    intro: >
      The strongest El Niño of the twentieth century. Follow it month by month
      and compare what the map expects with what actually happened, including
      the places where the real event broke the pattern.
    driver: enso
    phase: el_nino
    start_month: 5
    start_year: 1997
    steps:
      - month: 0
        focus: enso
        text: >
          In spring 1997 the trade winds along the equator weakened and warm
          water spread east across the Pacific. By May the sea surface off
          Peru was already far warmer than normal, and by the end of the year
          the warming was the largest ever measured. Everything that follows
          on this map starts from this one change.
        sources: [mcphaden_1999]

      - month: 2
        focus: indonesia_rainfall
        text: >
          With the warm water and the rising air moved east, Indonesia sat
          under sinking, dry air. The rains failed across much of the region.
          Fires lit to clear land burned out of control in the dried-out peat
          and forest, and smoke haze covered Southeast Asia for months.
        sources: [field_2009]

      - month: 3
        focus: atlantic_hurricanes
        text: >
          Strong winds high over the Atlantic, set up by El Niño, tore
          developing storms apart. The 1997 Atlantic hurricane season was well
          below average, with fewer storms than usual and not a single named
          storm during August, normally the start of the peak season.
        sources: [bell_2014, gray_1984]

      - month: 4
        focus: indian_summer_monsoon
        text: >
          Here the pattern broke. A strong El Niño usually means a weak Indian
          monsoon, and 1997 was expected to bring drought. Instead, monsoon
          rain over India came in close to normal. Scientists have offered
          several explanations, including where in the Pacific the warmest
          water sat. The map shows the tendency, not what happened this time.
        sources: [kumar_1999]

      - month: 5
        focus: east_australia_rainfall
        text: >
          Eastern Australia was drier than usual through the second half of
          1997, as expected, though the drought was less severe than in the
          big El Niño of 1982–83. Australian forecasters point to 1997 as a
          reminder that a strong event in the Pacific does not guarantee a
          strong effect on land.
        sources: [bom_enso_australia]

      - month: 6
        focus: east_africa_short_rains
        text: >
          In East Africa the effect ran the other way. Warm water also spread
          across the western Indian Ocean, and the October–December "short
          rains" turned into months of extreme rainfall. Kenya, Somalia and
          Ethiopia saw some of the worst flooding on record, with roads and
          villages washed away.
        sources: [indeje_2000]

      - month: 7
        focus: global_mean_temperature
        text: >
          December 1997 was the peak. Heat stored in the tropical Pacific was
          being released to the atmosphere, and with it the whole planet
          warmed. 1998 became the warmest year in the instrumental record at
          the time: an El Niño spike on top of the long-term warming trend.
        sources: [trenberth_2002]

      - month: 8
        focus: peru_fishery
        text: >
          Off Peru the warm water sat like a lid on the ocean, shutting off
          the cold, nutrient-rich water that normally rises from below.
          Plankton dwindled, the anchoveta moved away or died, and the catch
          collapsed, as it had in the 1982–83 event.
        sources: [barber_chavez_1983]

      - month: 9
        focus: peru_coast_rainfall
        text: >
          The normally bone-dry coast of Peru and Ecuador had a summer of
          torrential rain. Rivers that are usually dry flooded, mudslides cut
          the Pan-American Highway, and thousands of homes were destroyed.
          This is one of the most reliable El Niño effects, and 1997–98 was
          among the wettest cases.
        sources: [lagos_2008]

      - month: 9
        focus: california_winter
        text: >
          California's link to El Niño is marked as contested on this map,
          because in many events little happens. 1997–98 was the exception
          that made the link famous: a string of winter storms brought heavy
          rain, floods and coastal damage. Studies since then suggest the
          effect is real mainly in the strongest events.
        sources: [jong_2016]

      - month: 10
        focus: coral_bleaching_central_pacific
        text: >
          Months of unusually warm water pushed corals past their limit. 1998
          saw the first mass coral bleaching recorded across the whole
          tropics, with severe reef death in the Indian Ocean and parts of the
          Pacific.
        sources: [eakin_2019]

      - month: 12
        focus: enso
        text: >
          By May 1998 the warm water was gone, and the Pacific swung quickly
          into a La Niña that lasted into 2000. The twelve months of this map
          are a snapshot of the classic El Niño year; the return swing is the
          next story.
        sources: [mcphaden_1999]

  - id: la_nina_southern_hemisphere
    title: "A La Niña year in the Southern Hemisphere"
    intro: >
      La Niña is the cool sister of El Niño, and many of its effects are the
      mirror image. This walkthrough follows a typical La Niña year south of
      the equator, where the effects are among the strongest, and stops at the
      places where the mirror does not quite hold.
    driver: enso
    phase: la_nina
    start_month: 6
    steps:
      - month: 0
        focus: enso
        text: >
          The trade winds strengthen, piling warm water up in the far western
          Pacific and drawing cold, deep water to the surface off South
          America. Rising air and rain concentrate over Indonesia and northern
          Australia. Notice that some places with a solid El Niño arrow get a
          dashed La Niña arrow: the science is less symmetric than the names
          suggest.
        sources: [noaa_climate_gov_enso]

      - month: 1
        focus: indonesia_rainfall
        text: >
          With the warm pool close by, Indonesia and the Maritime Continent get
          more rain than usual from the very start of the event. Flooding is
          the typical hazard, the opposite of the El Niño fire season.
        sources: [ropelewski_halpert_1989]

      - month: 2
        focus: east_australia_rainfall
        text: >
          Eastern Australia is the textbook La Niña region: wetter winters and
          springs, more tropical cyclones, higher flood risk. The 2010–11 La
          Niña brought one of the wettest springs on record and widespread
          flooding in Queensland, including the city of Brisbane.
        sources: [bom_enso_australia, bom_scs24]

      - month: 3
        focus: central_chile_winter
        text: >
          On the other side of the Pacific, central Chile tends to have a dry
          winter. The storm track that would bring rain to Santiago stays
          further south. The link is rated probable: it shows up in most, not
          all, La Niña winters.
        sources: [montecinos_aceituno_2003]

      - month: 4
        focus: east_africa_short_rains
        text: >
          Near the equator in East Africa the October–December "short rains"
          tend to fail. The 2010–11 La Niña coincided with severe drought in
          Somalia and northern Kenya, though that drought had other causes as
          well. The map shows one contributing tendency, not the whole
          explanation.
        sources: [indeje_2000]

      - month: 5
        focus: southeast_south_america
        text: >
          Spring in Uruguay, southern Brazil and the Argentine pampas tends to
          be drier during La Niña, the reverse of the El Niño floods. Farmers
          in the region watch the Pacific closely for exactly this reason.
        sources: [grimm_2000]

      - month: 7
        focus: southern_africa_summer
        text: >
          The summer rainy season over South Africa, Zimbabwe and Mozambique
          tends to be wetter than normal, sometimes with damaging floods. The
          effect is rated probable: the Indian Ocean has a say too, and the
          relationship has not held in every event.
        sources: [lindesay_1988]

      - month: 8
        focus: peru_coast_rainfall
        text: >
          The coast of Peru and Ecuador stays cool and dry, its usual state
          made a little stronger. Where El Niño brought floods, La Niña brings
          nothing unusual to the desert, which is why this link is drawn as
          probable rather than established: the change is subtle.
        sources: [lagos_2008]

      - month: 8
        focus: peru_fishery
        text: >
          Offshore, the stronger upwelling of cold, nutrient-rich water feeds
          one of the richest fisheries on Earth. Anchoveta catches tend to be
          good in La Niña years, though fishing quotas and the stock's own
          history matter as much as the ocean does.
        sources: [barber_chavez_1983]

      - month: 9
        focus: northeast_brazil
        text: >
          The rainy season in Northeast Brazil, February to May, tends to be
          wetter. This is one of the longest-lagged links on the map: the
          effect arrives most of a year after the Pacific first cooled.
        sources: [hastenrath_heller_1977]

      - month: 10
        focus: global_mean_temperature
        text: >
          With the Pacific storing heat rather than releasing it, the whole
          planet runs slightly cooler for a year or so. The strong 2010–11 La
          Niña was even measurable in sea level: so much rain fell on land,
          especially in Australia, that global sea level briefly dropped.
        sources: [boening_2012, trenberth_2002]

      - month: 12
        focus: enso
        text: >
          La Niña events often last longer than El Niño and frequently return
          for a second year, so the twelve months shown here can repeat.
          Markers that stay hollow in this scenario have no La Niña link in
          the literature collected here. That is a real gap, not an oversight.
        sources: [noaa_climate_gov_enso]

  - id: positive_iod_2019
    title: "The 2019 positive Indian Ocean Dipole"
    intro: >
      One of the strongest Indian Ocean Dipole events on record, and a rare
      one: the Pacific stayed close to neutral, so this year shows the Indian
      Ocean acting largely on its own. Follow it from the dry season in
      Indonesia to floods in East Africa and the run-up to Australia's Black
      Summer fires.
    driver: iod
    phase: positive
    start_month: 6
    start_year: 2019
    steps:
      - month: 0
        focus: iod
        text: >
          By June 2019 the sea off Sumatra was cooling while the western
          Indian Ocean warmed, and the difference between the two kept
          growing until October, when it reached the largest value since
          1997. With El Niño absent, forecasters watched the Indian Ocean as
          the main driver of the second half of the year.
        sources: [doi_2020]

      - month: 2
        focus: indonesia_rainfall
        text: >
          With cool water off Sumatra, the dry season deepened and dragged on.
          Fires lit to clear land spread through peat and forest in Sumatra
          and Borneo through August and September, and haze closed schools
          and airports in Indonesia, Malaysia and Singapore. It was the worst
          fire season since the El Niño year of 2015.
        sources: [pan_2018, doi_2020]

      - month: 3
        focus: indian_summer_monsoon
        text: >
          The link to the Indian summer monsoon is marked contested, and 2019
          shows why it is on the map at all. After a slow start the monsoon
          finished well above normal, with an unusually wet September. The
          Indian Ocean is one of several explanations offered; the map shows
          a tendency that the science has not settled.
        sources: [ashok_2001]

      - month: 3
        focus: southeast_australia_rainfall
        text: >
          Across southern Australia the winter rains fell short, and spring
          was drier still. The Murray–Darling basin was already deep in a
          multi-year drought, and forests from Queensland to Victoria dried
          out. This is the textbook positive-dipole footprint, and 2019 was
          among the clearest cases on record.
        sources: [bom_iod, wang_cai_2020]

      - month: 4
        focus: east_africa_short_rains
        text: >
          In East Africa the short rains arrived early and heavy. From
          October to December floods and landslides struck Kenya, Somalia,
          Ethiopia and South Sudan, displacing hundreds of thousands of
          people. The unusually wet ground then let desert locusts breed in
          numbers not seen for decades.
        sources: [wainwright_2021]

      - month: 5
        focus: south_india_northeast_monsoon
        text: >
          Southern India and Sri Lanka had a wet end to the year, in line
          with the map's tendency for the northeast monsoon. The link is
          rated probable: it appears in most strong events but the Pacific
          also has a say in this season.
        sources: [kripalani_kumar_2004]

      - month: 6
        focus: iod
        text: >
          In December the monsoon winds reversed and the event collapsed
          within weeks. The Indian Ocean's own push was over, but the dried
          landscape it left behind in Australia burned on into January in the
          Black Summer fires. The map stops where the driver's influence
          stops; what came next was the legacy of a dry year.
        sources: [doi_2020, wang_cai_2020]

  - id: negative_nao_2009_10
    title: "The winter of 2009–10: a record negative NAO"
    intro: >
      The most strongly negative North Atlantic Oscillation winter since
      records began in the 1820s. Follow it from a frozen Britain to
      record snow in Washington, floods in southern Spain and a mild
      Greenland, and see why one winter is never the work of one driver
      alone: an El Niño was under way in the Pacific at the same time.
    driver: nao
    phase: negative
    start_month: 12
    start_year: 2009
    steps:
      - month: 0
        focus: nao
        text: >
          In December 2009 the pressure difference between Iceland and the
          Azores collapsed and stayed collapsed. Averaged over December to
          February it was the lowest in a record going back to 1823. A high
          pressure "block" parked itself near Greenland and the mild
          westerlies that normally cross the Atlantic in winter stopped
          arriving.
        sources: [osborn_2011, cattiaux_2010]

      - month: 0
        focus: northern_europe_winter
        text: >
          Snow fell across Britain, Germany and Poland from mid-December and
          the cold held on into February. The winter was the coldest in the
          UK since 1978–79. One study made a point that belongs on this map:
          given how weak the westerlies were, the winter was actually milder
          than the same pattern would have produced fifty years earlier.
          The tendency was textbook; the warming climate changed the
          baseline it acted on.
        sources: [cattiaux_2010, osborn_2011]

      - month: 1
        focus: mediterranean_winter_rainfall
        text: >
          With the storm track pushed south, Atlantic depressions ran into
          Portugal and Spain one after another. December to February was
          the wettest winter in southern Iberia for decades; the
          Guadalquivir flooded, and reservoirs that had been low for years
          filled in a season. This is the wet side of the seesaw that dries
          Iberia in positive winters.
        sources: [vicente_serrano_2011, trigo_2004]

      - month: 2
        focus: eastern_north_america_winter
        text: >
          In February 2010 back-to-back snowstorms buried Washington,
          Baltimore and Philadelphia, breaking seasonal snowfall records.
          The negative NAO steered the cold air south, but a study of the
          winter credits the El Niño in the Pacific with supplying the
          moisture. Two drivers, one snowstorm: the map shows them one at a
          time, so switch to ENSO and El Niño to see the other half.
        sources: [seager_2010]

      - month: 2
        focus: greenland_winter
        text: >
          While Europe and the eastern United States shivered, west
          Greenland and the Canadian Arctic had a remarkably mild winter,
          with temperatures far above normal for the season. That is the
          Greenland–Europe seesaw noticed two centuries ago, and it is the
          clearest sign that the whole pattern is one thing, not a set of
          separate cold snaps.
        sources: [osborn_2011, seager_2010, van_loon_rogers_1978]

      - month: 3
        focus: nao
        text: >
          The pattern stayed negative into March and eased in spring. The
          following winter, 2010–11, opened with another strongly negative
          December, and then the index swung positive: this driver keeps
          no calendar. A run of negative winters says little about the next
          one, which is why the map calls its timescale "weeks to months".
        sources: [osborn_2011, hurrell_2003]

  - id: el_nino_1997_indian_ocean
    title: "1997: El Niño sets off the Indian Ocean Dipole"
    intro: >
      The same El Niño as the first story, seen from the Indian Ocean. Here
      the map follows a chain: El Niño pushes the Indian Ocean Dipole into
      its positive phase, and the dipole's own effects then join El Niño's.
      Turn "Follow links through other drivers" off to see the map without
      the chain. As before, the places where 1997 broke the pattern are the
      teaching points.
    driver: enso
    phase: el_nino
    start_month: 5
    start_year: 1997
    steps:
      - month: 0
        focus: enso
        text: >
          By May 1997 the central and eastern Pacific were warming fast and
          the trade winds had slackened. On this map that single change is
          the start of everything else, including, one hop away, a change
          in the ocean next door.
        sources: [mcphaden_1999]

      - month: 1
        focus: iod
        text: >
          As the rising air over Indonesia weakened, the winds along the
          equatorial Indian Ocean swung toward the west and cool water rose
          off Sumatra. The dipole marker turns orange: the map now treats the
          Indian Ocean as a second driver, set off by El Niño, and follows
          its links one confidence step lower. In 1997 the dipole began
          unusually early and grew into the strongest on record.
        sources: [webster_1999, annamalai_2003]

      - month: 3
        focus: indonesia_rainfall
        text: >
          Two arrows now reach Indonesia: El Niño's directly, and the
          dipole's through the chain. Both push the same way, toward drought,
          and the map keeps the state at "drier". The 1997 dry season was
          one of the harshest on record and the peat and forest fires that
          followed covered Southeast Asia in haze for months.
        sources: [field_2009, saji_1999]

      - month: 4
        focus: southeast_australia_rainfall
        text: >
          This marker has no El Niño link of its own; it is lit only through
          the dipole. With the chain switched off it stays hollow. Cool
          water off Sumatra means less moisture feeding the fronts that
          bring winter and spring rain to Victoria and South Australia, and
          the second half of 1997 was dry across much of the southeast.
        sources: [ummenhofer_2009, cai_2011]

      - month: 5
        focus: east_africa_short_rains
        text: >
          Two pushes in the same direction again. El Niño and the warm
          western Indian Ocean both feed the October to December short
          rains, and in 1997 they came as floods: the heaviest rain in
          decades across Kenya, Somalia and Ethiopia, with rivers over their
          banks from October into early 1998.
        sources: [black_2003, webster_1999]

      - month: 6
        focus: iod
        text: >
          November 1997 was the dipole's peak. On the map its link from El
          Niño runs only from June to November, because the dipole cannot
          survive the reversal of the monsoon winds in December; step one
          month on and the dipole drops back to grey while El Niño carries
          on. Real events do end this way: the 1997 dipole collapsed in
          December.
        sources: [webster_1999, saji_1999]

      - month: 8
        focus: nao
        text: >
          Here the chain broke. In a moderate El Niño winter the map expects
          the Atlantic pressure pattern to lean negative from January, with
          a cold northern Europe behind it. The winter of 1997-98 did not
          oblige: the pattern stayed positive and Europe was mild. Studies
          since suggest that the very strongest El Niños disturb the
          atmosphere in a different way from moderate ones, which is why the
          link is drawn dashed and rated only probable.
        sources: [toniazzo_scaife_2006, bronnimann_2007]

      - month: 12
        focus: enso
        text: >
          By May 1998 the warm water was gone and the Pacific tipped into a
          La Niña that lasted into 2000. On this map La Niña has its own
          link to the dipole, pushing it negative, and 1998 did bring a
          negative dipole. Whether the dipole in turn helps set up the next
          El Niño is the contested feedback listed on the ENSO card; it is
          told in words, not drawn, because the map never lets an effect
          loop back onto the driver you chose.
        sources: [mcphaden_1999, stuecker_2017, izumo_2010]

  - id: la_nina_negative_iod_2010_11
    title: "2010–11: La Niña and a negative dipole together"
    intro: >
      The first story with two drivers chosen by hand. In 2010 a strong La
      Niña coincided with a negative Indian Ocean Dipole, and the two pushed
      many of the same places the same way. Here the dipole is not set off
      by a link from La Niña; you choose both phases, both hold all year,
      and the map adds their effects up. Where two chosen drivers push a
      place opposite ways the marker turns hatched and its card says
      "conflicting"; try swapping the dipole to positive to see that.
    driver: enso
    phase: la_nina
    drivers:
      - driver: iod
        phase: negative
    start_month: 6
    start_year: 2010
    steps:
      - month: 0
        focus: enso
        text: >
          By June 2010 the El Niño of the previous winter had collapsed and
          the Pacific was swinging into La Niña, which by the end of the
          year was among the strongest on record. Two driver markers are lit
          from the start: La Niña here, and a negative dipole in the Indian
          Ocean, both chosen by hand rather than one set off by the other.
        sources: [boening_2012, bom_scs24]

      - month: 1
        focus: iod
        text: >
          The dipole marker is green with a plain white ring, not the dashed
          ring of a driver pushed by a link. Its links fire at full
          confidence and its phase holds for the whole year. La Niña's own
          link into the dipole is not drawn: a chosen driver is never
          pushed, because you have already decided its phase. In 2010 the
          water off Sumatra ran warm from winter into spring, the reverse
          of 1997.
        sources: [bom_iod, ummenhofer_2009]

      - month: 3
        focus: southeast_australia_rainfall
        text: >
          This marker has no La Niña link of its own, so it shows what the
          second driver adds: a warm eastern Indian Ocean feeds moisture
          into the fronts that cross Victoria and South Australia in winter
          and spring. Spring 2010 was Australia's wettest on record, and
          the southeast's long drought ended in mud.
        sources: [bom_scs24, ummenhofer_2009]

      - month: 5
        focus: east_africa_short_rains
        text: >
          Two arrows, both pointing the same way. La Niña and a negative
          dipole each tend to weaken the October to December short rains,
          and the map keeps the state at "drier" without a conflict flag.
          The 2010 short rains largely failed across Somalia, Kenya and
          Ethiopia; when the long rains of 2011 failed too, famine followed
          in southern Somalia.
        sources: [dutra_2013, behera_2005]

      - month: 7
        focus: east_australia_rainfall
        text: >
          Only La Niña's arrow reaches Queensland and New South Wales: the
          dipole's link runs to the southeast and is out of season by
          January. That one arrow was enough. Repeated heavy rain from
          November onward filled the catchments, and in January 2011 floods
          reached Brisbane and much of southern Queensland.
        sources: [bom_scs24, cai_2011]

      - month: 8
        focus: iod
        text: >
          The dipole marker is still green because the map holds a chosen
          phase for all twelve months. Real dipoles do not: the 2010 event
          faded in early summer as the monsoon winds reversed, and by now
          every dipole arrow is drawn faint, out of season. Choosing two
          phases is a teaching convenience, not a claim that both patterns
          lasted a year.
        sources: [bom_iod, saji_1999]

      - month: 12
        focus: enso
        text: >
          La Niña weakened through autumn 2011 and the Pacific was back to
          neutral by June, before a second, weaker La Niña formed late in
          the year. So much rain fell on land in 2010 and 2011 that global
          sea level dropped for a while; the study that found this called
          the event "so strong, the oceans fell".
        sources: [boening_2012, noaa_climate_gov_enso]

  # ---- M15: the second driver begins before the first
  - id: negative_iod_then_la_nina_2016
    title: "2016: a negative dipole first, then a weak La Niña"
    intro: >
      The first story where the second driver comes first. In 2016 a negative
      Indian Ocean Dipole formed in May, months before the Pacific cooled
      into a weak La Niña in the spring. The year shown begins in September
      with La Niña; the dipole is set to begin "before the first driver", so
      it is already in its phase at month 0 and its lags are counted from
      May. Watch East Africa: the dipole's arrow arrives before La Niña's,
      because its clock started earlier.
    driver: enso
    phase: la_nina
    drivers:
      - driver: iod
        phase: negative
        start_month: 5
        starts_before: true
    start_month: 9
    start_year: 2016
    steps:
      - month: 0
        focus: iod
        text: >
          Green from the very first frame. The dipole developed from May 2016,
          matured in July to September and was the strongest negative event in
          sixty years of records: warm water off Sumatra, cool water off
          Africa. On the timeline it is already four months old at month 0;
          the hollow dot on the season dial marks May as already past, and
          the first tick carries a small arrow to say the same.
        sources: [lim_hendon_2017, bom_iod]

      - month: 0
        focus: southeast_australia_rainfall
        text: >
          The dipole's link to Victoria and South Australia has no lag, so
          this marker is wet at month 0 rather than lighting up later in the
          year. Much of Australia was extremely wet from May 2016 onward,
          well before the Pacific had cooled: the dipole did this on its own,
          with La Niña nowhere in sight.
        sources: [lim_hendon_2017, ummenhofer_2009]

      - month: 1
        focus: indonesia_rainfall
        text: >
          Two arrows, pointing the same way: a warm eastern Indian Ocean and
          a cooling Pacific both feed rain into Indonesia. In 2016 the
          dipole's share came first, from May, and the usual dry season
          largely failed to arrive. La Niña's arrow, counted from September,
          is here from month 0 as well, because its own lag is zero.
        sources: [lim_hendon_2017, pan_2018]

      - month: 1
        focus: east_africa_short_rains
        text: >
          Here is the point of starting the dipole early. Its link to the
          short rains needs three months, and that clock started in May, so
          the arrow arrives in October, just as the short rains begin. La
          Niña's link needs three months too, counted from September, so La
          Niña's arrow is still missing. Had the dipole begun in September
          with La Niña, this marker would be hollow now.
        sources: [behera_2005, black_2003]

      - month: 2
        focus: enso
        text: >
          The Pacific cooled slowly after the huge 2015–16 El Niño. NOAA's
          index only reached the La Niña threshold in the September to
          November season, and the event stayed weak. Lim and Hendon argue
          the dipole helped it along by strengthening the easterly winds over
          the Pacific. That same-season push has no link on this map; the
          map's dipole-to-Pacific link is the contested one about the
          following year, and it is skipped anyway because you chose La Niña
          by hand.
        sources: [noaa_cpc_oni, lim_hendon_2017]

      - month: 3
        focus: east_africa_short_rains
        text: >
          Now both arrows are in, pointing the same way, and the marker stays
          "drier" without a conflict flag. The 2016 short rains failed across
          Kenya and Somalia and a severe drought followed. An attribution
          study found that La Niña conditions, and the sea surface
          temperatures that went with them, made the failure more likely,
          with no clear sign of a climate-change effect on the rain itself.
        sources: [uhe_2018, behera_2005]

      - month: 6
        focus: iod
        text: >
          Still green, ten months on. A chosen phase holds until the end of
          the year shown, and this one started before it, so the card counts
          how long it has been held. The real dipole broke down in late 2016
          as the monsoon winds reversed. Every dipole arrow is faint now, out
          of season; the marker is a teaching convenience, not a claim.
        sources: [bom_iod, lim_hendon_2017]

      - month: 12
        focus: enso
        text: >
          La Niña faded almost as soon as it was declared: the index was back
          near neutral by early 2017, and by this September the Pacific was
          neutral again, leaning toward La Niña once more late in the year.
          The dipole marker has now held one phase for sixteen months, which
          is why its card warns that real events do not last that long.
        sources: [noaa_cpc_oni, noaa_climate_gov_enso]

  - id: negative_sam_2019_black_summer
    title: "2019: a broken polar vortex, a negative SAM and the Black Summer"
    intro: >
      In late August 2019 the stratospheric polar vortex over Antarctica
      weakened suddenly, something seen only once before, in 2002. Through
      October the effect worked its way down to the surface and swung the
      Southern Annular Mode to its most negative on record. A positive Indian
      Ocean Dipole had already been drying Australia since the winter. The
      year shown begins in November 2019 with the mode negative; the dipole
      is set to begin "before the first driver", in June. Watch eastern
      Australia, where the two arrows point the same way.
    driver: sam
    phase: negative
    drivers:
      - driver: iod
        phase: positive
        start_month: 6
        starts_before: true
    start_month: 11
    start_year: 2019
    steps:
      - month: 0
        focus: sam
        text: >
          Between late August and mid-September 2019 the westerly jet high in
          the stratosphere over Antarctica slowed abruptly and the polar
          stratosphere warmed by a record amount. From mid-October to
          December the weakened winds reached the surface and pushed the mode
          to a record negative: high pressure over Antarctica, the westerly
          belt loosened and spread north. Forecast systems had seen it coming
          from late July. The map holds the negative phase for a year; the
          real swing lasted about three months.
        sources: [lim_2021, lim_2019]

      - month: 0
        focus: iod
        text: >
          Already in phase from the first frame, and five months old. The
          dipole grew from June 2019 into one of the strongest positive events
          on record and dried the winter and spring across most of Australia
          before the mode swung. Its lags are counted from June, so nothing of
          it is still waiting when the year shown begins.
        sources: [bom_iod, doi_2020, wang_cai_2020]

      - month: 0
        focus: east_australia_rainfall
        text: >
          Two arrows, the same way. The dipole's dry arrow is here from the
          winter; the negative mode's summer link starts in November and adds
          hot, dry northwesterly winds crossing New South Wales and southern
          Queensland. November 2019 brought record heat and dryness to
          subtropical eastern Australia, and severe fires burned through the
          late spring. The ENSO marker is grey:
          there was no El Niño that year, which is the point of this story.
        sources: [lim_2021, lim_2019]

      - month: 0
        focus: southeast_australia_rainfall
        text: >
          Dry from the dipole alone. The mode's own link to Victoria and
          South Australia is the winter one, and in November it is out of
          season, so the marker shows one arrow, not two. Both arrows leave
          in December: the dipole's season ends, and the real dipole
          collapsed then as well, when the monsoon winds reversed.
        sources: [doi_2020, hendon_2007]

      - month: 2
        focus: east_australia_rainfall
        text: >
          The map still shows eastern Australia dry from the mode; the
          dipole's arrow has gone. The fires peaked around the New Year. In
          reality the mode had already let go: the record negative phase ran
          from mid-October to December. From here on the map and the season
          part ways. That is the gap between a tendency held for a year and
          a swing that lasted three months; the mode's card says so.
        sources: [lim_2021]

      - month: 6
        focus: enso
        text: >
          A postscript. The dipole's contested link to the following year
          counts eleven months from June 2019, so in May 2020 the map nudges
          the Pacific toward La Niña, drawn dotted and one tier down. A La
          Niña did form in the second half of 2020. Whether the dipole
          helped it along, or the Pacific was heading there anyway, is
          exactly what the dotted line is for.
        sources: [izumo_2010, noaa_cpc_oni]

  - id: positive_pdo_2014_15
    title: "2014–15: the North Pacific flips warm"
    intro: >
      After a mostly cool decade, the Pacific Decadal Oscillation swung
      positive in 2014. A huge patch of warm water, nicknamed "the Blob", had
      built up in the northeast Pacific the winter before and spread to the
      coast, and by late 2014 the whole basin wore the warm-phase pattern.
      The year shown begins in November 2014 with the oscillation positive;
      El Niño is set to begin in March 2015, when it did. Watch the Pacific
      Northwest, and watch the Southwest for the place where the map's
      tendency and the real winter parted ways.
    driver: pdo
    phase: positive
    drivers:
      - driver: enso
        phase: el_nino
        start_month: 3
    start_month: 11
    start_year: 2014
    steps:
      - month: 0
        focus: pdo
        text: >
          In the winter of 2013–14 a strong, stubborn ridge of high pressure
          sat over the northeast Pacific. Under it the ocean lost less heat
          than usual and the water warmed by the largest amount seen there
          since at least the 1980s. The warm patch spread to the coast in
          spring and summer 2014, and NOAA's index for the oscillation
          turned positive and stayed there. The map holds the phase for a
          year; the real one lasted several.
        sources: [bond_2015, di_lorenzo_mantua_2016, noaa_ncei_pdo]

      - month: 3
        focus: pacific_northwest_winter
        text: >
          The map expects a mild, dry winter in the Northwest, and the
          winter of 2014–15 was mild above all. Near-normal precipitation
          fell as rain instead of snow, and by spring more than four fifths
          of the snow-measuring sites in the far west were at record lows. The warm sea surface, not a lack of storms, was the main
          cause: model experiments put its share at about twice that of
          human warming.
        sources: [mote_2016, bond_2015]

      - month: 3
        focus: us_southwest_winter
        text: >
          Here the pattern broke. The dotted line says the Southwest tends
          to be wetter in a warm phase, and the map paints it wet. The
          winter of 2014–15 instead kept California in its exceptional
          2011–2015 drought: the wet winter the dotted line promises did
          not reach it. The oscillation's rainfall signals are weak; El
          Niño does most of the work, and El Niño had not yet arrived.
        sources: [mote_2016, mccabe_2004]

      - month: 4
        focus: enso
        text: >
          In March 2015 NOAA declared an El Niño, which grew through the year
          into one of the three strongest on record. On this map it is a
          chosen driver, entering its phase four months after the start, so
          nothing pushes it. Notice that a positive oscillation and an El
          Niño are the usual pairing, not a coincidence: much of the
          oscillation is El Niño's footprint in the North Pacific, and the
          warm water of 2014 had helped set the stage.
        sources: [noaa_cpc_oni, newman_2016, di_lorenzo_mantua_2016]

      - month: 12
        focus: us_southwest_winter
        text: >
          A year on, in November 2015, two arrows point at the Southwest the
          same way, wet: the oscillation's dotted one and El Niño's solid
          one, whose lag has now run. Where two drivers agree the map simply
          holds the state, and the card rates the pair by the weaker line.
          This is the pairing the research singles out: El Niño's winter
          pattern over North America comes through most reliably when the
          North Pacific is in its warm phase. Whether the rain delivers is
          for the record to say; the map only says the odds have lined up.
        sources: [gershunov_barnett_1998, mantua_1997]

  - id: positive_amo_1995
    title: "1995: the Atlantic turns warm"
    intro: >
      After thirty years in its cool phase the North Atlantic swung warm in
      1995, and the swing showed up at once: the busiest hurricane season
      in decades, the beginning of a partial recovery of the Sahel's rains,
      and a run of warmer European summers. The year shown begins in June
      1995 with the oscillation positive; a weak La Niña is set to begin in
      September, when it did. Watch the hurricane region in October, where
      the two drivers point the same way, and read the last step for what
      the map cannot settle.
    driver: amo
    phase: positive
    drivers:
      - driver: enso
        phase: la_nina
        start_month: 9
    start_month: 6
    start_year: 1995
    steps:
      - month: 0
        focus: amo
        text: >
          The whole North Atlantic had run cool since the mid-1960s. In 1995
          the basin-wide average crossed back above its long-term mean and
          stayed there, the third warm phase in the record after those of
          the late 1800s and the middle of the twentieth century. The map
          holds the phase for a year; the real one has held for decades.
          Whether the ocean's slow overturning, pollution haze or the
          weather's own noise set the swing is argued over, and the driver
          card says so.
        sources: [enfield_2001, knight_2005, booth_2012, noaa_psl_amo]

      - month: 2
        focus: western_europe_summer
        text: >
          The map paints western Europe warm, on the dashed line of a
          probable link. The summers of the late 1990s and 2000s in
          north-west Europe were warmer than those of the decades before,
          and wetter too, and that shift has been traced in large part to
          the Atlantic's swing to warm rather than to the weather of any
          single year. A few tenths of a degree over a decade, felt as more
          hot summers than cool ones.
        sources: [sutton_dong_2012, sutton_hodson_2005]

      - month: 3
        focus: sahel_rainfall
        text: >
          The Sahel had lived through the drought of the 1970s and 1980s
          with the Atlantic cool. From the mid-1990s its rains came back in
          part, never to the plenty of the 1950s but well above the
          drought years, and the map's solid line says why: a warm North
          Atlantic pulls the tropical rain belt north in summer. Models
          driven by the observed sea temperatures reproduce the drying and
          the partial return; what set the ocean's phases is a separate
          argument.
        sources: [nicholson_2005, giannini_2003, folland_1986]

      - month: 4
        focus: atlantic_hurricanes
        text: >
          Two arrows point at the hurricane region the same way, active:
          the warm Atlantic's solid line and La Niña's, which arrived in
          September. 1995 delivered one of the most active seasons on
          record, with nineteen named storms, and the six seasons from 1995
          to 2000 saw roughly double the activity of the previous
          twenty-four years, a doubling that the research at the time laid
          at the door of the warm Atlantic and the weaker wind shear that
          came with it.
        sources: [landsea_1998, goldenberg_2001, noaa_cpc_oni]

      - month: 12
        focus: amo
        text: >
          A year on, in June 1996, the phase held, and it went on holding:
          the active hurricane era peaked in 2004 and 2005. What the map
          cannot settle is why the Atlantic swings. One camp reads the
          record as a natural cycle of the ocean's overturning; another
          finds that pollution haze and volcanic dust explain most of the
          twentieth-century swings; a third reproduces the pattern without
          any ocean circulation change at all. The links on this map run
          from the warm ocean to the weather and hold whichever camp is
          right; the phase's next turn is the open question.
        sources: [knight_2005, booth_2012, clement_2015]

  - id: atlantic_nino_1984
    title: "1984: the Atlantic's own Niño"
    intro: >
      In early 1984 the trade winds over the equatorial Atlantic slackened
      and warm water spread east to the Gulf of Guinea, the strongest warm
      event in the Atlantic's record to that date. It came in the depths
      of the Sahel drought, with the North Atlantic in its cool phase, and
      it was followed by a weak La Niña in the Pacific. The year shown
      begins in May 1984 with the Atlantic Niño in its warm phase; the
      cool Atlantic Multidecadal Oscillation is set as a second driver
      that began a year earlier, the nearest the map can come to a phase
      that had held since the 1960s.
    driver: atlantic_nino
    phase: warm
    drivers:
      - driver: amo
        phase: negative
        start_month: 5
        starts_before: true
    start_month: 5
    start_year: 1984
    steps:
      - month: 0
        focus: atlantic_nino
        text: >
          In most years the eastern equatorial Atlantic cools sharply in
          May and June as the trade winds push the warm water west. In 1984
          the trades weakened in the early months of the year, the cooling
          failed and the sea off the Gulf of Guinea ran unusually warm
          through the northern summer. Unusual enough to get its own paper
          in Nature: the Atlantic's small cousin of El Niño, seen at full
          size.
        sources: [philander_1986, carton_huang_1994, horel_1986]

      - month: 1
        focus: guinea_coast_rainfall
        text: >
          The coast from Liberia to Nigeria has its main rains in May–July,
          and the map's solid line says a warm Gulf of Guinea feeds them.
          That is the clearest footprint of an Atlantic Niño: wet years on
          the coast come with a weak or missing cold tongue offshore, and
          the coast's rains, unlike the Sahel's, follow the sea just
          offshore rather than the whole tropics.
        sources: [wagner_da_silva_1994, polo_2008, lubbecke_2018]

      - month: 3
        focus: sahel_rainfall
        text: >
          Two arrows point at the Sahel the same way, dry: the cool North
          Atlantic's solid line and the Atlantic Niño's dotted one, and the
          card rates the pair by the weaker line. 1984 was the worst year
          of the long drought. The dotted line is dotted for a reason: the
          old see-saw, in which a warm Gulf of Guinea meant a dry Sahel,
          faded after the 1970s as the Sahel came to follow the Pacific
          and the Indian Ocean as much as the Atlantic. In 1984 the
          Atlantic's two patterns and the wider tropics all leaned the
          same way.
        sources: [nicholson_2013, losada_2012, folland_1986]

      - month: 5
        focus: enso
        text: >
          With the chain on, the Atlantic Niño has pushed ENSO toward La
          Niña from October: rain rising over a warm Atlantic in summer
          strengthens the trade winds over the central Pacific, and the
          Pacific answers by winter. A weak La Niña did form in the Pacific
          in late 1984 and lasted into 1985. The link is dashed, not solid:
          it shows up in the record only since the late 1960s, and it
          nudges the Pacific rather than steering it.
        sources: [rodriguez_fonseca_2009, ding_2012, noaa_cpc_oni]

      - month: 12
        focus: atlantic_nino
        text: >
          A year on, in May 1985, the map still holds the Atlantic Niño in
          its warm phase. The real event had faded by the autumn of 1984;
          an Atlantic Niño lasts three to five months, and the map's
          twelve-month hold is a simplification. Two more cautions travel
          with this driver. The Pacific's own El Niño barely reaches the
          Atlantic, so nothing on this map pushes the Atlantic Niño; and
          the models used for seasonal forecasts still struggle to
          reproduce it at all.
        sources: [lubbecke_2018, keenlyside_latif_2007, chang_2006]

  - id: warm_basin_1998_yangtze
    title: "1998: the Yangtze floods"
    intro: >
      The great El Niño of 1997–98 peaked in the Pacific in December and
      had collapsed by May. What it left behind was a tropical Indian
      Ocean warmed through the winter, at its warmest in February–April
      1998 and still warm into the summer. This story follows that warmth:
      the year shown begins in February 1998 with the basin in its warm
      phase and the chain on, so the map can show the basin nudging the
      Pacific toward the La Niña that followed. The basin is set to last
      eight months, about as long as the real warmth did, so it fades in
      October. The El Niño itself is not set as a second driver: a driver
      chosen by hand is never pushed, and the point of the story is the
      push.
    driver: indian_ocean_basin
    phase: warm
    start_month: 2
    start_year: 1998
    hold_months: 8
    steps:
      - month: 0
        focus: indian_ocean_basin
        text: >
          Through the winter of 1997–98 the El Niño's sinking air sat over
          the Indian Ocean, with clear skies and weak winds, and the whole
          basin gathered heat. By February 1998 the sea from East Africa to
          Sumatra was running unusually warm, and it stayed warm long after
          the Pacific had cooled: the ocean acts like a capacitor, storing
          the El Niño's signal and releasing it onto Asia the following
          summer. Most of the arrows from this marker point at that summer.
        sources: [xie_2009, du_2009, klein_1999]

      - month: 3
        focus: north_indian_ocean_cyclones
        text: >
          The dotted arrow to the Arabian Sea and Bay of Bengal says fewer
          storms than usual before the monsoon, and dotted means contested.
          Here is why. On 9 June 1998 a cyclone came ashore at Kandla in
          Gujarat and killed thousands of people, one of the deadliest
          Arabian Sea storms on record, in exactly the season and the
          year the arrow points to quiet. A tendency is not a forecast,
          the reliable record of these storms is short, and the studies
          behind this arrow are few; it is the least certain on the map.
        sources: [evan_camargo_2011, ng_chan_2011, felton_2013]

      - month: 4
        focus: yangtze_summer_rainfall
        text: >
          In June the summer rain front settled over the Yangtze valley and
          stayed. The warm Indian Ocean had built a strong high over the
          western Pacific, and its winds pumped moist air up the valley for
          weeks. The river rose to its highest since 1954 and the floods of
          July and August took thousands of lives and drove millions from
          their homes. The map's solid arrow is this mechanism: the summer
          after an El Niño, carried into summer by the ocean the El Niño
          left warm.
        sources: [xie_2009, zong_chen_2000, xie_2016]

      - month: 5
        focus: enso
        text: >
          With the chain on, the warm basin has pushed ENSO toward La Niña
          from June: rain rising over a warm Indian Ocean drives an
          easterly wind over the far western Pacific, which pushes the warm
          water west and ends the El Niño quickly. In 1998 the Pacific
          swung from the strongest El Niño on record to La Niña within a
          few months, and by July it was there. The arrow is dashed: the
          push works mostly after strong El Niños, and the Pacific has its
          own reasons for ending one.
        sources: [kug_kang_2006, ohba_ueda_2007, noaa_cpc_oni]

      - month: 6
        focus: west_pacific_typhoons
        text: >
          Two arrows point at the typhoon grounds and both say quiet: the
          warm basin's, through the strong high and the sinking air over
          the Philippine Sea, and the pushed La Niña's own. The 1998
          typhoon season was one of the quietest on record over the open
          western Pacific, even though the sea there was as warm as ever,
          which is what first led researchers to look for the cause in the
          Indian Ocean rather than the Pacific.
        sources: [du_2011, xie_2009]

      - month: 12
        focus: indian_ocean_basin
        text: >
          A year on, in February 1999, the basin's marker has been grey
          since October: this story sets the event to last eight months,
          about as long as the real warmth did, and from then on its
          arrows are drawn faded and apply nothing. Set "Event lasts" to
          the whole year to see what the map would claim if it held the
          basin warm through the winter. Two more cautions travel with
          this driver. The basin mode is mostly the
          echo of an El Niño, not an independent force, so choosing it
          alone is a way of looking at the second half of an El Niño
          story. And the 1998 flood was not only the weather's doing: the
          study of the flood also points to the lakes and forests that had
          once held the water. The map shows the tendency; the damage
          depends on what people have done on the ground.
        sources: [kosaka_2013, zong_chen_2000, xie_2016]

  - id: positive_amm_2005_amazon
    title: "2005: the Amazon dries without an El Niño"
    intro: >
      In the spring of 2005 the tropical Atlantic north of the equator ran
      unusually warm and the rain belt sat well north of its usual place.
      There was no El Niño to blame: the weak one of the previous winter
      had faded, and the studies of what followed find the cause in the
      Atlantic. The year shown begins in March 2005 with the meridional
      mode in its positive phase and no second driver, so the map can show
      what the Atlantic does on its own: the busiest hurricane season on
      record and a drought that stranded boats on the Amazon's western
      rivers.
    driver: atlantic_meridional_mode
    phase: positive
    start_month: 3
    start_year: 2005
    steps:
      - month: 0
        focus: atlantic_meridional_mode
        text: >
          By March 2005 the northern tropical Atlantic was warmer than
          usual and the southern side cooler, and the belt of tropical
          rain that normally sits near 5°N in spring had moved north over
          the warm water. This is the mode in its positive phase. It is
          usually set off by a winter of weak trade winds, from an El Niño
          or a negative North Atlantic Oscillation, and then wind and
          evaporation feed on each other to hold the contrast through
          spring. In 2005 the Pacific was near neutral by spring, so this
          story leaves ENSO out and lets the Atlantic act alone.
        sources: [chiang_vimont_2004, marengo_2008, noaa_psl_amm]

      - month: 1
        focus: northeast_brazil
        text: >
          The first arrow is the shortest. The Nordeste's rainy season
          comes in March and April, when the rain belt reaches its
          southernmost point; with the north Atlantic warm the belt stays
          north and withdraws early, and sinking air sits over Northeast
          Brazil instead. This is the classic mechanism of Nordeste
          drought, worked out in the early 1980s, and it is one of the
          most reliable arrows on the map. El Niño dries the Nordeste in
          the same months through its own arrow, and the two usually
          arrive together, since an El Niño winter tends to warm the north
          Atlantic; here the Atlantic is acting by itself.
        sources: [moura_shukla_1981, hastenrath_greischar_1993, nobre_shukla_1996]

      - month: 3
        focus: atlantic_hurricanes
        text: >
          From June the solid arrow points at the hurricane grounds and
          says active. The 2005 season was the most active on record:
          twenty-eight storms, fifteen of them hurricanes, seven of those
          major, with Katrina among them, and the records for storms,
          hurricanes and total storm energy all broken. A warm northern
          tropical Atlantic with the rain belt north gives storms warm
          water, moist air and weak wind shear, and moves their
          birthplace out over the open Atlantic where they have room to
          grow. The same year sat inside a warm AMO decade, which makes
          such springs more common; had the AMO been chosen too, its
          arrow would point the same way and the map would rate the
          region by the weaker of the two.
        sources: [beven_2008, kossin_vimont_2007, vimont_kossin_2007]

      - month: 6
        focus: southwest_amazon_dry_season
        text: >
          By September the drought in the southwestern Amazon was one of
          the most intense in a hundred years. The Solimões and the
          Madeira fell to record lows, navigation was suspended, villages
          along the rivers were cut off, and with the air 3–5°C warmer
          than usual and the dry season stretched long, fires ran through
          parts of Acre and Rondônia. The mechanism is the arrow's: the
          warm north Atlantic kept the rain belt and the rising air north,
          the trade winds carried less moisture into southern Amazonia,
          and the air over the region sank instead of rising. The arrow is
          dashed, because this is known from two droughts and a short
          record of correlations.
        sources: [marengo_2008, zeng_2008, phillips_2009]

      - month: 7
        focus: southwest_amazon_dry_season
        text: >
          Here is the teaching point. Look at ENSO's marker: it is grey, not
          part of this scenario, and no arrow reaches the Amazon from the
          Pacific. The usual suspect for an Amazon drought is El Niño, as
          in 1926, 1983 and 1998, but those droughts fell in the wet season
          and on the central and eastern side of the basin. The 2005
          drought did not touch central or eastern Amazonia; it fell in the
          dry season, in the southwest, and the studies of it find the
          cause in the Atlantic, whose influence on Amazon rain over
          1979–2005 is comparable to the Pacific's. Five years later, in
          2010, the same warm north Atlantic did it again, and worse.
        sources: [marengo_2008, zeng_2008, marengo_2011]

      - month: 12
        focus: atlantic_meridional_mode
        text: >
          A year on, in March 2006, the map still holds the mode positive.
          The real contrast had faded by late summer 2005, as it usually
          does; the rains returned to the Amazon in October and brought
          floods after February 2006. Two cautions travel with this
          driver. It overlaps the AMO on the map and in its effects, and
          the map does not draw the AMO pushing it, because the same
          tropical warmth would then be counted twice on the hurricanes,
          the Sahel and the Nordeste. And a drought's cost depends on the
          ground as much as the sky: the 2005 dry season turned the forest
          from a store of carbon into a source, and the fires were set by
          people. The map shows the tendency; the damage is a human story.
        sources: [marengo_2008, phillips_2009, vimont_kossin_2007]

  - id: positive_pmm_2014_15
    title: "2014–15: the spring warning that came true late"
    intro: >
      In the spring of 2014 the subtropical north-east Pacific ran warm
      under weak trade winds, the mode's positive pattern, and forecasters
      spoke of a coming El Niño to rival 1997's. The year shown begins in
      March 2014 with the mode positive, no second driver and the chain
      switched on, so the map can do what the mode does: push the Pacific
      toward El Niño by autumn. In reality the El Niño stalled that
      summer, barely reached the threshold in winter, and only became the
      big event a year later. This is the best example in the tool of what
      a dashed arrow means: a precursor raises the odds; it does not fix
      the outcome.
    driver: pacific_meridional_mode
    phase: positive
    start_month: 3
    start_year: 2014
    steps:
      - month: 0
        focus: pacific_meridional_mode
        text: >
          The winter of 2013–14 left a huge patch of warm water in the
          north-east Pacific, nicknamed "the Blob", under a stubborn ridge
          of high pressure and weak winds. By March the mode's index was
          positive: warm water and slack trade winds off Baja California,
          the warmth spreading south-west toward the equator. The map now
          shows the mode's own arrows, dashed, and with the chain on it
          will push ENSO in the autumn. Read the caveat first: most El
          Niños are preceded by a spring like this, but a spring like this
          is not always followed by an El Niño.
        sources: [chang_2007_pmm, bond_2015, di_lorenzo_mantua_2016, noaa_psl_pmm]

      - month: 3
        focus: west_pacific_typhoons
        text: >
          From June a dashed arrow points at the typhoon grounds and says
          active. Rain rising over the mode's warm water sets up a
          response far to the west: low-level westerlies, more spin and
          less wind shear over the south-eastern part of the breeding
          grounds, so typhoons form further east and have longer to grow.
          The arrow is dashed for a reason the card gives: one study finds
          the year-to-year part of this relation weak once the slow swing
          of the tropical Pacific is removed, and it is the model
          experiments that keep the link at probable. The map shows the
          tendency for any positive spring; it does not score the 2014
          season.
        sources: [zhang_2016_pmm_typhoons, gao_2018, liu_2019]

      - month: 6
        focus: enso
        text: >
          By September the map has pushed ENSO into El Niño: the marker
          is outlined as pushed, and a dashed arrow from the mode reaches
          it. This is the whole point of the driver. In the real 2014 the
          Pacific had looked like early 1997 until April, with bursts of
          westerly wind and warm water piled up in the west; then the
          bursts stopped, and in June an exceptionally strong burst of
          easterly wind blew the other way and stalled the event. By
          September the warming was weak and the forecasts of a great El
          Niño had been quietly withdrawn.
        sources: [hu_fedorov_2016, menkes_2014, mcphaden_2015]

      - month: 9
        focus: enso
        text: >
          By December the pushed El Niño has painted its own map one tier
          down: Indonesia and eastern Australia dry, the typhoons active,
          and in the coming months the Gulf Coast, Peru and Hawaii will
          fill in, every arrow dashed because it comes through a pushed
          driver. The real winter of 2014–15 was borderline. NOAA's index
          hovered at the threshold, and no El Niño was declared until
          March 2015. The mode had raised the odds; the summer's winds had
          taken them away again.
        sources: [noaa_cpc_oni, mcphaden_2015, levine_mcphaden_2016]

      - month: 12
        focus: enso
        text: >
          A year on, in March 2015, NOAA declared the El Niño at last. The
          easterly burst that stalled it in 2014 had also stopped the
          Pacific from releasing its stored heat, which gave the 2015
          event a head start, and it grew into one of the three strongest
          on record. The spring of 2015 was itself strongly positive in
          the mode, and its warm subtropical water helped make that year's
          eastern Pacific hurricane season the busiest recorded. So the
          warning came true, a year late. The lesson to carry from this
          story is the one the dashed line always carries: a precursor
          raises the odds, and roughly one spring in three, like 2014,
          comes to nothing.
        sources: [levine_mcphaden_2016, noaa_cpc_oni, murakami_2017, larson_kirtman_2013]

  - id: pinatubo_1991
    title: "1991: Pinatubo"
    intro: >
      On 15 June 1991 Mount Pinatubo in the Philippines produced the
      largest volcanic eruption in living memory and put about twenty
      million tonnes of sulphur dioxide into the stratosphere. The year
      shown begins that June with the eruption on. An El Niño was already
      building in the Pacific and is set as a second driver from
      September, chosen by hand: the record has one, and the map's own
      arrow from the volcano to ENSO is contested. Watch the world cool
      from September, northern Europe turn mild in December while the
      planet as a whole is cool, and the map argue with itself about the
      following June's monsoon. Then read the last step for the two
      further years the map cannot show.
    driver: tropical_eruption
    phase: eruption
    drivers:
      - driver: enso
        phase: el_nino
        start_month: 9
    start_month: 6
    start_year: 1991
    steps:
      - month: 0
        focus: tropical_eruption
        text: >
          After two months of warnings and the evacuation of tens of
          thousands of people, Pinatubo blew on 15 June 1991, in the
          middle of a typhoon. Ash fell across Luzon, but what mattered
          for the world's climate was the sulphur dioxide carried thirty
          kilometres up, three times what El Chichón had released in 1982.
          Satellites watched the cloud circle the globe in about three
          weeks and straddle the equator, which is why its haze spread
          over both hemispheres. The map shows the volcano's arrows
          waiting: the haze takes months to spread and thicken, and its
          effects arrive in order, the cooling first, the winter next,
          the monsoons last.
        sources: [newhall_1997, bluth_1992, self_1996, mccormick_1995]

      - month: 3
        focus: global_mean_temperature
        text: >
          By September the haze covered most of the planet and direct
          sunlight at remote observatories was down by a quarter. The map
          now shows the world cooling, a solid arrow, the one link of
          this driver that nobody disputes. Within months of the eruption
          a climate model had forecast the dip: cooling from late 1991,
          deepest in late 1992, and large enough to overwhelm the warmth
          of the El Niño that was developing. That El Niño enters the map
          this month as the second driver, and from December its own
          arrow will point at this region the other way, so the marker
          will show the two disagreeing. The map cannot weigh them; the
          forecast could, and it was right.
        sources: [hansen_1992, dutton_christy_1992, mccormick_1995, parker_1996]

      - month: 6
        focus: northern_europe_winter
        text: >
          December, and northern Europe and western Russia turn mild on
          the map while the planet as a whole is cool. This is the winter
          warming of volcanic years: the haze heats the tropical
          stratosphere, the polar vortex strengthens, and the westerlies
          carry Atlantic air deep into Eurasia. With the chain on, the
          map also pushes the North Atlantic Oscillation positive and the
          NAO's own winter map follows one tier down. The winter of
          1991–92 really was mild across northern Eurasia and North
          America. Read the caveat before you credit the volcano: the
          pattern is an average over a dozen eruptions, and one careful
          study concludes that this particular mild winter was probably
          chance, or the El Niño's doing.
        sources: [robock_mao_1992, shindell_2004, fischer_2007, polvani_2019, coupe_robock_2021]

      - month: 9
        focus: enso
        text: >
          March 1992. The El Niño peaked through the winter, a moderate
          event by the standards of 1982 or 1997, and the map has held
          two drivers since September. Notice what it does not draw: no
          arrow from the volcano to ENSO, because the El Niño is chosen
          by hand and a chosen driver is never pushed. Pick the volcano
          alone with the chain on and the dotted arrow appears in
          December instead. Whether eruptions favour El Niño is one of the
          open questions on this map: the models and some proxies say
          yes, a thousand years of Pacific coral says no detectable
          effect, and 1991 cannot settle it, because this El Niño was
          already under way when the mountain blew.
        sources: [noaa_cpc_oni, khodri_2017, dee_2020, emile_geay_2008, predybaylo_2017]

      - month: 12
        focus: indian_summer_monsoon
        text: >
          June 1992: the map's last month, and the first monsoon month
          after the haze has spread, so the dashed arrow to the Indian
          monsoon is applied at last, with the El Niño's own arrow beside
          it, both saying weaker. If the chain is on the marker is hatched
          instead: the El Niño has pushed the Indian Ocean into a positive
          dipole and a warm basin, whose arrows say stronger, and the map
          cannot weigh four arrows against each other, the same tension
          the 1997 story shows. In reality India's 1992 monsoon came in
          modestly below normal, and rainfall over land worldwide, with
          the rivers it feeds, fell to the lowest in the record between
          October 1991 and September 1992. The Sahel's rains come a month
          later, just past the year shown, and its arrow stays waiting.
          Here the map stops and the real story does not: by mid-1992 the
          world was about half a degree cooler than before the eruption,
          1992 and 1993 were both cool years, and the haze had mostly
          settled out by 1994. The map holds the eruption on for twelve
          months as a stand-in for a cloud that fades over two years.
        sources: [trenberth_dai_2007, iles_hegerl_2014, zambri_robock_2016, parker_1996, robock_2000]

  - id: easterly_qbo_2009_10
    title: "2009–10: a winter with the wind from the east"
    intro: >
      The winter of 2009–10 had the most negative North Atlantic
      Oscillation in a record going back to the 1820s, and the NAO story
      on this map follows what it did to Europe and America. This story
      asks where the pattern came from. Two of the drivers that tilt the
      odds toward a weak polar vortex were lined up that autumn: the
      Quasi-Biennial Oscillation was easterly at the height the map
      reads, and an El Niño had been building since June. The year shown
      begins in November 2009 with the easterly QBO; the El Niño is set
      as a second driver that began before it. Switch the chain on, and
      watch the NAO turn negative in December, the two arrows into it
      agree in January, and Europe freeze. Then read the last two steps,
      where the map's held phases and the real year part company.
    driver: qbo
    phase: easterly
    drivers:
      - driver: enso
        phase: el_nino
        start_month: 6
        starts_before: true
    start_month: 11
    start_year: 2009
    steps:
      - month: 0
        focus: qbo
        text: >
          November 2009. Singapore's balloons, which have logged the wind
          over the equator every month since 1953, show the stratosphere
          at 25 kilometres blowing from the east since the summer and
          strengthening, while the westerlies of the old phase linger
          only at the lowest levels. A moderate El Niño has been growing
          in the Pacific since June, and the sun is at the bottom of its
          eleven-year cycle. The map draws the QBO as a marker on an
          empty stretch of ocean, because a band of wind that circles
          the globe has no region of its own, and its arrows wait: the
          winter effect begins in December.
        sources: [fu_berlin_qbo, naujokat_1986, fereday_2012, noaa_cpc_oni, lockwood_2010]

      - month: 1
        focus: nao
        text: >
          December. The map pushes the North Atlantic Oscillation
          negative along a dashed arrow, and with the chain on the NAO's
          own winter map follows one tier down. In the real December the
          pressure difference between Iceland and the Azores collapsed
          and stayed collapsed for three months, and the Arctic
          Oscillation, the NAO's hemisphere-wide cousin, had already set
          records that year. From January the El Niño's own arrow into
          the NAO arrives beside the QBO's, and both point the same way.
          The Met Office's later analysis of that winter named exactly
          this combination, a strong El Niño with an easterly QBO, as
          the pairing that favours a sudden warming of the stratosphere,
          and warmings of the polar vortex did play a part in the
          surface weather that followed.
        sources: [holton_tan_1980, fereday_2012, osborn_2011, l_heureux_2010, thompson_2002, baldwin_dunkerton_2001]

      - month: 3
        focus: northern_europe_winter
        text: >
          February 2010. Northern Europe is cold on the map through the
          pushed NAO, at the probable tier because the map has taken two
          hops to get here. In reality Britain had its coldest winter
          since 1978–79, snow lay across Germany and Poland for weeks,
          and the frequency of the negative NAO was unmatched since the
          winter of 1939–40. Now read what the map does not claim. One
          study of this winter traces the pattern to a two-way exchange
          between the stratosphere and the surface, set off by autumn
          snow over Eurasia rather than by the QBO. Another, testing the
          sea, the ice, the tropics, the vortex, the sun and the snow one
          at a time in a forecast model, finds that none of them explains
          the size of what happened, and credits the atmosphere's own
          chaos. The QBO and the El Niño tilted the odds; something else
          rolled the dice.
        sources: [cattiaux_2010, ouzeau_2011, cohen_2010, jung_2011, osborn_2011]

      - month: 9
        focus: atlantic_hurricanes
        text: >
          August 2010, and the map is now wrong twice over, which is the
          point of this step. The QBO's dotted arrow says a quieter
          hurricane season, the old rule from the 1980s, and the El
          Niño's solid arrow agrees; with the chain on, the warm tropical
          Atlantic that the El Niño pushed into being in the spring says
          busier, and the marker is hatched. The real 2010
          season was near a record: the El Niño had died in the spring
          and turned into a La Niña by July, and at 25 kilometres the
          wind over Singapore had swung back to westerly by August. The
          map holds both drivers in the phase they had in November,
          because it cannot yet let a phase end, and the QBO's hurricane
          rule has not worked since about 1990 in any case. Two lessons in
          one marker.
        sources: [gray_1984, camargo_sobel_2010, blunden_2011, fu_berlin_qbo, noaa_cpc_oni]

      - month: 12
        focus: qbo
        text: >
          November 2010, and the year shown ends where a new phase has
          begun: at the height the map reads, the wind over the equator
          had been westerly since late summer. By the old rule that
          should have favoured a strong vortex and a mild, stormy winter
          in Europe. December 2010 was instead the second bitter,
          negative-NAO December in a row, with the Arctic Oscillation
          again the dominant pattern of the Northern Hemisphere. Hold
          that against February: an easterly QBO followed by the coldest
          winter in decades, then a westerly one followed by another. The
          QBO can be forecast years ahead, and it does shift the odds of
          a weak vortex; but forecasting the QBO, as the people who do
          it point out, does not guarantee forecasting the winter it
          leans on.
        sources: [fu_berlin_qbo, blunden_2011, osborn_2011, scaife_2014, andrews_2019]

  - id: low_ice_2012_13
    title: "2012–13: record-low ice, then a cold Eurasian winter"
    intro: >
      In September 2012 the Arctic's summer ice shrank to the smallest
      extent ever measured, and the winter that followed brought weeks of
      deep cold to Siberia, Kazakhstan, Russia and China, and Britain's
      coldest March in more than fifty years. This story follows that
      year from the open water of October to the next October, and asks
      the question the science is still arguing over: did the missing ice
      cause the cold, or did the two merely happen together? The map
      draws every arrow from the ice dotted, because every one is
      contested. Switch the chain on to see the pushed North Atlantic
      Oscillation carry the argument on into Europe, and read the last
      step before deciding.
    driver: barents_kara_ice
    phase: low
    start_month: 10
    start_year: 2012
    steps:
      - month: 0
        focus: barents_kara_ice
        text: >
          October 2012. On 16 September the Arctic's ice had shrunk to
          3.41 million square kilometres, 760,000 below the previous
          record of 2007 and about half the average of the 1980s and
          1990s, after decades of thinning left the pack vulnerable to a
          summer storm in August. By early November large areas of the
          Barents and Kara seas were still open water, the Kara Sea was
          freezing more slowly than anywhere else in the Arctic, and the
          air over the open water in October ran three to four degrees
          warmer than usual. Snow, meanwhile, lay wider across Eurasia
          than in most Octobers: open Barents water feeds Siberian snow,
          which is why this driver and the October snow driver are best
          read as one signal. The map's arrows wait for December.
        sources: [nsidc_2012_minimum, parkinson_comiso_2013, nsidc_2012_november, blunden_2013, rutgers_snow_lab, wegmann_2015]

      - month: 2
        focus: siberia_winter
        text: >
          December 2012. From the end of November the cold air poured
          out: more than six degrees below normal from central Siberia to
          north-eastern China for weeks, below −40°C at Astana in the
          middle of the month, below −25°C in Moscow on Christmas Eve, as
          the Siberian high swelled and spread toward north-western
          Russia. The map draws central Siberia, western Russia and East
          Asia cold along three dotted arrows, and with the chain on it
          pushes the North Atlantic Oscillation negative too. This is the
          winter as the ice studies describe it: a warm Arctic, a cold
          continent, a stronger Siberian high. Hold that thought; the
          argument is about the arrow, not the weather.
        sources: [jma_2012_cold_wave, blunden_2013, honda_2009, mori_2014, petoukhov_semenov_2010]

      - month: 3
        focus: east_asia_winter
        text: >
          January 2013. Between late November and early January China
          recorded its lowest temperatures in twenty-eight years; the
          cold froze part of the Yellow River, trapped a thousand ships
          in Laizhou Bay and killed some 180,000 cattle. On 6 January the
          stratospheric polar vortex split in two in a major sudden
          warming, the very event the second path from the ice is meant
          to produce, and the surface pattern that followed leaned
          negative for weeks. Yet the analysis of that warming traced
          most of the wave energy that broke the vortex to the Pacific
          side of the hemisphere, not to the Barents Sea. The same event
          fits both stories, which is the trouble with one winter.
        sources: [nasa_eo_china_2013, coy_pawson_2015, kim_2014, zhang_2018, blunden_2014]

      - month: 4
        focus: nao
        text: >
          February 2013, the last month in which the map draws the ice's
          arrows; from March they wait for the next winter. The real
          winter did not stop. With the Atlantic pressure see-saw stuck
          in its negative phase, easterly winds off a cold continent gave
          Britain its coldest March since 1962, with snow across England
          and Wales in the third week, and the cold reached deep into
          Germany and Poland. If the ice did this, it did it through the
          stratosphere and a late-winter NAO, the path the studies say
          takes the longest; the map's season is a simplification of
          that, and the caveat on the NAO arrow says how thin the
          evidence for the path is.
        sources: [blunden_2014, hadcet, siew_2020, nakamura_2015, kolstad_screen_2019]

      - month: 12
        focus: barents_kara_ice
        text: >
          October 2013, and the year shown ends with more ice: the summer
          minimum of 2013 was 5.10 million square kilometres, half as
          much again as 2012. The winter that followed was one of the
          mildest on record across Europe and Russia, while the eastern
          United States froze under what the newspapers called the polar
          vortex; the ice story had predicted neither. That is the
          argument in one sentence. On one side, a hundred-member model
          experiment in which the ice loss more than doubled the odds of
          a severe Siberian winter; on the other, ensembles in which
          removing the ice does nothing, a Eurasian cooling trend judged
          more likely chance than ice, and the finding that cold winters
          and low ice coincide because the same weather causes both.
          Sixteen models agree on a push toward the negative NAO worth
          about a tenth of a winter. The winter of 2012–13 is one winter,
          and the argument is about whether it counts.
        sources: [blunden_2014, blunden_2015, mori_2014, blackport_2019, mccusker_2016, smith_2022, cohen_2020]

  - id: high_snow_2009_10
    title: "2009–10: the snow came early, and the winter froze"
    intro: >
      This map now has four stories about one winter. The NAO story
      follows what the record-negative winter of 2009–10 did to Europe
      and America; the QBO story asks whether the wind over the equator
      set it up; the El Niño was building all the while. This story
      follows the fourth claimant, an October when the snow line raced
      south across Siberia, and the group of forecasters who said in the
      autumn that a hard winter would follow, and were right. It is the
      snow index's best year. Switch the chain on to watch the pushed
      North Atlantic Oscillation carry the cold into Europe and the
      eastern United States, then read the last step, which is about the
      Octobers since, when the same index was wrong.
    driver: eurasian_october_snow
    phase: high
    start_month: 10
    start_year: 2009
    steps:
      - month: 0
        focus: eurasian_october_snow
        text: >
          October 2009. In the first week of the month snow lay well
          below normal across Eurasia; over the next three weeks the
          cover advanced by more than fifteen million square kilometres,
          and by the end of October it was the widest since 1976, the
          year that still holds the record. The index this driver is
          built on measures exactly that, the speed of the advance, and
          the statistical forecast that used October snow had been run
          in real time every autumn since 1999. That autumn it called for
          a cold winter across the eastern United States and northern
          Eurasia. The map's arrows wait: the path runs through the
          stratosphere and takes until December.
        sources: [cohen_2010, cohen_jones_2011, cohen_fletcher_2007, gong_2003, rutgers_snow_lab]

      - month: 2
        focus: nao
        text: >
          December 2009. The six steps of the proposed mechanism ran in
          order that autumn: the snow, then a cold, high-pressure
          Siberia from late October, then a burst of wave energy into
          the stratosphere, a warming of the polar vortex in mid-
          November, the disturbance sinking through the lower
          stratosphere, and in December the first of two deep negative
          spells of the Arctic Oscillation at the surface. The map
          pushes the NAO negative along a dotted arrow, and with the
          chain on its winter map follows. Notice who else claims this
          December: the easterly QBO's story and the El Niño both push
          the same marker, and the Met Office's later analysis named
          their pairing, not the snow. Three arrows, one December.
        sources: [cohen_2010, cohen_2007_snow, baldwin_dunkerton_2001, l_heureux_2010, fereday_2012]

      - month: 3
        focus: northern_europe_winter
        text: >
          January 2010. Britain, Germany and Poland were locked under
          continental air; the winter was Britain's coldest since
          1978–79 and the negative NAO its most persistent since 1939–40.
          The map has northern Europe cold twice over: once along the
          snow's own dotted arrow and once through the pushed NAO, both
          from the same October, which is why the marker is not hatched.
          One study of this winter, testing the sea, the ice, the
          tropics, the vortex, the sun and the snow one at a time in a
          forecast model, found that none of them explained the size of
          what happened; the snow's advocates answer that their six
          steps were all observed, in order, twice.
        sources: [osborn_2011, cattiaux_2010, jung_2011, cohen_2010]

      - month: 4
        focus: eastern_north_america_winter
        text: >
          February 2010. The second cycle: a fresh tropospheric
          precursor over Siberia at the end of January, a second
          stratospheric warming, and in February the deepest surface
          spell of the winter. Snowfalls along the Mid-Atlantic coast
          topped 135 centimetres in seventeen days, Washington and
          Baltimore broke their seasonal records, and North American
          snow cover for the winter was the most extensive ever charted.
          The winter Arctic Oscillation finished as the lowest since at
          least 1950. The forecasters who had read the October snow
          reckoned the AO explained more of the winter's temperature
          pattern than the El Niño did, and for this winter the numbers
          agreed with them.
        sources: [cohen_2010, l_heureux_2010, cohen_saito_2003, seager_2010]

      - month: 12
        focus: eurasian_october_snow
        text: >
          October 2010, and the year shown ends with the snow advancing
          again; December 2010 was bitter too. Then the record turns.
          Across the whole twentieth century the snow–winter link cannot
          be found before the 1970s, and it may rise and fall with the
          phase of the QBO or be a statistical accident. In October 2016
          snow spread across 13.5 million square kilometres of Eurasia,
          one of the widest Octobers on the charts; the forecasts built
          on it called for a cold eastern winter, and the United States
          had its sixth-warmest winter on record and its second-warmest
          February. In October 2019 the snow was wide again, and the
          winter that followed had the strongest polar vortex and the
          most positive Arctic Oscillation ever measured, with record
          warmth across Europe and Russia. Since about 2010 the
          forecasters who leaned on the index have been burnt, and the
          index's own rise since 1990 turns out to be partly an artefact
          of how the satellite charts were drawn. Read this driver as
          the plan intends: a real hypothesis, a famous success, and a
          decade of misses, all on one dotted arrow.
        sources: [blunden_2011, peings_2013, douville_2017, peings_2017, rutgers_snow_lab, weather_channel_2016, ncei_winter_2017, lawrence_2020, brown_derksen_2013, henderson_2018]

  - id: el_nino_central_2009_10
    title: "2009–10: an El Niño in the wrong place"
    intro: >
      The El Niño of 2009–10 was strong by the usual index, but its warm
      water sat near the dateline and never reached the coast of South
      America: the strongest central-Pacific El Niño in the satellite
      record. This story runs the map in that kind, "El Niño, central
      Pacific", from August 2009, with the record negative North Atlantic
      Oscillation added as a second driver from December. Watch India's
      monsoon fail, the Atlantic stay quiet where a contested link says
      busier, the eastern United States freeze under two drivers at once,
      and the coast of Peru get no arrow at all, on purpose.
    driver: enso
    phase: el_nino_central
    start_month: 8
    start_year: 2009
    hold_months: 8
    drivers:
      - driver: nao
        phase: negative
        start_month: 12
        hold_months: 3
    steps:
      - month: 0
        focus: enso
        text: >
          August 2009. The Pacific had swung from a La Niña in the spring to
          an El Niño by the summer, and the usual index crossed its
          threshold in the July–September season. But the warmest water sat
          near the dateline, with cooler water on both sides of it, and the
          eastern Pacific off Peru never warmed the way it had in 1997.
          Satellite records since 1982 show the central Pacific warming
          almost twice as strongly in events of this kind, and 2009–10 was
          the strongest of them. The map draws the event in its
          central-Pacific kind: the marker is orange rather than red, and
          five arrows differ from a classic El Niño's.
        sources: [lee_mcphaden_2010, kim_2011_fast_transition, noaa_oni_index]
      - month: 0
        focus: indian_summer_monsoon
        text: >
          India's monsoon had already failed. June brought less than half
          its usual rain, and the season ended 22 per cent short, the worst
          since 1972. Kumar and his colleagues had shown three years
          earlier that it is the El Niños with their warmest water in the
          central Pacific that most reliably dry India, because the
          sinking air that answers the warming settles squarely over the
          subcontinent. 2009 fitted their rule, as 2002 and 2004 had. This
          arrow is the central kind's own link, drawn solid; the classic
          El Niño's monsoon link is not drawn for this kind.
        sources: [kumar_2006, francis_gadgil_2010]
      - month: 2
        focus: atlantic_hurricanes
        text: >
          A dotted arrow, and a lesson in reading one. A classic El Niño
          reliably quietens the Atlantic hurricane season by tearing storms
          apart with wind shear, and that link is not drawn for the central
          kind. In its place is a contested link the other way: one study
          found central-Pacific warming brings a busier season, two others
          found no such thing. The 2009 season had nine named storms, the
          fewest since 1997. So the dotted arrow was wrong this year, and
          the season was quiet anyway, which is exactly what "contested"
          means on this map.
        sources: [berg_avila_2011, kim_webster_curry_2009, lee_wang_enfield_2010]
      - month: 4
        focus: nao
        text: >
          December 2009. The North Atlantic Oscillation fell to the most
          negative winter value in a record going back to the 1820s, and
          this story adds it as a second driver from this month, held for
          three months. What the map cannot show is why: the easterly
          stratospheric wind and the early Siberian snow of that autumn
          each have a story of their own here. From this month the two
          drivers act together on the eastern United States.
        sources: [osborn_2011, cattiaux_2010]
      - month: 5
        focus: eastern_north_america_winter
        text: >
          January 2010. Two arrows reach the eastern United States and
          agree: the negative NAO's cold, and the central kind's own
          contested link, a cold Southeast where a classic El Niño would
          have left the north mild. The winter was bitter and snowy from
          Florida to Washington, and Seager and his colleagues traced the
          snow to exactly this pairing, an El Niño and a strongly negative
          NAO. The map cannot say which driver did more; the studies say
          the NAO did.
        sources: [seager_2010, yu_2012]
      - month: 6
        focus: peru_coast_rainfall
        text: >
          February 2010, the height of the coastal rainy season in a
          classic El Niño, when the map would draw a solid arrow to the
          coast of Peru and Ecuador. It draws none: the classic link is
          not expected in the central-Pacific kind, because the coastal
          downpours need warm water against the coast and this event's
          warmth stayed near the dateline. The card here says so and cites
          why. Nothing on the coast is being predicted; the point is that
          the same index reading can mean two very different maps.
        sources: [takahashi_2011, capotondi_2015, lee_mcphaden_2010]
      - month: 8
        focus: enso
        text: >
          April 2010. The event is over: the index dropped below its
          threshold after the February–April season, so the story holds
          the El Niño for eight months and the marker turns grey here.
          The Pacific then swung into a strong La Niña within months, one
          of the fastest turnarounds on record, and that La Niña has a
          story of its own on this map. "Compare with the record" below
          shows every driver the table has for 2009; the record calls the
          event El Niño, because its index cannot tell the two kinds apart.
        sources: [kim_2011_fast_transition, noaa_oni_index]
