<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Climate Connections</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="header">
        <div>
          <h1>Climate Connections</h1>
          <p class="disclaimer">Shows historical tendencies from published research. Not a forecast, not a simulation.</p>
        </div>
        <div id="month-display" aria-live="polite"></div>
      </header>
      <aside id="controls"></aside>
      <main id="map-container">
        <section class="pane" data-side="a">
          <button type="button" class="pane-head" hidden title="Edit this scenario"></button>
          <div class="pane-map"></div>
        </section>
        <section class="pane" data-side="b" hidden>
          <button type="button" class="pane-head" title="Edit this scenario"></button>
          <div class="pane-map"></div>
        </section>
      </main>
      <p id="print-caption" class="print-only"></p>
      <aside id="card-panel">
        <section id="story" aria-live="polite"></section>
        <section id="year" aria-live="polite"></section>
        <div id="card"></div>
      </aside>
      <footer id="timeline"></footer>
    </div>
    <noscript><p class="noscript">Climate Connections needs JavaScript to draw the map. The data behind it is plain text in <code>data/</code>.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
